<title>ISLAND 7 ルール説明</title>
<style>
  :root{color-scheme:dark;--bg:#000;--fg:#e8f6ff;--dim:#8fb0c4;--acc:#5cf0e0;--line:#1c3347}
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--fg);font-family:"Hiragino Sans","Noto Sans JP",system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
  body{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center}
  #wrap{position:relative;width:min(100vw,calc((100vh - 130px)*16/9))}
  canvas{display:block;width:100%;aspect-ratio:16/9;background:#000}
  #poster{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;cursor:pointer;background:rgba(0,0,0,.45)}
  #poster b{font:700 clamp(12px,2.6vw,20px) ui-monospace,Menlo,monospace;letter-spacing:.3em;color:var(--acc)}
  #poster span{width:clamp(56px,10vw,92px);height:clamp(56px,10vw,92px);border-radius:50%;border:2px solid var(--acc);display:grid;place-items:center;font-size:clamp(22px,4.4vw,38px);color:var(--acc);background:rgba(0,20,30,.5);box-shadow:0 0 34px #5cf0e066}
  #poster i{font-style:normal;font-size:clamp(11px,2.3vw,14px);color:var(--dim)}
  #ui{width:min(100vw,900px);padding:10px 16px 16px;display:flex;flex-direction:column;gap:8px}
  #row{display:flex;align-items:center;gap:10px}
  button{font:inherit;color:var(--fg);background:#0d1f31;border:1px solid var(--line);border-radius:999px;padding:8px 14px;min-height:40px;cursor:pointer}
  #pp{min-width:56px;font-weight:800}
  input[type=range]{flex:1;min-width:0;accent-color:var(--acc);height:28px}
  #time{font:13px ui-monospace,Menlo,monospace;color:var(--dim);white-space:nowrap}
  #chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
  #chips button{flex:none;font-size:12px;padding:6px 11px;min-height:32px;color:var(--dim)}
  #chips button.cur{color:var(--acc);border-color:var(--acc)}
  #hint{position:absolute;left:0;right:0;top:8px;text-align:center;font-size:12px;color:var(--dim);pointer-events:none}
</style>
</head>

/* 画面の脈動：実際に鳴っている音（HITS）に合わせる。統合版では window.I7MODE で BGM を切り替え */
function pulse(t){const L=HITS[window.I7MODE||"cinematic"]||[];let lo=0,hi=L.length;while(lo<hi){const m=(lo+hi)>>1;if(L[m][0]<=t)lo=m+1;else hi=m;}
  let p=0;for(let i=lo-1;i>=0&&t-L[i][0]<.35;i--)p+=L[i][1]*Math.exp(-(t-L[i][0])*11);return Math.min(1,p);}

const clamp=(x,a=0,b=1)=>x<a?a:x>b?b:x, lerp=(a,b,t)=>a+(b-a)*t;
const eOut3=x=>1-Math.pow(1-x,3), eOut4=x=>1-Math.pow(1-x,4), eExpo=x=>x>=1?1:1-Math.pow(2,-10*x);
const eIO=x=>-(Math.cos(Math.PI*x)-1)/2, eBack=x=>{const c=1.4;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)};

const WIN=(t,a,b,fi=.4,fo=.4)=>clamp((t-a)/fi)*clamp((b-t)/fo); // a〜b で出て消える

function tx(s,x,y,o={}){
  const{size=40,weight=700,color="#fff",align="left",sp=0,alpha=1,mono=false,shadow=true,base="middle"}=o;
  g.save(); g.globalAlpha*=alpha; g.font=`${weight} ${size}px ${mono?MONO:SANS}`; g.textBaseline=base; g.fillStyle=color;
  if(shadow){g.shadowColor="rgba(0,8,20,.65)";g.shadowBlur=size*.35;}
  if(!sp){g.textAlign=align;g.fillText(s,x,y);}
  else{
    g.textAlign="left"; const ch=[...s], ws=ch.map(c=>g.measureText(c).width);
    const tot=ws.reduce((a,b)=>a+b,0)+sp*(ch.length-1);
    let cx=align==="center"?x-tot/2:align==="right"?x-tot:x;
    ch.forEach((c,i)=>{g.fillText(c,cx,y);cx+=ws[i]+sp;});
  }
  g.restore();
}
function rr(x,y,w,h,r){g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath();}
function panel(x,y,w,h,o={}){
  const{a=1,fill="rgba(8,28,46,.62)",stroke="rgba(140,235,255,.55)",r=14,lw=2}=o;
  g.save(); g.globalAlpha*=a; rr(x,y,w,h,r); g.fillStyle=fill; g.fill(); g.lineWidth=lw; g.strokeStyle=stroke; g.stroke(); g.restore();
}
function brackets(x,y,w,h,l,col,a=1,lw=3){
  g.save(); g.globalAlpha*=a; g.strokeStyle=col; g.lineWidth=lw; g.beginPath();
  [[x,y,1,1],[x+w,y,-1,1],[x,y+h,1,-1],[x+w,y+h,-1,-1]].forEach(([px,py,sx,sy])=>{g.moveTo(px+sx*l,py);g.lineTo(px,py);g.lineTo(px,py+sy*l);});
  g.stroke(); g.restore();
}
function icon(k,x,y,r,col,lw=5){

// 105–115 日が進む → DAY7
const DAYW=[0,.15,.35,.55,.8,.95],DAYL=["CALM","","RAIN","","TYPHOON APPROACH","FINAL PREPARATION"];
const PH7=[[110.8,"drain","記録的大雨",C.drain],[111.6,"access","ルート崩壊",C.access],[112.4,"eye","台風の目",C.amb],[113.2,"prot","暴風・斜面崩壊",C.prot],[114.0,"life","停電・通信障害",C.life]];

    for(let i=0;i<7;i++){const x=W/2-60+i*120;g.beginPath();g.arc(x,H-LB-60,i<=k?14:9,0,7);g.fillStyle=i===6?"rgba(255,90,95,.3)":i<=k?C.cy:"rgba(190,240,255,.3)";g.fill();if(i===6){g.strokeStyle=C.red;g.lineWidth=3;g.stroke();}
      tx(`D${i+1}`,x,H-LB-96,{size:18,mono:true,align:"center",color:i<=k?C.wh:"rgba(190,240,255,.4)",shadow:false});}

  }
  const eye=WIN(t,112.4,113.2,.1,.12);
  const fx={sway:1};if(t>=110.8)fx.flood=.5*(1-eye);if(t>=111.6)fx.collapse=P(t,111.6,.5);if(t>=113.2)fx.slide=P(t,113.2,.7);if(t>=114)fx.blackout=P(t,114,.4),fx.dead=P(t,114.2,.3);

  world(t,{w:lerp(1,.35,eye),cam:{z:1.1+(t-110)*.05,tilt:.6,rot:-.1+(t-110)*.05,oy:60},fx,rain:1-eye,wind:eye?.1:.8,cover:lerp(.9,.3,eye),dark:lerp(.55,.15,eye)+.3*(fx.blackout||0)});
  [110.1,111.6,113.2].forEach((x,i)=>bolt(300+i*600,i*9+2,t-x));g.restore();
  if(eye>0){const gr=g.createRadialGradient(W/2,H/2,0,W/2,H/2,800);gr.addColorStop(0,`rgba(255,226,160,${.4*eye})`);gr.addColorStop(1,"rgba(255,200,120,0)");g.fillStyle=gr;g.fillRect(0,0,W,H);}
  vignetteCol("rgba(255,20,30,1)",.45);
  tx("DAY 7",W/2,LB+90,{size:44,mono:true,align:"center",color:C.red,sp:24,alpha:P(t,110.1,.2)});
  slam(t,"FINAL STORM",W/2,LB+220,110.1,{size:150,from:1.8});burst(W/2,LB+220,t-110.1,C.red,36,1200,1.2);
  const x0=W/2-720,dx=360,y=H/2+140;
  g.save();g.globalAlpha=P(t,110.4,.4);panel(x0-150,y-120,dx*4+300,260,{fill:"rgba(4,10,20,.8)",stroke:"rgba(255,90,95,.6)"});g.restore();
  PH7.forEach(([st,ic,jp,col],i)=>{const on=t>=st,p=P(t,st,.3,eBack),x=x0+i*dx;
    g.save();g.globalAlpha=P(t,110.4,.4)*(on?1:.3);g.fillStyle="rgba(4,14,26,.9)";g.beginPath();g.arc(x,y-20,56,0,7);g.fill();
    if(on){g.shadowColor=col;g.shadowBlur=30;}ring(x,y-20,56*(on?lerp(1.4,1,p):1),on?col:"rgba(190,240,255,.5)",5);g.shadowBlur=0;icon(ic,x,y-20,28,on?col:"rgba(190,240,255,.5)",6);
    tx(jp,x,y+80,{size:jp.length>5?26:30,weight:900,align:"center"});tx(String(i+1),x-70,y-80,{size:20,mono:true,color:on?col:C.dim});g.restore();
    if(i<4)arrow(x+80,y-20,x+dx-80,P(t,110.4,.4)*.6,"rgba(190,240,255,.7)");
    burst(x,y-20,t-st,col,14,220,.6);});
  if(t>=114.75)fill("#000",1);
}

const RECAP=["7日後に、嵐が来る。","自分たちで、島を育てる。","全部は、できない。","何を優先するか、相談する。","最後に、判断が試される。"];

function e9(t){

  fadeTx(t,"BUILD. CHOOSE. SURVIVE.",W/2,H/2+50,120.9,130,{size:42,mono:true,weight:700,color:C.cy,sp:14});
  fadeTx(t,"島をつくれ。選べ。生き残れ。",W/2,H/2+125,121.5,130,{size:54,weight:800,sp:8});
  const sp=P(t,122.5,.35,eBack);if(sp>0){g.save();g.translate(W/2,H-LB-90);g.scale(sp,sp);rr(-250,-54,500,108,54);g.fillStyle="rgba(92,240,224,.2)";g.fill();g.strokeStyle=C.cy;g.lineWidth=5;g.shadowColor=C.cy;g.shadowBlur=30*(.6+.4*Math.sin(t*8));g.stroke();g.shadowBlur=0;
    tx("DAY 0 START",0,3,{size:48,weight:900,mono:true,align:"center",sp:12,shadow:false});g.restore();sparks(W/2,H-LB-90,t-122.5,C.cy,44,600,1.3);}

/* ---------- 合成 ---------- */
const SCN=[[7.5,e0],[20,e1],[42.5,e2],[67.5,e3],[82.5,e4],[95,e5],[105,e6],[115,e7],[120,e8],[DUR,e9]];
const SHK=[[73,10],[80.3,12],[91.2,8],[100.5,6],[120,10]];
function render(t){
  t=clamp(t,0,DUR-.001);
  g.save();
  const shk=SHK.reduce((m,[h,a])=>t>=h&&t<h+.5?Math.max(m,a*Math.exp(-(t-h)*7)):m,0);
  g.translate(Math.sin(t*97)*shk,Math.cos(t*83)*shk);
  {const z=1+.009*pulse(t);g.translate(W/2,H/2);g.scale(z,z);g.translate(-W/2,-H/2);}
  (SCN.find(s=>t<s[0])||SCN[SCN.length-1])[1](t);
  // 章切り替えのスキャン
  CH.forEach(([c])=>{const l=t-c;if(c>0&&c!==115&&c!==120&&l>=0&&l<.5){const x=lerp(-100,W+100,eIO(l/.5));fill("#fff",.18*(1-l/.5));
    const gr=g.createLinearGradient(x-260,0,x,0);gr.addColorStop(0,"rgba(92,240,224,0)");gr.addColorStop(1,"rgba(92,240,224,.35)");g.fillStyle=gr;g.fillRect(x-260,0,260,H);g.fillStyle="#bffcf4";g.fillRect(x-2,0,4,H);}});
  g.restore();
  g.drawImage(vig,0,0);
  if(!grainPat)grainPat=g.createPattern(grain,"repeat");
  g.save();g.globalAlpha=.045;g.translate((Math.random()*256)|0,(Math.random()*256)|0);g.fillStyle=grainPat;g.fillRect(-256,-256,W+512,H+512);g.restore();
  // レターボックス＋章ラベル＋字幕
  g.fillStyle="#000";g.fillRect(0,0,W,LB);g.fillRect(0,H-LB,W,LB);
  let ci=0;CH.forEach((c,i)=>{if(t>=c[0])ci=i;});
  if(t>=7.5&&t<115){tx(`${String(ci).padStart(2,"0")} · ${CH[ci][1]}`,70,LB/2,{size:22,mono:true,color:"rgba(190,240,255,.7)",sp:6,shadow:false});
    for(let k=1;k<8;k++){g.fillStyle=k===ci?C.cy:k<ci?"rgba(92,240,224,.4)":"rgba(190,240,255,.18)";g.fillRect(W-70-7*46+(k-1)*46,LB/2-3,38,6);}}
  const sub=SUBS.find(s=>t>=s[0]&&t<s[1]);
  if(sub){const a=clamp((t-sub[0])/.2)*clamp((sub[1]-t)/.2);tx(sub[2],W/2,H-LB/2+2,{size:44,weight:700,align:"center",color:"#fff",alpha:a,shadow:false});}
}

/* =====================================================================
   再生（bgm.mp3 に同期）
   ===================================================================== */
const $=id=>document.getElementById(id),pp=$("pp"),seek=$("seek"),timeEl=$("time"),poster=$("poster"),hint=$("hint");
let AC=null,BUF=null,src=null,gain=null,playing=false,off=0,st=0,loadP=null,seeking=false,resumeAfter=false;
const fmt=s=>`${Math.floor(s/60)}:${String(Math.floor(s%60)).padStart(2,"0")}`;
function load(){if(loadP)return loadP;loadP=fetch("bgm.mp3").then(r=>{if(!r.ok)throw new Error(r.status);return r.arrayBuffer();}).then(b=>new Promise((res,rej)=>AC.decodeAudioData(b,res,rej))).then(b=>{BUF=b;}).catch(e=>{console.warn("bgm",e);hint.textContent="音声を読み込めませんでした（映像のみ再生）";});return loadP;}
const LAT=()=>AC?Math.min(.5,(AC.outputLatency||0)+(AC.baseLatency||0)):0; // Bluetooth 等の出力遅延ぶん映像を遅らせる
const now=()=>playing?off+Math.max(0,AC.currentTime-st-LAT()):off;
async function play(from){
  if(!AC){AC=new(window.AudioContext||window.webkitAudioContext)();gain=AC.createGain();gain.connect(AC.destination);}
  if(AC.state==="suspended")await AC.resume();
  hint.textContent="読み込み中…";await load();if(BUF)hint.textContent="";
  stopSrc();off=from===undefined?(off>=DUR-.1?0:off):from;
  if(BUF){src=AC.createBufferSource();src.buffer=BUF;src.connect(gain);src.start(0,Math.min(off,BUF.duration-.01));}
  st=AC.currentTime;playing=true;pp.textContent="⏸";poster.style.display="none";
}
function stopSrc(){if(src){try{src.stop();}catch(e){}src.disconnect();src=null;}}
function pause(){if(!playing)return;off=now();playing=false;stopSrc();pp.textContent="▶";}
pp.onclick=()=>playing?pause():play();
poster.onclick=()=>play(0);
seek.max=DUR;
seek.oninput=()=>{if(!seeking)resumeAfter=playing;seeking=true;if(playing)pause();off=+seek.value;render(off);timeEl.textContent=`${fmt(off)} / ${fmt(DUR)}`;};
seek.onchange=()=>{seeking=false;if(resumeAfter)play(off);};
const chipEls=CH.map(([c,n],i)=>{const b=document.createElement("button");b.textContent=`${String(i).padStart(2,"0")} ${n}`;b.onclick=()=>play(c);$("chips").appendChild(b);return b;});
let last=0,lastT=-1;
function loop(ts){requestAnimationFrame(loop);if(ts-last<28)return;last=ts;
  let t=now();if(playing&&t>=DUR){pause();off=DUR;t=DUR;pp.textContent="↻";}
  if(playing||t!==lastT){render(t);lastT=t;}
  if(!seeking){seek.value=t;timeEl.textContent=`${fmt(Math.min(t,DUR))} / ${fmt(DUR)}`;}
  chipEls.forEach((b,i)=>b.classList.toggle("cur",t>=CH[i][0]&&(i===CH.length-1||t<CH[i+1][0])));}
off=24.5;render(off);off=0;lastT=0;requestAnimationFrame(loop);
window.__render=render;
</script>
