<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ISLAND 7 説明動画</title>
<style>
  :root{color-scheme:dark;--bg:#050b14;--fg:#e8f6ff;--dim:#8fb0c4;--acc:#5cf0e0;--line:#1c3347}
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--fg);font-family:"Hiragino Sans","Noto Sans JP",system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
  body{min-height:100vh;display:flex;flex-direction:column;align-items:center}
  #wrap{position:relative;width:min(100vw,calc((100vh - 150px)*16/9));margin-top:env(safe-area-inset-top)}
  canvas{display:block;width:100%;aspect-ratio:16/9;background:#000}
  #poster{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:rgba(3,8,16,.55);cursor:pointer;text-align:center}
  #poster b{font-size:clamp(14px,3.4vw,26px);letter-spacing:.35em;color:var(--acc);font-family:ui-monospace,Menlo,monospace}
  #poster span{width:clamp(56px,11vw,96px);height:clamp(56px,11vw,96px);border-radius:50%;border:2px solid var(--acc);display:grid;place-items:center;font-size:clamp(24px,5vw,42px);color:var(--acc);box-shadow:0 0 30px #5cf0e055}
  #poster i{font-style:normal;font-size:clamp(11px,2.4vw,15px);color:var(--dim)}
  #ui{width:min(100vw,900px);padding:10px 14px 18px;display:flex;flex-direction:column;gap:10px}
  #row{display:flex;align-items:center;gap:10px}
  button{font:inherit;color:var(--fg);background:#10243a;border:1px solid var(--line);border-radius:999px;padding:8px 14px;min-height:40px;cursor:pointer}
  button.on{background:var(--acc);color:#02141a;border-color:var(--acc);font-weight:700}
  #pp{min-width:64px;font-weight:800}
  input[type=range]{flex:1;accent-color:var(--acc);height:28px}
  #time{font:13px ui-monospace,Menlo,monospace;color:var(--dim);min-width:92px;text-align:right}
  #chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
  #chips button{flex:none;font-size:12px;padding:6px 11px;min-height:32px;color:var(--dim)}
  #chips button.cur{color:var(--acc);border-color:var(--acc)}
  #opts{display:flex;gap:8px;flex-wrap:wrap}
  small{color:var(--dim);font-size:12px;line-height:1.55}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="c" width="1920" height="1080"></canvas>
  <div id="poster"><b>TACTICAL ISLAND SURVIVAL</b><span>▶</span><i>タップで再生（音が出ます・横向き推奨）</i></div>
</div>
<div id="ui">
  <div id="row"><button id="pp">▶</button><input id="seek" type="range" min="0" max="165" step="0.1" value="0"><div id="time">0:00 / 2:45</div></div>
  <div id="chips"></div>
  <div id="opts"><button id="vo" class="on">🎙 ナレーション</button><button id="sub">💬 字幕</button><button id="mu" class="on">🔊 BGM/SE</button></div>
  <small>ISLAND 7 ルール説明兼ティザー（16:9・2分45秒）。映像は正式素材が無いため説明専用の抽象モーショングラフィックで、ゲーム本編の画面ではありません。ナレーションは端末の音声合成です。</small>
</div>

<script>
"use strict";
/* =====================================================================
   ISLAND 7 説明動画 — タイムラインは全て「秒」で一元管理（下の TL / CUES / EV）
   ===================================================================== */
const W = 1920, H = 1080, DUR = 165;
const cv = document.getElementById("c"), g = cv.getContext("2d");
const SANS = '"Hiragino Sans","Noto Sans JP","Yu Gothic",sans-serif';
const MONO = 'ui-monospace,Menlo,Consolas,"Noto Sans Mono",monospace';

/* ---------- 数学 / イージング ---------- */
const clamp=(x,a=0,b=1)=>x<a?a:x>b?b:x, lerp=(a,b,t)=>a+(b-a)*t;
const eOut3=x=>1-Math.pow(1-x,3), eOut4=x=>1-Math.pow(1-x,4), eExpo=x=>x>=1?1:1-Math.pow(2,-10*x);
const eIO=x=>-(Math.cos(Math.PI*x)-1)/2, eBack=x=>{const c=1.4;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)};
const P=(t,a,d,e=eOut3)=>e(clamp((t-a)/d));            // a秒から d秒かけて 0→1
const WIN=(t,a,b,fi=.4,fo=.4)=>clamp((t-a)/fi)*clamp((b-t)/fo); // a〜b で出て消える
const mix=(c1,c2,t)=>c1.map((v,i)=>Math.round(lerp(v,c2[i],t)));
const rgb=c=>`rgb(${c[0]},${c[1]},${c[2]})`;
function mulberry(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const hash=(i)=>{const x=Math.sin(i*127.1+311.7)*43758.5453;return x-Math.floor(x)};

/* ---------- 色 ---------- */
const C={cy:"#5cf0e0",ice:"#bfefff",wh:"#eaf8ff",red:"#ff5a5f",amb:"#ffc857",dim:"#8fb0c4",
 prot:"#9ad7ff",drain:"#5cf0e0",access:"#ffe08a",life:"#ffb26b",A:"#5cf0e0",B:"#ffc857"};
const AB=[
 {k:"prot",jp:"防護",en:"PROTECTION",desc:"暴風・斜面崩壊に備える",col:C.prot},
 {k:"drain",jp:"排水",en:"DRAINAGE",desc:"大雨を処理する",col:C.drain},
 {k:"access",jp:"アクセス",en:"ACCESS",desc:"道路・移動経路を守る",col:C.access},
 {k:"life",jp:"ライフライン",en:"LIFELINE",desc:"電気・通信を守る",col:C.life}];

/* ---------- タイムライン（章・ナレーション） ---------- */
const CHAPTERS=[[0,"PROLOGUE"],[12,"MISSION"],[28,"FOUR ABILITIES"],[50,"ACTION LOOP"],[76,"LIMITED CHOICES"],[99,"INFORMATION"],[117,"TEAM PLAY"],[133,"DAY 7 TEASE"],[154,"TITLE / START"]];
const CUES=[
 [7.7,"7日後、この島に最大級の嵐が来る。"],
 [12.4,"皆さんは2つのチームに分かれ、それぞれ自分たちの島を守ります。"],
 [19.4,"与えられた時間は、7日間。"],
 [28.2,"島を守る力は4つ。"],
 [32.2,"暴風や斜面崩壊に備える、防護。"],
 [36.7,"豪雨を処理する、排水。"],
 [41.2,"道路や移動経路を守る、アクセス。"],
 [45.7,"電気と通信を守る、ライフライン。"],
 [50.2,"DAY1からDAY6までは、基本的に1日2回行動します。"],
 [57.2,"探索して資材を集める。"],
 [63.2,"島を強くする製品を探す。"],
 [70.2,"手に入れた製品を設置する。"],
 [73.2,"資材を使って、島そのものを整備する。"],
 [76.6,"ただし、すべてを完璧にするだけの時間はありません。"],
 [85.3,"今の島の状態。"],[88.0,"残りの行動。"],[90.5,"資材と製品。"],[93.0,"その時点で分かっている情報。"],
 [96.0,"全部を見ながら、何を優先するか決めてください。"],
 [99.6,"そして、このゲームで価値があるのは資材だけではありません。"],
 [104.6,"この先、何が起きるのか。"],[107.6,"どこを強くするべきなのか。"],[110.6,"情報も、大切な資源です。"],
 [117.6,"正解は一つではありません。"],[120.6,"意見が違ったら、話してください。"],[124.6,"最後はチームで一つの判断を選びます。"],
 [133.2,"そして日が進むほど、嵐の姿が見えてきます。"],
 [141.3,"6日間の準備が終われば、いよいよ最終台風。"],
 [148.0,"これまで積み重ねてきた判断が、結果として返ってきます。"],
 [154.4,"島の未来を決めるのは、皆さんの7日間です。"],
 [160.5,"ISLAND 7。さあ、始めましょう。"]];

/* =====================================================================
   描画ユーティリティ
   ===================================================================== */
function tx(s,x,y,o={}){
  const{size=40,weight=700,color="#fff",align="left",sp=0,alpha=1,mono=false,shadow=true,base="middle"}=o;
  g.save(); g.globalAlpha*=alpha; g.font=`${weight} ${size}px ${mono?MONO:SANS}`; g.textBaseline=base; g.fillStyle=color;
  if(shadow){g.shadowColor="rgba(0,8,20,.65)";g.shadowBlur=size*.35;}
  if(!sp){g.textAlign=align;g.fillText(s,x,y);}
  else{
    g.textAlign="left"; const ch=[...s], ws=ch.map(c=>g.measureText(c).width);
    const tot=ws.reduce((a,b)=>a+b,0)+sp*(ch.length-1);
    let cx=align==="center"?x-tot/2:align==="right"?x-tot:x;
    ch.forEach((c,i)=>{g.fillText(c,cx,y);cx+=ws[i]+sp;});
  }
  g.restore();
}
function rr(x,y,w,h,r){g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath();}
function panel(x,y,w,h,o={}){
  const{a=1,fill="rgba(8,28,46,.62)",stroke="rgba(140,235,255,.55)",r=14,lw=2}=o;
  g.save(); g.globalAlpha*=a; rr(x,y,w,h,r); g.fillStyle=fill; g.fill(); g.lineWidth=lw; g.strokeStyle=stroke; g.stroke(); g.restore();
}
function brackets(x,y,w,h,l,col,a=1,lw=3){
  g.save(); g.globalAlpha*=a; g.strokeStyle=col; g.lineWidth=lw; g.beginPath();
  [[x,y,1,1],[x+w,y,-1,1],[x,y+h,1,-1],[x+w,y+h,-1,-1]].forEach(([px,py,sx,sy])=>{g.moveTo(px+sx*l,py);g.lineTo(px,py);g.lineTo(px,py+sy*l);});
  g.stroke(); g.restore();
}
function icon(k,x,y,r,col,lw=5){
  g.save(); g.translate(x,y); g.strokeStyle=col; g.fillStyle=col; g.lineWidth=lw; g.lineCap="round"; g.lineJoin="round"; g.beginPath();
  switch(k){
   case"prot":g.moveTo(0,-r);g.lineTo(r*.8,-r*.55);g.lineTo(r*.8,r*.1);g.quadraticCurveTo(r*.8,r*.7,0,r);g.quadraticCurveTo(-r*.8,r*.7,-r*.8,r*.1);g.lineTo(-r*.8,-r*.55);g.closePath();break;
   case"drain":g.moveTo(0,-r);g.bezierCurveTo(r*.95,-r*.05,r*.8,r,0,r);g.bezierCurveTo(-r*.8,r,-r*.95,-r*.05,0,-r);break;
   case"access":g.moveTo(-r*.75,r);g.lineTo(-r*.18,-r);g.moveTo(r*.75,r);g.lineTo(r*.18,-r);g.moveTo(0,r*.9);g.lineTo(0,r*.55);g.moveTo(0,r*.25);g.lineTo(0,-.05*r);g.moveTo(0,-r*.3);g.lineTo(0,-r*.55);break;
   case"life":g.moveTo(r*.25,-r);g.lineTo(-r*.55,r*.15);g.lineTo(-.02*r,r*.15);g.lineTo(-r*.25,r);g.lineTo(r*.55,-r*.2);g.lineTo(0,-r*.2);g.closePath();break;
   case"eye":g.moveTo(-r,0);g.quadraticCurveTo(0,-r*.95,r,0);g.quadraticCurveTo(0,r*.95,-r,0);g.moveTo(r*.3,0);g.arc(0,0,r*.3,0,7);break;
   case"info":g.arc(0,0,r,0,7);g.moveTo(0,-r*.05);g.lineTo(0,r*.5);g.moveTo(0,-r*.45);g.lineTo(0,-r*.42);break;
   case"bolt":g.moveTo(-r*.4,-r*.8);g.lineTo(r*.6,0);g.lineTo(-r*.4,r*.8);g.closePath();break;
  }
  g.stroke(); g.restore();
}
function ring(x,y,r,col,lw=3,a=1){g.save();g.globalAlpha*=a;g.strokeStyle=col;g.lineWidth=lw;g.beginPath();g.arc(x,y,r,0,7);g.stroke();g.restore();}
function hex(x,y,r,fill,stroke){g.beginPath();for(let i=0;i<6;i++){const a=Math.PI/3*i+Math.PI/6;g.lineTo(x+Math.cos(a)*r,y+Math.sin(a)*r);}g.closePath();if(fill){g.fillStyle=fill;g.fill();}if(stroke){g.strokeStyle=stroke;g.lineWidth=3;g.stroke();}}
function chip(x,y,r,a=1){g.save();g.globalAlpha*=a;g.shadowColor="rgba(0,0,0,.4)";g.shadowBlur=10;hex(x,y,r,"#ffcf7a","#fff3d0");g.shadowBlur=0;hex(x,y,r*.55,null,"rgba(120,70,0,.55)");g.restore();}
function avatar(x,y,r,col,a=1){g.save();g.globalAlpha*=a;g.fillStyle=col;g.beginPath();g.arc(x,y-r*.35,r*.42,0,7);g.fill();g.beginPath();g.moveTo(x-r*.85,y+r*.85);g.quadraticCurveTo(x-r*.85,y+r*.15,x,y+r*.15);g.quadraticCurveTo(x+r*.85,y+r*.15,x+r*.85,y+r*.85);g.closePath();g.fill();g.restore();}
function pips(x,y,n,total,w,h,gap,col,horizontal=true,frac=1){
  for(let i=0;i<total;i++){
    const px=horizontal?x+i*(w+gap):x, py=horizontal?y:y-i*(h+gap);
    rr(px,py,w,h,h*.35); g.fillStyle="rgba(140,235,255,.14)"; g.fill();
    const f=clamp(n-i)*frac; if(f>0){g.save();rr(px,py,w,h,h*.35);g.clip();g.fillStyle=col;g.fillRect(px,py,w*f,h);g.restore();}
    rr(px,py,w,h,h*.35); g.strokeStyle="rgba(190,240,255,.5)"; g.lineWidth=2; g.stroke();
  }
}
function token(x,y,r,used,a=1,pulse=0){
  g.save();g.globalAlpha*=a;
  if(!used){g.shadowColor=C.cy;g.shadowBlur=30+pulse*20;}
  ring(x,y,r,used?"rgba(140,180,200,.4)":C.cy,7);
  g.shadowBlur=0; if(!used){g.fillStyle="rgba(92,240,224,.16)";g.beginPath();g.arc(x,y,r*.88,0,7);g.fill();}
  icon("bolt",x,y,r*.5,used?"rgba(140,180,200,.4)":C.wh,7); g.restore();
}
function tag(s,x,y,col,a=1,size=26){g.save();g.globalAlpha*=a;g.font=`700 ${size}px ${MONO}`;const w=g.measureText(s).width+size*1.2+s.length*size*.12;rr(x,y-size,w,size*2,size*.5);g.fillStyle="rgba(4,14,26,.7)";g.fill();g.strokeStyle=col;g.lineWidth=2;g.stroke();g.restore();tx(s,x+size*.6,y,{size,mono:true,color:col,sp:size*.12,alpha:a});return w;}

/* ---------- 派手な演出ヘルパー ---------- */
function burst(x,y,lt,col,n=28,R=500,life=1.1){
  if(lt<0||lt>life)return;const k=lt/life,e=eOut4(k);
  g.save();g.globalAlpha=(1-k)*.9;g.strokeStyle=col;g.lineWidth=4;g.lineCap="round";g.beginPath();
  for(let i=0;i<n;i++){const a=i/n*Math.PI*2+hash(i)*.25,r0=R*e*.5,r1=R*e*(.75+.3*hash(i+5));g.moveTo(x+Math.cos(a)*r0,y+Math.sin(a)*r0);g.lineTo(x+Math.cos(a)*r1,y+Math.sin(a)*r1);}
  g.stroke();g.lineWidth=Math.max(.5,9*(1-k));g.beginPath();g.arc(x,y,R*e*.85,0,7);g.stroke();g.restore();
}
function sparks(x,y,lt,col,n=28,R=320,life=1.3){
  if(lt<0||lt>life)return;const k=lt/life;g.save();g.fillStyle=col;g.shadowColor=col;g.shadowBlur=12;
  for(let i=0;i<n;i++){const a=hash(i*3+1)*Math.PI*2,v=(.4+hash(i*3+2)*.6)*R,px=x+Math.cos(a)*v*eOut3(k),py=y+Math.sin(a)*v*eOut3(k)+k*k*160;
    g.globalAlpha=(1-k)*.95;g.beginPath();g.arc(px,py,(2+hash(i*3)*4)*(1-k*.6),0,7);g.fill();}
  g.restore();
}
function speedLines(lt,col,k=1,dur=.7){
  if(lt<0||lt>dur)return;const p=lt/dur;g.save();g.globalAlpha=(1-p)*.55*k;g.strokeStyle=col;g.lineWidth=3;g.beginPath();
  for(let i=0;i<44;i++){const a=hash(i+40)*Math.PI*2,r0=260+p*900+hash(i)*200,r1=r0+220+hash(i+7)*380;
    g.moveTo(W/2+Math.cos(a)*r0,H/2+Math.sin(a)*r0*.6);g.lineTo(W/2+Math.cos(a)*r1,H/2+Math.sin(a)*r1*.6);}
  g.stroke();g.restore();
}
function txGlitch(s,x,y,o,k){
  if(k>.03){g.save();g.globalCompositeOperation="lighter";
    [["rgba(255,40,90,.9)",-1],["rgba(40,230,255,.9)",1]].forEach(([c,d])=>tx(s,x+d*k*16,y+d*k*3,{...o,color:c,shadow:false,alpha:(o.alpha===undefined?1:o.alpha)*.85}));g.restore();}
  tx(s,x,y,o);
}
function bolt(x,seed,lt){
  if(lt<0||lt>.35)return;g.save();g.globalAlpha=1-lt/.35;g.strokeStyle="#fff";g.shadowColor="#8fd8ff";g.shadowBlur=40;g.lineWidth=6;g.lineJoin="round";g.beginPath();
  let px=x;g.moveTo(px,-20);for(let i=1;i<=9;i++){px+=(hash(seed+i)-.5)*160;g.lineTo(px,i*58);}g.stroke();g.lineWidth=2.5;g.stroke();g.restore();
}
const HITS=[[12,"#ffffff",1],[28,C.cy,.7],[50,C.cy,.6],[96,"#ffffff",.9],[99,C.cy,.6],[117,"#ffffff",.85],[133,C.cy,.7],[141,C.red,1.1],[149.6,C.red,.9],[160.4,"#ffffff",1.3]];
const SHK=[[12,10],[96,10],[117,9],[141,16],[149.6,14],[160.4,12]];
function hitFx(t){HITS.forEach(([h,col,k])=>{const lt=t-h;if(lt<0||lt>1.5)return;
  if(lt<.22){g.fillStyle=`rgba(255,255,255,${.5*k*(1-lt/.22)})`;g.fillRect(0,0,W,H);}
  burst(W/2,H/2,lt,col,32,1000*k,1.3);speedLines(lt,col,k);});}

/* ---------- 島（同一ジオメトリを全シーンで共有） ---------- */
const ISL=(()=>{
  const N=84,rad=a=>1+.16*Math.sin(3*a+1)+.10*Math.sin(5*a+2)+.05*Math.sin(9*a+.5);
  const pts=[];for(let i=0;i<N;i++){const a=i/N*Math.PI*2,r=rad(a);pts.push([Math.cos(a)*r*340,Math.sin(a)*r*230]);}
  const rng=mulberry(7),trees=[];
  for(let i=0;i<120&&trees.length<74;i++){const a=rng()*7,u=Math.sqrt(rng())*.82,r=rad(a),x=Math.cos(a)*r*340*u,y=Math.sin(a)*r*230*u;
    if(Math.hypot(x+60,y-40)<105||Math.hypot(x-90,y+45)<70)continue;trees.push([x,y,10+rng()*9,rng()]);}
  const houses=[[-105,12],[-75,50],[-30,28],[-10,70],[-95,85],[20,35]];
  const cat=(p,n)=>{const o=[];for(let i=0;i<p.length-1;i++){const p0=p[Math.max(0,i-1)],p1=p[i],p2=p[i+1],p3=p[Math.min(p.length-1,i+2)];
    for(let k=0;k<n;k++){const t=k/n,t2=t*t,t3=t2*t;o.push([0,1].map(j=>.5*((2*p1[j])+(-p0[j]+p2[j])*t+(2*p0[j]-5*p1[j]+4*p2[j]-p3[j])*t2+(-p0[j]+3*p1[j]-3*p2[j]+p3[j])*t3)));}}o.push(p[p.length-1]);return o;};
  const road=cat([[-330,70],[-220,80],[-110,45],[-10,45],[70,0],[125,-45],[120,-80]],10);
  const drain=cat([[105,-35],[135,10],[120,75],[160,140],[150,215]],10);
  const power=[[-40,60],[40,75],[120,95],[200,95],[265,72]];
  return{pts,rad,trees,houses,road,drain,power,tower:[265,72],hill:[95,-45]};
})();
function poly(k,ox=0,oy=0){g.beginPath();ISL.pts.forEach(([x,y],i)=>i?g.lineTo(x*k+ox,y*k+oy):g.moveTo(x*k+ox,y*k+oy));g.closePath();}
function coastPt(deg){const a=deg*Math.PI/180,r=ISL.rad(a);return[Math.cos(a)*r*340*1.04,Math.sin(a)*r*230*1.04];}
function strokePath(pts,from=0,to=1){const n=pts.length-1;g.beginPath();let st=false;for(let i=Math.floor(from*n);i<=Math.ceil(to*n);i++){const p=pts[Math.min(i,n)];st?g.lineTo(p[0],p[1]):g.moveTo(p[0],p[1]);st=true;}}

function drawIsland(cx,cy,s,o={}){
  const w=o.w||0,t=o.t||0,flip=o.flip?-1:1;
  g.save();g.translate(cx,cy);g.scale(s*flip,s);
  poly(1.28);g.fillStyle=`rgba(120,235,240,${.26-w*.16})`;g.fill();
  poly(1.14);g.fillStyle=`rgba(190,245,245,${.28-w*.14})`;g.fill();

const chime=(at,f,v=.2)=>{[1,2,3.01].forEach((m,i)=>osc(at,"sine",f*m,f*m,.004,1.8/(i+1),v/(i+1),bus.sfx));};
const whoosh=(at,len=.7,up=true,v=.2)=>nz(at,"bandpass",up?300:5000,1.1,len*.9,len*.2,v,bus.sfx,up?6500:260);
const up2=(at,v=.16)=>{osc(at,"triangle",660,660,.003,.12,v,bus.sfx);osc(at+.09,"triangle",990,990,.003,.2,v,bus.sfx);};
const down=(at,v=.16)=>osc(at,"triangle",700,260,.003,.22,v,bus.sfx);
const beep=(at,f=330,v=.2,len=.22)=>osc(at,"square",f,f,.005,len,v,bus.sfx,1600);
const NOTE=n=>440*Math.pow(2,(n-69)/12);
const BEAT=.5;
function genEvents(){
  // ---- SE ----
  ev(5.0,a=>{beep(a,300,.22);boom(a,.6);});ev(5.35,a=>beep(a,300,.22));ev(5.3,a=>{osc(a,"sine",200,2200,.05,.7,.12);whoosh(a,.8,true,.12);});
  ev(6.0,a=>ping(a,1500,.18));ev(6.9,a=>ping(a,1200,.12));for(let i=0;i<6;i++)ev(7.0+i*.16,a=>tick(a,.1,1800+i*180));
  ev(8.0,a=>boom(a,.95));ev(9.0,a=>boom(a,.55));
  const wh=[12,28,50,57,63,70,76,85,99,117,133];wh.forEach(x=>ev(x,a=>whoosh(a,.7,true,.14)));
  ev(12.3,a=>whoosh(a,.9,false,.14));ev(13.3,a=>tick(a,.14));
  for(let k=0;k<4;k++){ev(14.6+k*.35,a=>ping(a,700+k*90,.1));ev(15.9+k*.35,a=>ping(a,700+k*90,.1));}
  for(let i=0;i<7;i++)ev(19.6+i*.45,a=>ping(a,500+i*80,.12));
  for(let i=0;i<4;i++)ev(29+i*.55,a=>tick(a,.12,2000+i*200));
  [32,36.5,41,45.5].forEach((x,i)=>{ev(x,a=>{whoosh(a,.5,false,.12);ping(a,900+i*100,.14);});[.9,2.4].forEach(d=>ev(x+d,a=>up2(a,.13)));});
  ev(50.6,a=>tick(a,.16,1400));ev(51.4,a=>ping(a,900,.14));ev(51.9,a=>ping(a,1050,.14));ev(53.9,a=>down(a));ev(55.7,a=>down(a));
  ev(59.2,a=>ping(a,1100,.16));for(let k=0;k<3;k++)ev(60.9+k*.35,a=>ping(a,900+k*160,.16));
  ev(63.4,a=>whoosh(a,.3,false,.14));ev(63.85,a=>whoosh(a,.3,false,.14));ev(66,a=>ping(a,1300,.2));ev(66.8,a=>whoosh(a,.5,true,.1));ev(68.2,a=>tick(a,.22,900));
  ev(71,a=>whoosh(a,.4,true,.1));ev(71.2,a=>boom(a,.5));ev(72,a=>{boom(a,.8);tick(a,.2,1000);});ev(72.3,a=>up2(a,.16));ev(73.9,a=>{ping(a,900,.12);});ev(74.3,a=>ping(a,1100,.12));ev(74.6,a=>up2(a,.16));
  ev(77,a=>ping(a,600,.14));[78,79.8,81.6].forEach((x,i)=>ev(x,a=>{tick(a,.2,900);up2(a,.14);ping(a,500-i*80,.14);}));
  ev(82.6,a=>{beep(a,220,.22,.15);beep(a+.22,220,.22,.15);});ev(83.4,a=>boom(a,.7));
  [85.4,85.7,88,90.5,90.9,93].forEach((x,i)=>ev(x,a=>tick(a,.15,1800+i*140)));ev(96,a=>boom(a,.7));ev(96.5,a=>osc(a,"sine",300,1600,.03,.6,.1));
  ev(100.5,a=>boom(a,.35));ev(102.6,a=>boom(a,.35));ev(104.2,a=>chime(a,660,.14));ev(105,a=>ping(a,1500,.14));ev(106,a=>ping(a,1200,.12));
  for(let i=0;i<4;i++)ev(107.6+i*.6,a=>ping(a,900+i*140,.16));ev(110.5,a=>chime(a,880,.16));
  [118.5,120.6,122.6,124.1].forEach((x,i)=>ev(x,a=>osc(a,"sine",520+i*70,900+i*90,.003,.14,.2)));ev(126.5,a=>osc(a,"sine",300,1400,.03,.7,.1));ev(127.3,a=>{chime(a,784,.2);chime(a+.12,1047,.16);});
  for(let k=0;k<6;k++)ev(133+k*1.4,a=>{boom(a,.35);tick(a,.2,1200+k*140);});
  // 最終台風
  ev(141,a=>{boom(a,1);nz(a,"highpass",2000,.5,.005,1.4,.4,bus.sfx);});
  [141,143.2,145,146.3].forEach(x=>ev(x,a=>nz(a,"lowpass",600,.6,.02,1.6,.5,bus.sfx,80)));ev(142.8,a=>whoosh(a,.7,true,.2));
  ev(145.3,a=>{nz(a,"lowpass",900,.6,.02,1.4,.6,bus.sfx,100);boom(a,.8);});ev(146.4,a=>boom(a,.7));
  ev(147.3,a=>{chime(a,659,.18);chime(a+.25,880,.14);chime(a+.5,1319,.12);});
  ev(149.6,a=>{boom(a,1);nz(a,"bandpass",500,.7,.3,1.6,.5,bus.sfx,1600);});ev(150.9,a=>nz(a,"lowpass",700,.6,.05,1.6,.5,bus.sfx,90));
  ev(151.9,a=>{osc(a,"sawtooth",240,30,.005,.9,.28,bus.sfx,900);tick(a,.3,300);boom(a,.6);});
  for(let i=0;i<6;i++)ev(152.4+i*.22,a=>nz(a,"highpass",3000,.5,.001,.05,.2*(1-i*.12),bus.sfx));
  // 余韻〜タイトル
  [156.5,157.4,158.3,159.2].forEach((x,i)=>ev(x,a=>chime(a,NOTE([76,79,81,84][i]),.14)));
  ev(160.4,a=>{boom(a,1);osc(a,"sine",180,1800,.05,1.2,.12);[72,79,84].forEach((n,i)=>chime(a+.03*i,NOTE(n),.16));nz(a,"highpass",4000,.5,.01,1.2,.16,bus.sfx);});
  ev(161.3,a=>tick(a,.12));ev(163.3,a=>{chime(a,NOTE(88),.16);chime(a+.14,NOTE(84),.12);});
  // ---- BGM（120BPM / サイドチェイン）----
  const CHs=[{r:45,t:[57,60,64]},{r:41,t:[53,57,60]},{r:48,t:[55,60,64]},{r:43,t:[55,59,62]}];
  const LM=[[[0,81,.75],[.75,79,.25],[1,76,.5],[1.5,79,.5],[2,81,1],[3,84,.5]],[[0,77,.75],[.75,76,.25],[1,72,.5],[1.5,76,.5],[2,77,1],[3,81,.5]],
            [[0,79,.75],[.75,76,.25],[1,72,.5],[1.5,76,.5],[2,79,1],[3,84,.5]],[[0,79,.75],[.75,74,.25],[1,71,.5],[1.5,74,.5],[2,79,1],[3,83,.5]]];
  const Z=t=>{
    if(t<12||t>=133)return null;
    if(t<76)return{kick:.85,bass:.16,arp:t<28?.06:.075,pad:.05,hat:t>=14,clap:t>=20,lead:(t>=20&&t<28)||t>=50,shk:t>=50};
    if(t<85.3)return{kick2:.32,pad:.05,tickm:1};
    if(t<96)return{kick:t>=90.5?.7:0,bass:t>=88?.13:0,arp:.055,pad:t>=93?.05:.03,hat:t>=90.5,clap:t>=93};
    if(t<99)return{kick:.9,bass:.16,arp:.075,pad:.05,hat:1,clap:1,lead:1};
    if(t<117)return{kick:.4,bass:t>=104.6?.1:0,arp16:.05,pad:.05,hat:t>=104.6,clap:t>=110.5,lead:t>=110.5};
    return{kick:.9,bass:.17,arp:.085,arp2:1,pad:.055,hat:1,clap:1,lead:1,shk:1,stab:.07};
  };
  const nst=Math.round((133-12)/.125);
  for(let k=0;k<nst;k++){
    const x=12+k*.125,z=Z(x);if(!z)continue;
    const bar=Math.floor(k/16),ch=CHs[bar%4],k16=k%16,b4=k16%4;
    if(b4===0){if(z.kick)ev(x,a=>kickB(a,z.kick));else if(z.kick2&&k16%8===0)ev(x,a=>osc(a,"sine",120,45,.003,.28,z.kick2,bus.bgm));}
    if(z.tickm&&b4===0)ev(x,a=>tick(a,.035,1800));
    if(z.clap&&k16%8===4)ev(x,a=>clapB(a,.3));
    if(z.hat&&b4===2)ev(x,a=>hatB(a,.05,true));
    if(z.shk&&k%2===1)ev(x,a=>hatB(a,.026));
    if(z.bass&&b4===2)ev(x,a=>saw(a,NOTE(ch.r),.22,z.bass,bus.pump,{det:[0],fc:700,fcEnd:260,a:.004,rel:.04}));
    if(z.arp&&k%2===0){const n=ch.t[[0,1,2,1,2,1,0,2][(k/2)%8]]+12;ev(x,a=>{osc(a,"square",NOTE(n),NOTE(n),.003,.2,z.arp,bus.pump,2600);if(z.arp2)osc(a,"square",NOTE(n+12),NOTE(n+12),.003,.12,z.arp*.4,bus.pump,3600);});}
    if(z.arp16){const n=ch.t[[0,1,2,1][k%4]]+12;ev(x,a=>osc(a,"triangle",NOTE(n),NOTE(n),.003,.16,z.arp16,bus.pump,3000));}
    if(k16===0){
      if(z.pad)ch.t.forEach(n=>ev(x,a=>saw(a,NOTE(n),2,z.pad/2.2,bus.pump,{det:[-8,8],fc:1500,a:.12,rel:.4})));
      if(z.lead)LM[bar%4].forEach(([bt,m,ln])=>ev(x+bt*.5,a=>saw(a,NOTE(m),ln*.5*.95,.055,bus.pump,{det:[-7,7],fc:3400,a:.01,rel:.09})));
    }
    if(z.stab&&b4===2)ev(x,a=>ch.t.forEach(n=>saw(a,NOTE(n+12),.16,z.stab/3,bus.pump,{det:[-6,6],fc:3200,a:.004,rel:.05})));
  }
  // ライザー・クラッシュ・ドロップ
  ev(9,a=>riser(a,3,.13));[10.5,11,11.25,11.5,11.625,11.75,11.875].forEach((x,i)=>ev(x,a=>snareB(a,.1+i*.03)));
  ev(12,a=>{boom(a,.9,bus.bgm);crash(a,.28);[57,60,64,69].forEach(n=>saw(a,NOTE(n),1.6,.03,bus.pump,{det:[-8,8],fc:2400,a:.01,rel:.6}));});
  [28,50,117].forEach(x=>ev(x,a=>{boom(a,.6,bus.bgm);crash(a,.22);}));
  ev(47,a=>riser(a,3,.1));ev(73.7,a=>riser(a,2.3,.08));ev(94,a=>riser(a,2,.12));ev(114.6,a=>riser(a,2.4,.12));
  ev(96,a=>{boom(a,.9,bus.bgm);crash(a,.3);});ev(99,a=>crash(a,.16));
  // 133–141 ライザー+スネアロール
  ev(133,a=>riser(a,7.8,.12));
  for(let x=133,st=.5;x<140.85;x+=st){ev(x,a=>{kickB(a,.55);snareB(a,.06+(x-133)*.012);});st=x<137?.5:x<139.5?.25:x<140.6?.125:.0625;}
  // 141–147 / 149.6–154 ヘビー
  const heavy=(a0,a1)=>{for(let x=a0,i=0;x<a1;x+=BEAT/2,i++){ev(x,a=>{if(i%2===0){osc(a,"sine",110,45,.004,.4,.6,bus.bgm);osc(a,"sawtooth",55,55,.01,.5,.16,bus.bgm,300);}else if(i%4===1||i%4===3){nz(a,"bandpass",1200,.8,.002,.12,.1,bus.bgm);}
    if(i%4===2)osc(a,"sine",90,40,.004,.3,.4,bus.bgm);if(i%8===0)[45,52,57,60].forEach(n=>saw(a,NOTE(n),.5,.05,bus.bgm,{det:[-9,9],fc:1800,a:.01,rel:.2}));});}};
  heavy(141.6,146.9);heavy(149.6,153.9);
  // 余韻〜タイトル
  const EC=[[60,64,67,72],[59,62,67,71],[57,60,64,69],[53,57,60,65]];
  EC.forEach((c,i)=>c.forEach(n=>ev(154.7+i*1.4,a=>saw(a,NOTE(n),1.5,.02,bus.pump,{det:[-7,7],fc:1700,a:.5,rel:.6}))));
  for(let x=155.2,j=0;x<159.6;x+=.25,j++){const c=EC[Math.min(3,Math.floor((x-154.7)/1.4))],n=c[[0,2,3,2][j%4]]+12;ev(x,a=>osc(a,"sine",NOTE(n),NOTE(n),.003,.4,.045,bus.pump));}
  ev(158.6,a=>riser(a,1.8,.1));
  ev(160.4,a=>{kickB(a,.9);crash(a,.3);[48,60,64,67,71,74,79].forEach(n=>saw(a,NOTE(n),3.4,.032,bus.bgm,{det:[-8,8],fc:3000,a:.03,rel:1.3}));});
  ev(160.9,a=>kickB(a,.6));[72,76,79,83,84,88,91,96].forEach((m,i)=>ev(160.9+i*.09,a=>osc(a,"sine",NOTE(m),NOTE(m),.003,.7,.05,bus.pump)));
}
genEvents();
const EVS=EV.slice().sort((a,b)=>a.t-b.t);let evPtr=0;
function pumpEvents(look=2.5){if(!AC)return;const tn=baseT+Math.max(0,AC.currentTime-ctxT0);
  while(evPtr<EVS.length&&EVS[evPtr].t<tn+look&&EVS[evPtr].t<DUR){const e=EVS[evPtr++];e.f(ctxT0+e.t-baseT);}}
setInterval(()=>pumpEvents(),100);
// 環境音トラック（時刻,値）
const TRK={
 sea:[[0,0],[1.2,.09],[5,.09],[6.5,0],[155.5,0],[157,.06],[160.5,.03],[162,0]],
 rain:[[0,0],[134.5,0],[136,.03],[139,.08],[141,.26],[146.9,.26],[147.2,0],[149.4,0],[149.7,.3],[153.9,.3],[154.1,0]],
 wind:[[0,0],[137,0],[139,.08],[141,.24],[146.9,.24],[147.2,.02],[149.4,.02],[149.7,.4],[153.9,.4],[154.4,0]],
 padA:[[0,0],[1.5,.05],[5,.05],[5.5,.03],[11.5,.03],[12.2,0],[165,0]],
 padC:[[0,0],[153.9,0],[155.5,.05],[160,.06],[164,.04],[165,0]],
 duck:[[0,1],[146.7,1],[147,.05],[149.5,.05],[149.6,1],[153.85,1],[154,0],[155.4,1],[165,1]],
 rumble:[[0,0],[140,0],[141,.5],[146.9,.5],[147.2,0],[149.5,0],[149.7,.55],[153.9,.55],[154,0]]};
function trackVal(p,s){if(s<=p[0][0])return p[0][1];for(let i=1;i<p.length;i++){if(s<p[i][0]){const a=p[i-1],b=p[i];return lerp(a[1],b[1],(s-a[0])/(b[0]-a[0]));}}return p[p.length-1][1];}
function applyTrack(par,p,s,at0){par.setValueAtTime(trackVal(p,s),at0);p.forEach(([t,v])=>{if(t>s)par.linearRampToValueAtTime(v,at0+t-s);});}
function startAudio(s){
  if(AC){try{AC.close();}catch(e){}}
  buildGraph();const at0=AC.currentTime+.12;ctxT0=at0;baseT=s;
  const loopNoise=(dest,type,fc,q)=>{const n=N();n.loop=true;const f=AC.createBiquadFilter();f.type=type;f.frequency.value=fc;f.Q.value=q;const gn=AC.createGain();n.connect(f);f.connect(gn);gn.connect(dest);n.start(at0);return gn;};
  const sea=loopNoise(bus.amb,"lowpass",450,.5);applyTrack(sea.gain,TRK.sea,s,at0);
  const rain=loopNoise(bus.amb,"highpass",1800,.4);applyTrack(rain.gain,TRK.rain,s,at0);
  const wind=loopNoise(bus.amb,"bandpass",420,.7);applyTrack(wind.gain,TRK.wind,s,at0);
  const rum=AC.createOscillator(),rg=AC.createGain(),rf=AC.createBiquadFilter();rum.type="sawtooth";rum.frequency.value=42;rf.type="lowpass";rf.frequency.value=160;rum.connect(rf);rf.connect(rg);rg.connect(bus.amb);rum.start(at0);applyTrack(rg.gain,TRK.rumble,s,at0);
  [[[57,60,64,69,72],"padA"],[[60,67,72,76,83],"padC"]].forEach(([ns,k])=>{const gn=AC.createGain();gn.connect(bus.bgm);ns.forEach((n,i)=>{const o=AC.createOscillator();o.type=i<2?"triangle":"sine";o.frequency.value=NOTE(n-12*(i<2?1:0)+ (i<2?12:0)-12);o.detune.value=(i-2)*4;o.connect(gn);o.start(at0);});applyTrack(gn.gain,TRK[k],s,at0);});
  applyTrack(bus.bgm.gain,TRK.duck,s,at0);
  evPtr=EVS.findIndex(e=>e.t>=s-.001);if(evPtr<0)evPtr=EVS.length;
  pumpEvents();
}
const nowT=()=>playing&&AC?baseT+Math.max(0,AC.currentTime-ctxT0):curT;

/* ---------- ナレーション ---------- */
let jaVoice=null;
function pickVoice(){const v=speechSynthesis.getVoices().filter(x=>/^ja/i.test(x.lang));jaVoice=v.find(x=>/kyoko|o-ren|haruka|google|nanami|female/i.test(x.name))||v[0]||null;}
try{speechSynthesis.onvoiceschanged=pickVoice;pickVoice();}catch(e){}
function speak(text){try{if(!voiceOn||muted)return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang="ja-JP";u.rate=1.08;u.pitch=1;if(jaVoice)u.voice=jaVoice;speechSynthesis.speak(u);}catch(e){}}
function seekCues(t){cuePtr=CUES.findIndex(c=>c[0]>=t-.05);if(cuePtr<0)cuePtr=CUES.length;}

/* ---------- 再生制御 ---------- */
const $=id=>document.getElementById(id),pp=$("pp"),seek=$("seek"),timeEl=$("time"),poster=$("poster");
const fmt=s=>`${Math.floor(s/60)}:${String(Math.floor(s%60)).padStart(2,"0")}`;
function play(from){
  if(from===undefined)from=(!started||curT>=DUR-.2)?0:curT;started=true;
  try{speechSynthesis.cancel();}catch(e){}
  startAudio(from);seekCues(from);playing=true;pausedValid=false;curT=from;pp.textContent="⏸";poster.style.display="none";
  try{if(AC.state==="suspended")AC.resume();}catch(e){}
}
function pause(){if(!playing)return;curT=nowT();playing=false;pausedValid=true;pp.textContent="▶";try{AC.suspend();speechSynthesis.cancel();}catch(e){}}
function stopEnd(){playing=false;curT=DUR;pp.textContent="↻";try{AC.close();}catch(e){}AC=null;}
let pausedValid=false,started=false;
pp.onclick=()=>{if(playing)pause();else if(pausedValid&&AC&&curT<DUR-.2)resume();else play();};
function resume(){playing=true;pausedValid=false;pp.textContent="⏸";AC.resume();}
poster.onclick=()=>play();
let seeking=false;
let resumeAfter=false;
seek.oninput=()=>{if(!seeking)resumeAfter=playing;seeking=true;pausedValid=false;curT=+seek.value;render(curT);timeEl.textContent=`${fmt(curT)} / 2:45`;};
seek.onchange=()=>{seeking=false;if(resumeAfter)play(curT);else{if(playing)pause();seekCues(curT);}};
CHAPTERS.forEach(([t,n],i)=>{const b=document.createElement("button");b.textContent=`${String(i+1).padStart(2,"0")} ${n}`;b.onclick=()=>play(t);$("chips").appendChild(b);});
$("vo").onclick=e=>{voiceOn=!voiceOn;e.target.classList.toggle("on",voiceOn);if(!voiceOn)try{speechSynthesis.cancel();}catch(x){}};
$("sub").onclick=e=>{subOn=!subOn;e.target.classList.toggle("on",subOn);render(nowT());};
$("mu").onclick=e=>{muted=!muted;e.target.classList.toggle("on",!muted);if(bus.master)bus.master.gain.value=muted?0:.9;if(muted)try{speechSynthesis.cancel();}catch(x){}};

let last=0,lastKey="";const chipEls=[...document.querySelectorAll("#chips button")];
function loop(ts){
  requestAnimationFrame(loop);
  if(ts-last<28)return;last=ts;
  const t=seeking?curT:nowT();
  if(playing){
    if(t>=DUR){render(DUR-.01);stopEnd();}
    else{curT=t;while(cuePtr<CUES.length&&CUES[cuePtr][0]<=t){if(t-CUES[cuePtr][0]<1.2)speak(CUES[cuePtr][1]);cuePtr++;}render(t);}
  }else if(!seeking){const key=t+"|"+subOn;if(key!==lastKey){lastKey=key;render(t>=DUR?DUR-.01:t);}}
  if(!seeking){seek.value=Math.min(t,DUR);timeEl.textContent=`${fmt(Math.min(t,DUR))} / 2:45`;}
  chipEls.forEach((b,i)=>b.classList.toggle("cur",t>=CHAPTERS[i][0]&&(i===8||t<CHAPTERS[i+1][0])));
}
seek.max=DUR;curT=8.6;render(curT);requestAnimationFrame(loop);
window.__render=render;window.__DUR=DUR;
</script>
