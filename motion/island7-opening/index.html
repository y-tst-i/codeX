<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ISLAND 7 オープニング</title>
<style>
  :root{color-scheme:dark;--bg:#000;--fg:#e8f6ff;--dim:#8fb0c4;--acc:#5cf0e0;--line:#1c3347}
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--fg);font-family:"Hiragino Sans","Noto Sans JP",system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
  body{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center}
  #wrap{position:relative;width:min(100vw,calc((100vh - 90px)*16/9))}
  canvas{display:block;width:100%;aspect-ratio:16/9;background:#000}
  #poster{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:10px;padding-bottom:13%;cursor:pointer;background:linear-gradient(transparent 55%,rgba(0,0,0,.55))}
  #poster span{width:clamp(56px,10vw,92px);height:clamp(56px,10vw,92px);border-radius:50%;border:2px solid var(--acc);display:grid;place-items:center;font-size:clamp(22px,4.4vw,38px);color:var(--acc);background:rgba(0,20,30,.5);box-shadow:0 0 34px #5cf0e066}
  #poster i{font-style:normal;font-size:clamp(11px,2.3vw,14px);color:var(--dim)}
  #ui{width:min(100vw,900px);padding:10px 16px 16px;display:flex;align-items:center;gap:10px}
  button{font:inherit;color:var(--fg);background:#0d1f31;border:1px solid var(--line);border-radius:999px;padding:8px 14px;min-height:40px;cursor:pointer}
  #pp{min-width:56px;font-weight:800}
  input[type=range]{flex:1;min-width:0;accent-color:var(--acc);height:28px}
  #time{font:13px ui-monospace,Menlo,monospace;color:var(--dim);white-space:nowrap}
  #hint{position:absolute;left:0;right:0;top:8px;text-align:center;font-size:12px;color:var(--dim);pointer-events:none}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="c" width="1920" height="1080"></canvas>
  <div id="poster"><span>▶</span><i>タップで再生（音量を上げて・横向き推奨）</i></div>
  <div id="hint"></div>
</div>
<div id="ui"><button id="pp">▶</button><input id="seek" type="range" min="0" max="75" step="0.05" value="0"><div id="time">0:00 / 1:15</div><button id="again">↺</button></div>
<script>
"use strict";
/* ISLAND 7 オープニングムービー（約75秒）— BGM は gen_bgm.py で合成した bgm.mp3 と秒単位で同期 */
const W=1920,H=1080,DUR=75;
const cv=document.getElementById("c"),g=cv.getContext("2d");
const SANS='"Hiragino Sans","Noto Sans JP","Yu Gothic",sans-serif';
const MONO='ui-monospace,Menlo,Consolas,"Noto Sans Mono",monospace';
/* ---------- 数学 / イージング ---------- */
const clamp=(x,a=0,b=1)=>x<a?a:x>b?b:x, lerp=(a,b,t)=>a+(b-a)*t;
const eOut3=x=>1-Math.pow(1-x,3), eOut4=x=>1-Math.pow(1-x,4), eExpo=x=>x>=1?1:1-Math.pow(2,-10*x);
const eIO=x=>-(Math.cos(Math.PI*x)-1)/2, eBack=x=>{const c=1.4;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)};
const P=(t,a,d,e=eOut3)=>e(clamp((t-a)/d));            // a秒から d秒かけて 0→1
const WIN=(t,a,b,fi=.4,fo=.4)=>clamp((t-a)/fi)*clamp((b-t)/fo); // a〜b で出て消える
const mix=(c1,c2,t)=>c1.map((v,i)=>Math.round(lerp(v,c2[i],t)));
const rgb=c=>`rgb(${c[0]},${c[1]},${c[2]})`;
function mulberry(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const hash=(i)=>{const x=Math.sin(i*127.1+311.7)*43758.5453;return x-Math.floor(x)};

/* ---------- 色 ---------- */
const C={cy:"#5cf0e0",ice:"#bfefff",wh:"#eaf8ff",red:"#ff5a5f",amb:"#ffc857",dim:"#8fb0c4",
 prot:"#9ad7ff",drain:"#5cf0e0",access:"#ffe08a",life:"#ffb26b",A:"#5cf0e0",B:"#ffc857"};
const AB=[
 {k:"prot",jp:"防護",en:"PROTECTION",desc:"暴風・斜面崩壊に備える",col:C.prot},
 {k:"drain",jp:"排水",en:"DRAINAGE",desc:"大雨を処理する",col:C.drain},
 {k:"access",jp:"アクセス",en:"ACCESS",desc:"道路・移動経路を守る",col:C.access},
 {k:"life",jp:"ライフライン",en:"LIFELINE",desc:"電気・通信を守る",col:C.life}];


/* =====================================================================
   描画ユーティリティ
   ===================================================================== */
function tx(s,x,y,o={}){
  const{size=40,weight=700,color="#fff",align="left",sp=0,alpha=1,mono=false,shadow=true,base="middle"}=o;
  g.save(); g.globalAlpha*=alpha; g.font=`${weight} ${size}px ${mono?MONO:SANS}`; g.textBaseline=base; g.fillStyle=color;
  if(shadow){g.shadowColor="rgba(0,8,20,.65)";g.shadowBlur=size*.35;}
  if(!sp){g.textAlign=align;g.fillText(s,x,y);}
  else{
    g.textAlign="left"; const ch=[...s], ws=ch.map(c=>g.measureText(c).width);
    const tot=ws.reduce((a,b)=>a+b,0)+sp*(ch.length-1);
    let cx=align==="center"?x-tot/2:align==="right"?x-tot:x;
    ch.forEach((c,i)=>{g.fillText(c,cx,y);cx+=ws[i]+sp;});
  }
  g.restore();
}
function rr(x,y,w,h,r){g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath();}
function panel(x,y,w,h,o={}){
  const{a=1,fill="rgba(8,28,46,.62)",stroke="rgba(140,235,255,.55)",r=14,lw=2}=o;
  g.save(); g.globalAlpha*=a; rr(x,y,w,h,r); g.fillStyle=fill; g.fill(); g.lineWidth=lw; g.strokeStyle=stroke; g.stroke(); g.restore();
}
function brackets(x,y,w,h,l,col,a=1,lw=3){
  g.save(); g.globalAlpha*=a; g.strokeStyle=col; g.lineWidth=lw; g.beginPath();
  [[x,y,1,1],[x+w,y,-1,1],[x,y+h,1,-1],[x+w,y+h,-1,-1]].forEach(([px,py,sx,sy])=>{g.moveTo(px+sx*l,py);g.lineTo(px,py);g.lineTo(px,py+sy*l);});
  g.stroke(); g.restore();
}
function icon(k,x,y,r,col,lw=5){
  g.save(); g.translate(x,y); g.strokeStyle=col; g.fillStyle=col; g.lineWidth=lw; g.lineCap="round"; g.lineJoin="round"; g.beginPath();
  switch(k){
   case"prot":g.moveTo(0,-r);g.lineTo(r*.8,-r*.55);g.lineTo(r*.8,r*.1);g.quadraticCurveTo(r*.8,r*.7,0,r);g.quadraticCurveTo(-r*.8,r*.7,-r*.8,r*.1);g.lineTo(-r*.8,-r*.55);g.closePath();break;
   case"drain":g.moveTo(0,-r);g.bezierCurveTo(r*.95,-r*.05,r*.8,r,0,r);g.bezierCurveTo(-r*.8,r,-r*.95,-r*.05,0,-r);break;
   case"access":g.moveTo(-r*.75,r);g.lineTo(-r*.18,-r);g.moveTo(r*.75,r);g.lineTo(r*.18,-r);g.moveTo(0,r*.9);g.lineTo(0,r*.55);g.moveTo(0,r*.25);g.lineTo(0,-.05*r);g.moveTo(0,-r*.3);g.lineTo(0,-r*.55);break;
   case"life":g.moveTo(r*.25,-r);g.lineTo(-r*.55,r*.15);g.lineTo(-.02*r,r*.15);g.lineTo(-r*.25,r);g.lineTo(r*.55,-r*.2);g.lineTo(0,-r*.2);g.closePath();break;
   case"eye":g.moveTo(-r,0);g.quadraticCurveTo(0,-r*.95,r,0);g.quadraticCurveTo(0,r*.95,-r,0);g.moveTo(r*.3,0);g.arc(0,0,r*.3,0,7);break;
   case"info":g.arc(0,0,r,0,7);g.moveTo(0,-r*.05);g.lineTo(0,r*.5);g.moveTo(0,-r*.45);g.lineTo(0,-r*.42);break;
   case"bolt":g.moveTo(-r*.4,-r*.8);g.lineTo(r*.6,0);g.lineTo(-r*.4,r*.8);g.closePath();break;
  }
  g.stroke(); g.restore();
}
function ring(x,y,r,col,lw=3,a=1){g.save();g.globalAlpha*=a;g.strokeStyle=col;g.lineWidth=lw;g.beginPath();g.arc(x,y,r,0,7);g.stroke();g.restore();}
function hex(x,y,r,fill,stroke){g.beginPath();for(let i=0;i<6;i++){const a=Math.PI/3*i+Math.PI/6;g.lineTo(x+Math.cos(a)*r,y+Math.sin(a)*r);}g.closePath();if(fill){g.fillStyle=fill;g.fill();}if(stroke){g.strokeStyle=stroke;g.lineWidth=3;g.stroke();}}
function chip(x,y,r,a=1){g.save();g.globalAlpha*=a;g.shadowColor="rgba(0,0,0,.4)";g.shadowBlur=10;hex(x,y,r,"#ffcf7a","#fff3d0");g.shadowBlur=0;hex(x,y,r*.55,null,"rgba(120,70,0,.55)");g.restore();}
function avatar(x,y,r,col,a=1){g.save();g.globalAlpha*=a;g.fillStyle=col;g.beginPath();g.arc(x,y-r*.35,r*.42,0,7);g.fill();g.beginPath();g.moveTo(x-r*.85,y+r*.85);g.quadraticCurveTo(x-r*.85,y+r*.15,x,y+r*.15);g.quadraticCurveTo(x+r*.85,y+r*.15,x+r*.85,y+r*.85);g.closePath();g.fill();g.restore();}
function pips(x,y,n,total,w,h,gap,col,horizontal=true,frac=1){
  for(let i=0;i<total;i++){
    const px=horizontal?x+i*(w+gap):x, py=horizontal?y:y-i*(h+gap);
    rr(px,py,w,h,h*.35); g.fillStyle="rgba(140,235,255,.14)"; g.fill();
    const f=clamp(n-i)*frac; if(f>0){g.save();rr(px,py,w,h,h*.35);g.clip();g.fillStyle=col;g.fillRect(px,py,w*f,h);g.restore();}
    rr(px,py,w,h,h*.35); g.strokeStyle="rgba(190,240,255,.5)"; g.lineWidth=2; g.stroke();
  }
}
function token(x,y,r,used,a=1,pulse=0){
  g.save();g.globalAlpha*=a;
  if(!used){g.shadowColor=C.cy;g.shadowBlur=30+pulse*20;}
  ring(x,y,r,used?"rgba(140,180,200,.4)":C.cy,7);
  g.shadowBlur=0; if(!used){g.fillStyle="rgba(92,240,224,.16)";g.beginPath();g.arc(x,y,r*.88,0,7);g.fill();}
  icon("bolt",x,y,r*.5,used?"rgba(140,180,200,.4)":C.wh,7); g.restore();
}
function tag(s,x,y,col,a=1,size=26){g.save();g.globalAlpha*=a;g.font=`700 ${size}px ${MONO}`;const w=g.measureText(s).width+size*1.2+s.length*size*.12;rr(x,y-size,w,size*2,size*.5);g.fillStyle="rgba(4,14,26,.7)";g.fill();g.strokeStyle=col;g.lineWidth=2;g.stroke();g.restore();tx(s,x+size*.6,y,{size,mono:true,color:col,sp:size*.12,alpha:a});return w;}

/* ---------- 派手な演出ヘルパー ---------- */
function burst(x,y,lt,col,n=28,R=500,life=1.1){
  if(lt<0||lt>life)return;const k=lt/life,e=eOut4(k);
  g.save();g.globalAlpha=(1-k)*.9;g.strokeStyle=col;g.lineWidth=4;g.lineCap="round";g.beginPath();
  for(let i=0;i<n;i++){const a=i/n*Math.PI*2+hash(i)*.25,r0=R*e*.5,r1=R*e*(.75+.3*hash(i+5));g.moveTo(x+Math.cos(a)*r0,y+Math.sin(a)*r0);g.lineTo(x+Math.cos(a)*r1,y+Math.sin(a)*r1);}
  g.stroke();g.lineWidth=Math.max(.5,9*(1-k));g.beginPath();g.arc(x,y,R*e*.85,0,7);g.stroke();g.restore();
}
function sparks(x,y,lt,col,n=28,R=320,life=1.3){
  if(lt<0||lt>life)return;const k=lt/life;g.save();g.fillStyle=col;g.shadowColor=col;g.shadowBlur=12;
  for(let i=0;i<n;i++){const a=hash(i*3+1)*Math.PI*2,v=(.4+hash(i*3+2)*.6)*R,px=x+Math.cos(a)*v*eOut3(k),py=y+Math.sin(a)*v*eOut3(k)+k*k*160;
    g.globalAlpha=(1-k)*.95;g.beginPath();g.arc(px,py,(2+hash(i*3)*4)*(1-k*.6),0,7);g.fill();}
  g.restore();
}
function speedLines(lt,col,k=1,dur=.7){
  if(lt<0||lt>dur)return;const p=lt/dur;g.save();g.globalAlpha=(1-p)*.55*k;g.strokeStyle=col;g.lineWidth=3;g.beginPath();
  for(let i=0;i<44;i++){const a=hash(i+40)*Math.PI*2,r0=260+p*900+hash(i)*200,r1=r0+220+hash(i+7)*380;
    g.moveTo(W/2+Math.cos(a)*r0,H/2+Math.sin(a)*r0*.6);g.lineTo(W/2+Math.cos(a)*r1,H/2+Math.sin(a)*r1*.6);}
  g.stroke();g.restore();
}
function txGlitch(s,x,y,o,k){
  if(k>.03){g.save();g.globalCompositeOperation="lighter";
    [["rgba(255,40,90,.9)",-1],["rgba(40,230,255,.9)",1]].forEach(([c,d])=>tx(s,x+d*k*16,y+d*k*3,{...o,color:c,shadow:false,alpha:(o.alpha===undefined?1:o.alpha)*.85}));g.restore();}
  tx(s,x,y,o);
}
function bolt(x,seed,lt){
  if(lt<0||lt>.35)return;g.save();g.globalAlpha=1-lt/.35;g.strokeStyle="#fff";g.shadowColor="#8fd8ff";g.shadowBlur=40;g.lineWidth=6;g.lineJoin="round";g.beginPath();
  let px=x;g.moveTo(px,-20);for(let i=1;i<=9;i++){px+=(hash(seed+i)-.5)*160;g.lineTo(px,i*58);}g.stroke();g.lineWidth=2.5;g.stroke();g.restore();
}

/* ---------- 島（同一ジオメトリを全シーンで共有） ---------- */
const ISL=(()=>{
  const N=84,rad=a=>1+.16*Math.sin(3*a+1)+.10*Math.sin(5*a+2)+.05*Math.sin(9*a+.5);
  const pts=[];for(let i=0;i<N;i++){const a=i/N*Math.PI*2,r=rad(a);pts.push([Math.cos(a)*r*340,Math.sin(a)*r*230]);}
  const rng=mulberry(7),trees=[];
  for(let i=0;i<120&&trees.length<74;i++){const a=rng()*7,u=Math.sqrt(rng())*.82,r=rad(a),x=Math.cos(a)*r*340*u,y=Math.sin(a)*r*230*u;
    if(Math.hypot(x+60,y-40)<105||Math.hypot(x-90,y+45)<70)continue;trees.push([x,y,10+rng()*9,rng()]);}
  const houses=[[-105,12],[-75,50],[-30,28],[-10,70],[-95,85],[20,35]];
  const cat=(p,n)=>{const o=[];for(let i=0;i<p.length-1;i++){const p0=p[Math.max(0,i-1)],p1=p[i],p2=p[i+1],p3=p[Math.min(p.length-1,i+2)];
    for(let k=0;k<n;k++){const t=k/n,t2=t*t,t3=t2*t;o.push([0,1].map(j=>.5*((2*p1[j])+(-p0[j]+p2[j])*t+(2*p0[j]-5*p1[j]+4*p2[j]-p3[j])*t2+(-p0[j]+3*p1[j]-3*p2[j]+p3[j])*t3)));}}o.push(p[p.length-1]);return o;};
  const road=cat([[-330,70],[-220,80],[-110,45],[-10,45],[70,0],[125,-45],[120,-80]],10);
  const drain=cat([[105,-35],[135,10],[120,75],[160,140],[150,215]],10);
  const power=[[-40,60],[40,75],[120,95],[200,95],[265,72]];
  return{pts,rad,trees,houses,road,drain,power,tower:[265,72],hill:[95,-45]};
})();
function poly(k,ox=0,oy=0){g.beginPath();ISL.pts.forEach(([x,y],i)=>i?g.lineTo(x*k+ox,y*k+oy):g.moveTo(x*k+ox,y*k+oy));g.closePath();}
function coastPt(deg){const a=deg*Math.PI/180,r=ISL.rad(a);return[Math.cos(a)*r*340*1.04,Math.sin(a)*r*230*1.04];}
function strokePath(pts,from=0,to=1){const n=pts.length-1;g.beginPath();let st=false;for(let i=Math.floor(from*n);i<=Math.ceil(to*n);i++){const p=pts[Math.min(i,n)];st?g.lineTo(p[0],p[1]):g.moveTo(p[0],p[1]);st=true;}}

function drawIsland(cx,cy,s,o={}){
  const w=o.w||0,t=o.t||0,flip=o.flip?-1:1;
  g.save();g.translate(cx,cy);g.scale(s*flip,s);
  poly(1.28);g.fillStyle=`rgba(120,235,240,${.26-w*.16})`;g.fill();
  poly(1.14);g.fillStyle=`rgba(190,245,245,${.28-w*.14})`;g.fill();
  poly(1.06);g.fillStyle=rgb(mix([236,222,170],[150,140,110],w));g.fill();
  const gr=g.createLinearGradient(-300,-200,300,220);gr.addColorStop(0,rgb(mix([110,170,96],[54,88,66],w)));gr.addColorStop(1,rgb(mix([58,120,80],[30,62,52],w)));
  poly(1);g.fillStyle=gr;g.fill();
  poly(.55,ISL.hill[0]-10,ISL.hill[1]-10);g.fillStyle=rgb(mix([142,190,110],[78,110,80],w));g.fill();
  poly(.34,ISL.hill[0]-20,ISL.hill[1]-22);g.fillStyle=rgb(mix([168,206,128],[96,128,92],w));g.fill();
  if(o.slide){poly(.55,ISL.hill[0]-10,ISL.hill[1]-10);g.save();g.clip();g.fillStyle=`rgba(120,86,50,${.75*o.slide})`;
    for(let i=0;i<7;i++){g.beginPath();g.ellipse(ISL.hill[0]+30+i*22-60,ISL.hill[1]+20+o.slide*(i%3)*26,26,14+8*o.slide,.5,0,7);g.fill();}g.restore();}
  if(o.prot){poly(.55,ISL.hill[0]-10,ISL.hill[1]-10);g.save();g.shadowColor=C.prot;g.shadowBlur=40*o.prot;g.strokeStyle=`rgba(154,215,255,${.9*o.prot})`;g.lineWidth=6;g.stroke();g.restore();}
  // 木
  const sw=o.sway||0;
  ISL.trees.forEach(([x,y,r,q])=>{g.fillStyle=rgb(mix([46,102,64],[26,60,50],w+q*.2));g.beginPath();g.arc(x+Math.sin(t*3+q*9)*sw*7,y,r,0,7);g.fill();});
  // 排水路
  g.lineCap="round";g.lineJoin="round";
  g.strokeStyle="rgba(60,150,190,.9)";g.lineWidth=10;strokePath(ISL.drain);g.stroke();
  if(o.drain){g.save();g.shadowColor=C.drain;g.shadowBlur=26*o.drain;g.strokeStyle=`rgba(92,240,224,${.95*o.drain})`;g.lineWidth=7;g.setLineDash([26,20]);g.lineDashOffset=-t*90;strokePath(ISL.drain);g.stroke();g.restore();}
  // 道路
  const col=o.collapse||0;
  const roadDraw=(from,to)=>{strokePath(ISL.road,from,to);};
  g.strokeStyle="rgba(50,50,58,.85)";g.lineWidth=20;roadDraw(0,col?.34:1);g.stroke();if(col)roadDraw(.34+col*.2,1),g.stroke();
  g.strokeStyle="#d9d3c3";g.lineWidth=13;roadDraw(0,col?.34:1);g.stroke();if(col)roadDraw(.34+col*.2,1),g.stroke();
  if(o.road){g.save();g.shadowColor=C.access;g.shadowBlur=24*o.road;g.strokeStyle=`rgba(255,224,138,${.95*o.road})`;g.lineWidth=7;g.setLineDash([30,18]);g.lineDashOffset=-t*80;roadDraw(0,col?.34:1);g.stroke();if(col)roadDraw(.34+col*.2,1),g.stroke();g.restore();}
  if(o.risk){const a=.5+.5*Math.sin(t*9);g.save();g.shadowColor=C.red;g.shadowBlur=30;g.strokeStyle=`rgba(255,90,95,${a*o.risk})`;g.lineWidth=13;strokePath(ISL.road,.36,.58);g.stroke();g.restore();}
  if(col){const p=ISL.road[Math.floor(ISL.road.length*.42)];g.fillStyle=`rgba(255,90,95,${.9*(1-Math.abs(col-.5)*1.4)})`;g.beginPath();g.arc(p[0],p[1],40*col,0,7);g.fill();ring(p[0],p[1],60+40*col,C.red,4,1-col*.6);}
  // 家
  const lit=1-(o.blackout||0);
  ISL.houses.forEach(([x,y],i)=>{g.fillStyle="#e9e2d0";g.fillRect(x-16,y-12,32,24);g.fillStyle="#b45a4a";g.beginPath();g.moveTo(x-20,y-12);g.lineTo(x,y-30);g.lineTo(x+20,y-12);g.fill();
    g.fillStyle=lit>.02&&(o.blackout?hash(i+Math.floor(t*12))<lit:true)?"#ffe9a0":"#403c3a";g.fillRect(x-6,y-3,12,12);});
  // 送電線
  const pw=o.power||0,dead=o.dead||0;
  g.strokeStyle=dead?"rgba(120,120,130,.7)":"rgba(40,40,50,.9)";g.lineWidth=3;g.beginPath();ISL.power.forEach((p,i)=>i?g.lineTo(p[0],p[1]-26):g.moveTo(p[0],p[1]-26));g.stroke();
  ISL.power.forEach(p=>{g.fillStyle="#2c2c34";g.fillRect(p[0]-3,p[1]-30,6,32);});

  stopSrc();off=from===undefined?(off>=DUR-.1?0:off):from;
  if(BUF){src=AC.createBufferSource();src.buffer=BUF;src.connect(gain);src.start(0,Math.min(off,BUF.duration-.01));}
  st=AC.currentTime;playing=true;pp.textContent="⏸";poster.style.display="none";
}
function stopSrc(){if(src){try{src.stop();}catch(e){}src.disconnect();src=null;}}
function pause(){if(!playing)return;off=now();playing=false;stopSrc();pp.textContent="▶";}
pp.onclick=()=>playing?pause():play();
poster.onclick=()=>play(0);
$("again").onclick=()=>play(0);
seek.max=DUR;
seek.oninput=()=>{if(!seeking)resumeAfter=playing;seeking=true;if(playing)pause();off=+seek.value;render(off);timeEl.textContent=`${fmt(off)} / ${fmt(DUR)}`;};
seek.onchange=()=>{seeking=false;if(resumeAfter)play(off);};
let last=0,lastT=-1;
function loop(ts){requestAnimationFrame(loop);if(ts-last<28)return;last=ts;
  let t=now();if(playing&&t>=DUR){pause();off=DUR;t=DUR;pp.textContent="↻";}
  if(playing||t!==lastT){render(t);lastT=t;}
  if(!seeking){seek.value=t;timeEl.textContent=`${fmt(Math.min(t,DUR))} / ${fmt(DUR)}`;}}
off=65.6;render(off);off=0;lastT=0;requestAnimationFrame(loop);
window.__render=render;
</script>
