<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="assets/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #03050a; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: #03050a; font-family: "Noto Sans JP", sans-serif; }
      #stage, .shot, .lit, .glow, .fill { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; }
      #stage { transform-origin: 960px 540px; }
      .shot { display: none; }
      .lit { opacity: 0; }
      .glow { opacity: 0; }
      .lit > svg, .lit > canvas, .glow > svg, .glow > canvas { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; }
      #rain, #vig { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; }
      #vig { background: radial-gradient(ellipse 75% 80% at 50% 50%, rgba(0,0,0,0) 45%, rgba(0,0,0,.62) 100%); }
      #burst { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; background: #dfeaff; opacity: 0; }
      #dot { position: absolute; left: 1262px; top: 672px; width: 8px; height: 8px; border-radius: 50%; background: #ffffff; opacity: 0;
             box-shadow: 0 0 10px 4px rgba(230,240,255,.85), 0 0 36px 14px rgba(160,190,255,.35); }
      .sub { position: absolute; left: 210px; top: 930px; width: 1500px; height: 80px; line-height: 80px; text-align: center;
             font-family: "Noto Sans JP", sans-serif; font-weight: 700; font-size: 48px; color: #fffdf5; white-space: nowrap; opacity: 0; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="9" data-width="1920" data-height="1080">
      <svg width="0" height="0" style="position:absolute" aria-hidden="true">
        <defs>
          <filter id="gl" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="9" /></filter>
          <filter id="gl2" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="22" /></filter>
          <filter id="bl3" x="-10%" y="-10%" width="120%" height="120%"><feGaussianBlur stdDeviation="3.5" /></filter>
          <filter id="bl8" x="-10%" y="-10%" width="120%" height="120%"><feGaussianBlur stdDeviation="9" /></filter>
          <filter id="eyeGlow" x="-100%" y="-300%" width="300%" height="700%"><feGaussianBlur stdDeviation="9" /></filter>
          <filter id="cl1" filterUnits="userSpaceOnUse" x="0" y="0" width="1920" height="1080"><feTurbulence type="fractalNoise" baseFrequency="0.0032 0.010" numOctaves="5" seed="7" /><feColorMatrix type="matrix" values="0 0 0 0 .04  0 0 0 0 .07  0 0 0 0 .13  0 0 0 2.7 -.95" /></filter>
          <filter id="cl2" filterUnits="userSpaceOnUse" x="0" y="0" width="1920" height="1080"><feTurbulence type="fractalNoise" baseFrequency="0.006 0.013" numOctaves="5" seed="21" /><feColorMatrix type="matrix" values="0 0 0 0 .04  0 0 0 0 .07  0 0 0 0 .13  0 0 0 2.7 -.9" /></filter>
          <filter id="cl3" filterUnits="userSpaceOnUse" x="0" y="0" width="1920" height="1080"><feTurbulence type="fractalNoise" baseFrequency="0.0022 0.017" numOctaves="5" seed="5" /><feColorMatrix type="matrix" values="0 0 0 0 .04  0 0 0 0 .07  0 0 0 0 .13  0 0 0 2.8 -.9" /></filter>
          <filter id="cl5" filterUnits="userSpaceOnUse" x="0" y="0" width="1920" height="1080"><feTurbulence type="fractalNoise" baseFrequency="0.004 0.011" numOctaves="5" seed="33" /><feColorMatrix type="matrix" values="0 0 0 0 .04  0 0 0 0 .07  0 0 0 0 .13  0 0 0 2.7 -.92" /></filter>
          <filter id="cl6" filterUnits="userSpaceOnUse" x="0" y="0" width="1920" height="1080"><feTurbulence type="fractalNoise" baseFrequency="0.007 0.007" numOctaves="5" seed="11" /><feColorMatrix type="matrix" values="0 0 0 0 .03  0 0 0 0 .05  0 0 0 0 .10  0 0 0 3 -1.05" /></filter>
        </defs>
      </svg>

      <div id="stage">
        <div class="shot" id="s1"><div class="lit" id="l1"></div><div class="glow" id="g1"></div></div>
        <div class="shot" id="s2"><div class="lit" id="l2"></div><div class="glow" id="g2"></div></div>
        <div class="shot" id="s3"><div class="lit" id="l3"></div><div class="glow" id="g3"><canvas id="eyes3" width="1920" height="1080"></canvas></div></div>
        <div class="shot" id="s4"><div class="lit" id="l4"></div><div class="glow" id="g4"><canvas id="eyes4" width="1920" height="1080"></canvas></div></div>
        <div class="shot" id="s5"><div class="lit" id="l5"></div><div class="glow" id="g5"><canvas id="eyes5" width="1920" height="1080"></canvas></div></div>
        <div class="shot" id="s6"><div class="lit" id="l6"></div><div class="glow" id="g6"></div></div>
      </div>
      <canvas id="rain" width="1920" height="1080"></canvas>
      <div id="burst"></div>
      <div id="vig"></div>
      <div id="dot"></div>
      <div class="sub" id="sub1">魔王よ、覚悟！</div>
      <div class="sub" id="sub2">…やれ。</div>
      <div class="sub" id="sub3">ここまで、か…</div>
    </div>

    <script>
      const W = 1920, H = 1080, FPS = 30;
      function prng(seed) { let a = seed >>> 0; return function () { a = (a + 0x6d2b79f5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
      const $ = (id) => document.getElementById(id);

      /* ---------- subtitle ring (text-shadow) ---------- */
      (function () {
        const s = [];
        for (let i = 0; i < 16; i++) { const a = (i / 16) * Math.PI * 2; s.push((3 * Math.cos(a)).toFixed(2) + "px " + (3 * Math.sin(a)).toFixed(2) + "px 0 #0a0a12"); }
        for (let i = 0; i < 8; i++) { const a = (i / 8) * Math.PI * 2 + 0.2; s.push((1.5 * Math.cos(a)).toFixed(2) + "px " + (1.5 * Math.sin(a)).toFixed(2) + "px 0 #0a0a12"); }
        document.querySelectorAll(".sub").forEach((e) => (e.style.textShadow = s.join(",")));
      })();

      /* ---------- shared svg helpers ---------- */
      const SIL = 'fill="#05070c" stroke="rgba(205,222,245,.62)" stroke-width="2.2" stroke-linejoin="round"';
      function grad(id, stops, x2, y2) {
        return '<linearGradient id="' + id + '" x1="0" y1="0" x2="' + (x2 || 0) + '" y2="' + (y2 === undefined ? 1 : y2) + '">' + stops.map((s) => '<stop offset="' + s[0] + '" stop-color="' + s[1] + '"/>').join("") + "</linearGradient>";
      }
      function boltPts(r, x0, y0, x1, y1, segs, jag) {
        const p = [[x0, y0]];
        for (let i = 1; i < segs; i++) { const t = i / segs; p.push([x0 + (x1 - x0) * t + (r() - 0.5) * jag, y0 + (y1 - y0) * t + (r() - 0.5) * jag * 0.35]); }
        p.push([x1, y1]);
        return p;
      }
      const pd = (p) => "M" + p.map((q) => q[0].toFixed(0) + " " + q[1].toFixed(0)).join(" L");
      function bolt(seed, x0, y0, x1, y1, jag, nb, wmul) {
        const r = prng(seed), w = wmul || 1;
        const main = boltPts(r, x0, y0, x1, y1, 11, jag);
        let paths = [[pd(main), 1]];
        for (let k = 0; k < nb; k++) {
          const i = 2 + Math.floor(r() * (main.length - 4));
          const [px, py] = main[i];
          const dir = r() < 0.5 ? -1 : 1;
          const ex = px + dir * (160 + r() * 340), ey = py + 120 + r() * 260;
          const br = boltPts(r, px, py, ex, ey, 6, jag * 0.7);
          paths.push([pd(br), 0.55]);
          if (r() < 0.6) { const j = 2 + Math.floor(r() * 3); const [qx, qy] = br[j]; const b2 = boltPts(r, qx, qy, qx + dir * (80 + r() * 160), qy + 80 + r() * 150, 4, jag * 0.45); paths.push([pd(b2), 0.3]); }
        }
        const glow = paths.map((p) => '<path d="' + p[0] + '" stroke="#cfe0ff" stroke-opacity=".9" stroke-width="' + (30 * p[1] * w).toFixed(1) + '" fill="none" stroke-linejoin="round"/>').join("");
        const core = paths.map((p) => '<path d="' + p[0] + '" stroke="#ffffff" stroke-width="' + (7 * p[1] * w + 1.5).toFixed(1) + '" fill="none" stroke-linejoin="round" stroke-linecap="round"/>').join("");
        return '<g filter="url(#gl2)" opacity=".8">' + glow + '</g><g filter="url(#gl)" opacity=".9">' + paths.map((p) => '<path d="' + p[0] + '" stroke="#fff" stroke-width="' + (14 * p[1] * w).toFixed(1) + '" fill="none"/>').join("") + "</g>" + core;
      }
      function cren(x0, x1, y, tw, th) { let s = ""; for (let x = x0; x + tw <= x1; x += tw * 2) s += "M" + x + " " + y + "h" + tw + "v" + -th + "h" + -tw + "z"; return s; }

      /* ---------- party (back view silhouettes), feet at (0,0) ---------- */
      const P = {
        warrior: () => `<g ${SIL}>
          <path d="M-46 0 L-42 -100 L-6 -100 L-4 0 Z M6 0 L8 -100 L44 -100 L48 0 Z"/>
          <path d="M-70 -252 Q0 -280 70 -252 L60 -96 L-60 -96 Z"/>
          <ellipse cx="-78" cy="-248" rx="35" ry="25"/><ellipse cx="78" cy="-248" rx="35" ry="25"/>
          <circle cx="0" cy="-294" r="33"/>
          <path d="M-26 -310 Q-74 -314 -72 -376 Q-54 -334 -18 -324 Z M26 -310 Q74 -314 72 -376 Q54 -334 18 -324 Z"/>
          <circle cx="0" cy="-172" r="76"/><circle cx="0" cy="-172" r="60" fill="none" stroke-width="2"/><circle cx="0" cy="-172" r="15"/>
          <path d="M64 -60 L84 -64 L112 -404 L98 -406 Z"/><path d="M98 -406 Q176 -446 172 -350 Q142 -374 106 -352 Z"/></g>`,
        mage: () => `<g ${SIL}>
          <path d="M-30 -250 Q0 -264 30 -250 L66 0 L42 -12 L22 4 L0 -10 L-22 4 L-42 -12 L-66 0 Z"/>
          <ellipse cx="0" cy="-246" rx="42" ry="16"/>
          <circle cx="0" cy="-282" r="21"/>
          <ellipse cx="0" cy="-298" rx="62" ry="11"/>
          <path d="M-34 -300 C-30 -362 0 -402 44 -452 C30 -412 38 -352 38 -300 Z"/>
          <rect x="62" y="-432" width="9" height="432"/><circle cx="66" cy="-448" r="20"/>
          <path d="M46 -438 Q52 -482 66 -472 Q80 -482 86 -438" fill="none" stroke-width="5"/>
          <path d="M26 -240 L64 -200 L58 -186 L18 -214 Z"/></g>`,
        priest: () => `<g ${SIL}>
          <path d="M-36 -254 Q0 -272 36 -254 L60 0 L-60 0 Z"/><path d="M0 -250 L0 -4" fill="none" stroke-width="1.6"/>
          <ellipse cx="0" cy="-250" rx="54" ry="18"/>
          <path d="M-34 -262 Q-40 -332 0 -338 Q40 -332 34 -262 Q0 -250 -34 -262 Z"/>
          <rect x="-78" y="-412" width="9" height="412"/>
          <circle cx="-73" cy="-442" r="26" fill="none" stroke="#05070c" stroke-width="9"/><circle cx="-73" cy="-442" r="30.5" fill="none" stroke-width="1.5"/><circle cx="-73" cy="-442" r="21.5" fill="none" stroke-width="1.5"/>
          <path d="M-30 -236 L-70 -196 L-62 -182 L-22 -212 Z"/></g>`,
        leon: () => `<g ${SIL}>
          <path d="M-54 -302 Q0 -320 54 -302 L86 -22 L52 -44 L28 -8 L0 -42 L-26 -10 L-50 -44 L-88 -20 Z"/>
          <path d="M-36 0 L-32 -40 L-8 -40 L-8 0 Z M8 0 L8 -40 L32 -40 L36 0 Z"/>
          <ellipse cx="-62" cy="-298" rx="30" ry="20"/><ellipse cx="62" cy="-298" rx="30" ry="20"/>
          <circle cx="0" cy="-344" r="30"/>
          <path d="M-35 -352 Q-32 -396 4 -398 Q42 -396 35 -352 L29 -370 L16 -354 L6 -376 L-6 -354 L-18 -376 L-27 -352 Z" fill="#323846" stroke="rgba(255,226,140,.8)"/>
          <path d="M50 -302 L84 -332 L98 -396 L84 -400 L68 -342 L44 -288 Z"/><circle cx="92" cy="-404" r="12"/>
          <path d="M85 -414 L85 -568 L91 -590 L97 -568 L97 -414 Z"/><rect x="66" y="-418" width="50" height="10" rx="3"/></g>`,
      };
      function figure(name, x, y, s) {
        const g = P[name]();
        return `<g transform="translate(${x} ${y}) scale(${s})">${g}</g><g transform="translate(${x} ${y}) scale(${s} ${-s})" opacity=".2">${g}</g>`;
      }

      /* ---------- SHOT 1 : rear wide, castle gate ---------- */
      function shot1() {
        let castle = "";
        castle += "M300 790 L300 560 " + "h1320 L1620 790 Z ";
        castle += cren(300, 1620, 560, 22, 20);
        castle += "M296 790 V440 h138 V790 Z " + cren(296, 434, 440, 23, 20) + "M284 440 L365 290 L446 440 Z ";
        castle += "M1486 790 V440 h138 V790 Z " + cren(1486, 1624, 440, 23, 20) + "M1474 440 L1555 290 L1636 440 Z ";
        castle += "M618 790 V350 h124 V790 Z " + cren(618, 742, 350, 20, 18) + "M604 350 L680 170 L756 350 Z ";
        castle += "M1178 790 V372 h124 V790 Z " + cren(1178, 1302, 372, 20, 18) + "M1164 372 L1240 196 L1316 372 Z ";
        castle += "M796 790 V250 h328 V790 Z " + cren(796, 1124, 250, 24, 22);
        castle += "M880 250 V100 h160 V250 Z M860 100 L960 -70 L1060 100 Z M958 -70 V-150 ";
        const gate = "M876 790 V610 Q960 496 1044 610 V790 Z";
        let slits = "";
        [[670, 440], [670, 560], [1250, 460], [1250, 580], [930, 330], [990, 330], [930, 430], [990, 430], [350, 560], [1570, 560], [350, 650], [1570, 650]].forEach((q) => (slits += `<rect x="${q[0] - 4}" y="${q[1]}" width="8" height="26" rx="3" fill="#2a3850"/>`));
        const r = prng(9);
        let cob = "";
        for (let i = -14; i <= 14; i++) cob += `<path d="M960 792 L${960 + i * 120} 1090" stroke="#1f2938" stroke-width="2" opacity=".28"/>`;
        for (let k = 0; k < 11; k++) { const y = 792 + Math.pow(k / 10, 1.8) * 290; cob += `<path d="M0 ${y.toFixed(0)} L1920 ${y.toFixed(0)}" stroke="#1f2938" stroke-width="${1 + k * 0.25}" opacity=".2"/>`; }
        const mount = "M0 720 L120 640 L240 700 L330 610 L430 690 L520 640 L600 720 L1320 720 L1420 650 L1520 700 L1640 600 L1760 690 L1860 640 L1920 690 V800 H0 Z";
        return `<svg viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg"><defs>
          ${grad("sk1", [[0, "#566b92"], [0.45, "#b9cbe4"], [0.8, "#f8fbff"], [1, "#e6eefa"]])}
          ${grad("gr1", [[0, "#7c8ea8"], [0.18, "#46556c"], [1, "#0f1520"]])}
          ${grad("rd1", [[0, "#aebfd8"], [1, "#6c7e99"]])}
          ${grad("cs1", [[0, "#04060b"], [0.6, "#080c14"], [1, "#2a3547"]])}
          ${grad("hz1", [[0, "rgba(235,243,255,0)"], [0.7, "rgba(235,243,255,.55)"], [1, "rgba(235,243,255,0)"]])}
        </defs>
        <rect width="1920" height="800" fill="url(#sk1)"/>
        <rect width="1920" height="1080" filter="url(#cl1)"/>
        ${bolt(14, 1480, -20, 1330, 380, 90, 3)}
        <path d="${mount}" fill="#1a2230"/>
        <rect y="780" width="1920" height="300" fill="url(#gr1)"/>
        <path d="M900 790 L1020 790 L1520 1080 L400 1080 Z" fill="url(#rd1)" opacity=".85"/>
        ${cob}
        <ellipse cx="560" cy="960" rx="190" ry="26" fill="#d7e4f6" opacity=".7"/><ellipse cx="1420" cy="900" rx="150" ry="18" fill="#d7e4f6" opacity=".6"/><ellipse cx="960" cy="1040" rx="320" ry="22" fill="#d7e4f6" opacity=".55"/>
        <path d="${castle}" fill="url(#cs1)" stroke="#070a11" stroke-width="2"/>
        ${slits}
        <rect y="690" width="1920" height="130" fill="url(#hz1)"/>
        <path d="${gate}" fill="#000"/>
        <path d="M916 610 V790 M960 540 V790 M1004 610 V790 M876 650 H1044 M876 710 H1044" stroke="#222c3d" stroke-width="3" fill="none"/>
        <path d="M960 -150 l70 18 l-20 22 l40 26 l-80 -6 z" fill="#070a11"/>
        ${figure("warrior", 690, 922, 1.0)}${figure("mage", 828, 912, 1.0)}${figure("priest", 1106, 906, 1.0)}${figure("leon", 966, 950, 1.1)}
        </svg>`;
      }

      /* ---------- demon (inline from demon.svg) ---------- */
      const DEMON = `<path d="M10 1000 L120 470 L680 470 L790 1000 L640 940 L560 1000 L400 930 L240 1000 L160 940 Z" fill="#2a0a1c"/>
        <path d="M140 1000 L190 520 L290 420 L510 420 L610 520 L660 1000 Z" fill="#14050f" stroke="#ff2a4d" stroke-width="4" stroke-linejoin="round"/>
        <path d="M250 560 L550 560 M240 650 L560 650 M232 740 L568 740" stroke="#ff2a4d" stroke-opacity=".35" stroke-width="5"/>
        <path d="M44 520 L190 420 L230 570 L90 620 Z M78 508 L30 410 L140 470 Z M120 470 L108 366 L184 436 Z" fill="#14050f" stroke="#ff2a4d" stroke-width="4" stroke-linejoin="round"/>
        <path d="M756 520 L610 420 L570 570 L710 620 Z M722 508 L770 410 L660 470 Z M680 470 L692 366 L616 436 Z" fill="#14050f" stroke="#ff2a4d" stroke-width="4" stroke-linejoin="round"/>
        <path d="M300 430 L292 290 Q400 246 508 290 L500 430 Z" fill="#14050f" stroke="#ff2a4d" stroke-width="4" stroke-linejoin="round"/>
        <path d="M306 312 C214 300 112 232 86 92 C168 152 258 188 352 246 Z" fill="#14050f" stroke="#ff2a4d" stroke-width="4" stroke-linejoin="round"/>
        <path d="M494 312 C586 300 688 232 714 92 C632 152 542 188 448 246 Z" fill="#14050f" stroke="#ff2a4d" stroke-width="4" stroke-linejoin="round"/>
        <path d="M330 292 L350 214 L376 280 L400 190 L424 280 L450 214 L470 292 Z" fill="#14050f" stroke="#ff2a4d" stroke-width="3" stroke-linejoin="round"/>
        <path d="M352 416 L376 398 L400 418 L424 398 L448 416" stroke="#ff2a4d" stroke-width="6" fill="none" stroke-linejoin="round"/>`;
      const DEMON_T = "translate(590 -30) scale(.92)";
      const DEMON_EYES = `<path d="M338 346 L388 360 L383 380 L334 366 Z M462 346 L412 360 L417 380 L466 366 Z" fill="#ff2a4d"/>`;

      /* ---------- SHOT 2 : low angle, demon on the balcony ---------- */
      function shot2() {
        let bal = "";
        for (let x = 330; x < 1600; x += 46) bal += `<path d="M${x} 700 L${x + 4} 676 Q${x + 2} 664 ${x + 9} 656 Q${x + 16} 664 ${x + 14} 676 L${x + 18} 700 Z M${x + 4} 676 h12 v-22 h-12z"/>`;
        let corb = "";
        for (let x = 340; x < 1600; x += 120) corb += `M${x} 770 L${x + 80} 770 L${x + 50} 860 L${x + 30} 860 Z `;
        const tl = "M0 1080 V230 L70 200 L100 20 L136 200 L200 180 L240 -120 L286 180 L360 200 V1080 Z";
        const tr = "M1920 1080 V240 L1850 210 L1824 40 L1790 210 L1720 190 L1680 -100 L1636 190 L1560 210 V1080 Z";
        return `<svg viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg"><defs>
          ${grad("sk2", [[0, "#3f5276"], [0.55, "#b5c8e4"], [1, "#eef5ff"]])}
          ${grad("wl2", [[0, "#0d121c"], [1, "#04060a"]])}
        </defs>
        <rect width="1920" height="1080" fill="url(#sk2)"/>
        <rect width="1920" height="1080" filter="url(#cl2)"/>
        ${bolt(31, 1210, -40, 1100, 560, 120, 4, 1.25)}
        <g transform="${DEMON_T}">${DEMON}</g>
        <path d="${tl}" fill="#070a11" stroke="rgba(205,222,245,.35)" stroke-width="2"/><path d="${tr}" fill="#070a11" stroke="rgba(205,222,245,.35)" stroke-width="2"/>
        <path d="M110 420 v90 q18 -30 36 0 v-90 q-18 -26 -36 0z M1790 440 v90 q18 -30 36 0 v-90 q-18 -26 -36 0z" fill="#2a3850"/>
        <rect x="290" y="770" width="1340" height="320" fill="url(#wl2)"/>
        <rect x="290" y="696" width="1340" height="78" fill="#070a11" stroke="rgba(205,222,245,.45)" stroke-width="2"/>
        <path d="${corb}" fill="#070a11" stroke="rgba(205,222,245,.3)" stroke-width="2"/>
        <g fill="#070a11" stroke="rgba(205,222,245,.5)" stroke-width="2">${bal}<rect x="316" y="624" width="1288" height="34" rx="6"/></g>
        <path d="M290 696 H1630" stroke="rgba(205,222,245,.5)" stroke-width="2"/>
        </svg>`;
      }
      function glow2() {
        return `<svg viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg"><g transform="${DEMON_T}">
          <g filter="url(#eyeGlow)" id="eyeBlur2" opacity=".95">${DEMON_EYES}</g>${DEMON_EYES}
          <g id="core2"><path d="M400 600 L428 650 L400 700 L372 650 Z" fill="#ff2a4d"/></g></g></svg>`;
      }

      /* ---------- SHOT 3 : cinemascope horizon, the horde ---------- */
      function shot3bg() {
        let pud = "";
        const r = prng(77);
        for (let i = 0; i < 26; i++) { const y = 672 + Math.pow(r(), 1.5) * 260, w = 40 + (y - 650) * 1.2 * r(); pud += `<ellipse cx="${(r() * 1920).toFixed(0)}" cy="${y.toFixed(0)}" rx="${w.toFixed(0)}" ry="${(1.5 + (y - 650) * 0.04).toFixed(1)}" fill="#f0f6ff" opacity=".75"/>`; }
        return `<svg viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg"><defs>
          ${grad("sk3", [[0, "#36486c"], [0.5, "#8fa5c6"], [0.86, "#f2f7ff"], [1, "#e7f0fd"]])}
          ${grad("gr3", [[0, "#aebfd8"], [0.2, "#63748f"], [1, "#1a2231"]])}
        </defs>
        <rect width="1920" height="652" fill="url(#sk3)"/>
        <rect width="1920" height="652" filter="url(#cl3)"/>
        ${bolt(52, 360, 120, 300, 640, 70, 3, 0.9)}
        ${bolt(66, 1300, 140, 1500, 360, 120, 2, 0.8)}
        <path d="M0 646 Q480 628 960 640 T1920 636 V660 H0Z" fill="#101725"/>
        <rect y="650" width="1920" height="300" fill="url(#gr3)"/>
        ${pud}
        </svg>`;

          if (k === 2) { if (I > 0) drawLit(ctxL3, HD3, HC3, tt); drawEyes(ctxE3, HD3, HC3, tt, 1); }

            ctxE4.clearRect(0, 0, W, H);
            for (const e of E4) { const d = n - e.on; if (d < 0) continue; const a = clamp(d / e.g, 0, 1) * (0.7 + 0.3 * Math.sin(n * 0.4 + e.x)); eye(ctxE4, e.x - 14 + e.vx * d * 0.3, e.y + e.vy * d * 0.3, 18, a); eye(ctxE4, e.x + 14 + e.vx * d * 0.3, e.y + e.vy * d * 0.3, 18, a); }

        stage.style.transform = "translate(" + dx.toFixed(1) + "px," + dy.toFixed(1) + "px) scale(" + z.toFixed(4) + ")";
        burst.style.opacity = (k >= 0 && off === 0 ? 0.07 : 0).toFixed(3);
        drawRain(tt, I);
        for (const s of subs) { const a = s[1], b = s[2]; s[0].style.opacity = (n < a || n >= b ? 0 : Math.min(1, (n - a + 1) / 3, (b - n) / 3)).toFixed(3); }
        let da = 0;
        if (n >= 242 && n < 248) da = n < 244 ? 1 : 0.5; else if (n >= 254 && n < 260) da = n < 256 ? 1 : 0.5; else if (n >= 266) da = n < 268 ? 0.8 : 1;
        dot.style.opacity = da.toFixed(2);
      }

      const tl = gsap.timeline({ paused: true });
      const drv = { t: 0 };
      tl.to(drv, { t: 9, duration: 9, ease: "none", onUpdate: () => render(drv.t) }, 0);
      render(0);
      window.__timelines["main"] = tl;
