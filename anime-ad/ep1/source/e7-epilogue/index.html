<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8" />

<title>e7-epilogue</title>

<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:1920px; height:1080px; overflow:hidden; background:#05070f; }
  #root { position:relative; width:100%; height:100%; overflow:hidden; background:#05070f;
    font-family:"Noto Sans JP", sans-serif; color:#fffdf5; }
  .abs { position:absolute; }
  #stage, #shake, #cam { position:absolute; left:0; top:0; width:1920px; height:1080px; }
  #cam { transform-origin:0 0; }
  #wall, #counter, #hudsvg { position:absolute; left:0; top:0; width:1920px; height:1080px; }
  #mina { position:absolute; left:1020px; top:190px; width:380px; height:855px; }
  #hero { position:absolute; left:280px; top:215px; width:494px; height:855px; }
  #mina svg, #hero svg { width:100%; height:100%; display:block; overflow:visible; }
  #crystalW { position:absolute; left:755px; top:421px; width:190px; height:285px; }
  #crystalW svg { width:100%; height:100%; display:block; overflow:visible; }
  #basket { position:absolute; width:130px; height:130px; }
  #basket svg { width:100%; height:100%; display:block; overflow:visible; }
  #book { position:absolute; left:1085px; top:668px; width:150px; height:40px; }
  #qmark { position:absolute; left:468px; top:130px; width:110px; text-align:center; font-weight:700; font-size:128px; line-height:128px;
    color:#ffc400; -webkit-text-stroke:10px #0a0a12; paint-order:stroke fill; opacity:0; }

  /* HUD plate */
  .plateW { position:absolute; left:560px; top:150px; width:580px; display:flex; justify-content:center; }
  .plate { position:relative; min-width:300px; padding:10px 26px 14px; border:3px solid #19d3ff; border-radius:10px;
    background:linear-gradient(180deg, rgba(6,26,56,.90), rgba(3,12,32,.92)); box-shadow:0 0 28px rgba(25,211,255,.55), inset 0 0 26px rgba(25,211,255,.25);
    font-family:"Space Mono", monospace; font-weight:700; }
  .plate .hdr { font-family:"Noto Sans JP", sans-serif; font-weight:700; font-size:30px; color:#19d3ff; letter-spacing:.06em; height:40px; line-height:40px; text-shadow:0 0 10px rgba(25,211,255,.8); }
  .plate .body { position:relative; display:flex; align-items:center; justify-content:center; height:128px; }
  .plate .lv { font-size:64px; color:#19d3ff; margin-right:10px; text-shadow:0 0 12px rgba(25,211,255,.8); line-height:128px; }
  .plate .digits { display:flex; }
  .plate .col { width:78px; height:124px; overflow:hidden; position:relative; }
  .plate .strip { position:absolute; left:0; top:0; width:78px; }
  .plate .strip div { height:124px; line-height:124px; font-size:116px; text-align:center; color:#e8fbff;
    text-shadow:0 0 14px rgba(25,211,255,.9), 0 0 36px rgba(25,211,255,.5); }
  .plate .true { position:absolute; left:0; right:0; top:0; bottom:0; display:flex; align-items:center; justify-content:center; font-size:92px; color:#fffdf5; opacity:0;
    background:rgba(40,0,10,.7); text-shadow:0 0 14px rgba(255,42,77,.95); }
  .plate .scan { position:absolute; left:0; top:0; right:0; bottom:0; pointer-events:none; opacity:.35;
    background:repeating-linear-gradient(180deg, rgba(0,0,0,0) 0 3px, rgba(0,0,0,.45) 3px 4px); border-radius:8px; }
  .plate .corner { position:absolute; width:22px; height:22px; border:4px solid #ffc400; }
  .clone { visibility:hidden; }

  /* banner */
  #banner { position:absolute; left:0; top:0; width:1920px; height:100px; opacity:0; overflow:hidden;
    background:#c4122f; border-top:12px solid #ffc400; border-bottom:12px solid #ffc400;
    display:flex; align-items:center; justify-content:center; gap:26px; box-shadow:0 8px 40px rgba(255,42,77,.7);
    font-weight:700; font-size:54px; letter-spacing:.04em; color:#fffdf5; }
  #banner .stripe { position:absolute; left:0; top:0; right:0; bottom:0;
    background:repeating-linear-gradient(115deg, rgba(0,0,0,.18) 0 36px, rgba(0,0,0,0) 36px 72px); }
  #banner span { position:relative; text-shadow:0 0 14px rgba(0,0,0,.6); }
  #banner svg { position:relative; width:64px; height:56px; }

  #alarm { position:absolute; left:0; top:0; width:1920px; height:1080px; opacity:0; pointer-events:none;
    background:radial-gradient(ellipse at center, rgba(255,20,60,0) 38%, rgba(255,20,60,.55) 100%); }
  #flash { position:absolute; left:0; top:0; width:1920px; height:1080px; opacity:0; pointer-events:none; background:#fff; }
  #bars { position:absolute; left:0; top:0; width:1920px; height:1080px; pointer-events:none; }
  #bars div { position:absolute; left:0; width:1920px; display:none; }
  #vig { position:absolute; left:0; top:0; width:1920px; height:1080px; pointer-events:none;
    background:radial-gradient(ellipse at center, rgba(0,0,0,0) 55%, rgba(0,0,10,.55) 100%); }

  /* subtitles (BIBLE spec) */
  .sub { position:absolute; left:210px; top:930px; width:1500px; height:80px; display:flex; align-items:center; justify-content:center;
    text-align:center; font-weight:700; font-size:48px; line-height:60px; color:#fffdf5; opacity:0; white-space:nowrap; }
  #fontpre { position:absolute; left:0; top:0; width:1px; height:1px; overflow:hidden; opacity:.01; font-weight:700; font-size:20px; pointer-events:none; }
</style>
</head>

  tl.to("#ringB",{rotation:-360,svgOrigin:"850 560",duration:5,ease:"none"},3.7);
  // crystal pulse
  for(var i=0;i<6;i++){tl.to("#crystal",{scale:1.03,svgOrigin:"100 140",duration:.25,yoyo:true,repeat:1,ease:"sine.inOut"},4.0+i*0.35);}
  // crystal colour: cyan -> red at the overflow
  tl.to("#crystalW",{filter:"hue-rotate(0deg) brightness(1)",duration:.01},0);
  tl.to("#crystalW",{filter:"hue-rotate(170deg) brightness(1.35)",duration:.04,ease:"none"},6.5);
  tl.to("#crystalW",{filter:"hue-rotate(160deg) brightness(1.05)",duration:.5,ease:"sine.inOut"},6.54);
  tl.to("#crystalW",{filter:"hue-rotate(170deg) brightness(1.3)",duration:.25,yoyo:true,repeat:5,ease:"sine.inOut"},7.1);
  tl.to("#crystalW",{filter:"hue-rotate(0deg) brightness(1)",duration:1.0,ease:"sine.inOut"},8.7);
  tl.to("#crystalW",{x:2,duration:.03,yoyo:true,repeat:11,ease:"none"},6.2);
  // lighting on characters
  gsap.set("#mina",{filter:"drop-shadow(-8px 0 0 rgba(25,211,255,0))"});
  gsap.set("#hero",{filter:"drop-shadow(8px 0 0 rgba(25,211,255,0))"});
  tl.to("#mina",{filter:"drop-shadow(-8px 0 0 rgba(25,211,255,.75))",duration:.6},3.3);
  tl.to("#hero",{filter:"drop-shadow(8px 0 0 rgba(25,211,255,.75))",duration:.6},3.3);
  tl.to("#mina",{filter:"drop-shadow(-8px 0 0 rgba(255,42,77,.9))",duration:.05},6.5);
  tl.to("#hero",{filter:"drop-shadow(8px 0 0 rgba(255,42,77,.9))",duration:.05},6.5);
  tl.to("#mina",{filter:"drop-shadow(-8px 0 0 rgba(25,211,255,.6))",duration:1.2},8.7);
  tl.to("#hero",{filter:"drop-shadow(8px 0 0 rgba(25,211,255,.6))",duration:1.2},8.7);
  tl.to("#cyPool",{opacity:.45,duration:.4},6.5);

  // ---- banner / alarm ----
  gsap.set("#banner",{y:-120,opacity:0});
  tl.set("#banner",{opacity:1},6.5);
  tl.to("#banner",{y:0,duration:.1,ease:"power4.out"},6.5);
  // flicker: red/dark alternating for a short while
  tl.to("#banner",{opacity:.55,duration:.05,yoyo:true,repeat:5,ease:"none"},6.7);
  tl.to("#alarm",{opacity:.9,duration:.08,ease:"none"},6.5);
  for(var i=0;i<6;i++){tl.to("#alarm",{opacity:.25,duration:.2,ease:"sine.inOut"},6.7+i*.5);tl.to("#alarm",{opacity:.85,duration:.2,ease:"sine.inOut"},6.9+i*.5);}
  tl.to("#alarm",{opacity:0,duration:.9,ease:"sine.out"},9.0);

  // lantern flicker
  var LR=mulberry32(9);
  ["#gl1","#gl3","#glowM"].forEach(function(id,k){var t=0.0;while(t<9.8){var d=.12+LR()*.22;tl.to(id,{opacity:.78+LR()*.22,duration:d,ease:"sine.inOut"},t);t+=d;}});
  // lamp pool breathing
  tl.to("#cyPool",{rx:540,duration:.9,yoyo:true,repeat:9,ease:"sine.inOut"},3.2);

  // ---- subtitles ----
  function sub(id,a,b){tl.fromTo(id,{opacity:0},{opacity:1,duration:.1,ease:"none"},a);tl.to(id,{opacity:0,duration:.1,ease:"none"},b-.1);tl.set(id,{opacity:0},b);}
  sub("#sub1",1.0,2.5);
  sub("#sub2",7.0,8.2);

  window.__timelines["main"]=tl;
})();
</script>
