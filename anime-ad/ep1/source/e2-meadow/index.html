    <script>
      (function () {
        const DUR = 10;
        const $ = (id) => document.getElementById(id);
        const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
        const lerp = (a, b, u) => a + (b - a) * u;
        const EZ = {
          lin: (u) => u,
          s: (u) => u * u * (3 - 2 * u),
          in: (u) => u * u,
          out: (u) => 1 - (1 - u) * (1 - u),
          out3: (u) => 1 - Math.pow(1 - u, 3),
          io: (u) => (u < 0.5 ? 2 * u * u : 1 - Math.pow(-2 * u + 2, 2) / 2),
          back: (u) => { const c = 2.0; return 1 + (c + 1) * Math.pow(u - 1, 3) + c * Math.pow(u - 1, 2); },
          elas: (u) => (u <= 0 ? 0 : u >= 1 ? 1 : Math.pow(2, -9 * u) * Math.sin((u * 9 - 0.75) * ((2 * Math.PI) / 3)) + 1),
        };
        // [t, v, ease] : 区間(前の点→この点)に ease を適用
        function kf(p) {
          return (t) => {
            if (t <= p[0][0]) return p[0][1];
            for (let i = 1; i < p.length; i++) {
              if (t <= p[i][0]) {
                const a = p[i - 1], b = p[i];
                const u = (t - a[0]) / (b[0] - a[0]);
                return a[1] + (b[1] - a[1]) * EZ[b[2] || "s"](u);
              }
            }
            return p[p.length - 1][1];
          };
        }
        function rng(seed) {
          let a = seed >>> 0;
          return () => {
            a = (a + 0x6d2b79f5) | 0;
            let t = Math.imul(a ^ (a >>> 15), 1 | a);
            t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
            return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
          };
        }
        const R = rng(20260216);
        const pick = (arr) => arr[Math.floor(R() * arr.length)];

        const tl = gsap.timeline({ paused: true });
        function drive(el, prop, fn) {
          const from = {}, to = {};
          from[prop] = 0;
          to[prop] = 1;
          to.duration = DUR;
          to.ease = (p) => fn(p * DUR);
          tl.fromTo(el, from, to, 0);
        }
        // 区間 [t0, t0+dur] の局所時間 u(0..1) の関数として動かす
        function A(el, t0, dur, props) {
          for (const k in props) drive(el, k, (t) => props[k](clamp((t - t0) / dur, 0, 1)));
        }

        /* ---------- 横スクロール量 P(t) ---------- */
        const VS = 400;
        const wK = kf([
          [0, 1], [2.55, 1], [2.85, 0], [3.5, 0], [3.8, 1, "s"], [5.3, 1], [5.45, 0, "s"], [6.0, 0], [6.3, 1, "s"], [7.5, 1], [7.8, 0, "s"], [10, 0],
        ]);
        const NS = 240, NN = DUR * NS;
        const Ptab = new Float64Array(NN + 3);
        { let acc = 0; for (let i = 1; i <= NN + 2; i++) { acc += (VS * wK((i - 0.5) / NS)) / NS; Ptab[i] = acc; } }
        const P = (t) => { const x = clamp(t, 0, DUR) * NS; const i = Math.floor(x); const f = x - i; return Ptab[i] * (1 - f) + Ptab[i + 1] * f; };
        const PMAX = P(DUR);
        const PH = (t) => (2 * Math.PI * P(t)) / 200; // 歩行位相(1周期=地面200px)

        /* ---------- 風景(多層) ---------- */
        const SKYL = 700;
        const mk = (id, W, inner) => { $(id).style.width = W + "px"; $(id).innerHTML = `<svg width="${W}" height="1080" viewBox="0 0 ${W} 1080">${inner}</svg>`; };
        const wave = (x, base, a, L1, p1, b, L2, p2) => base - a * (0.5 + 0.5 * Math.sin((x * 2 * Math.PI) / L1 + p1)) - b * (0.5 + 0.5 * Math.sin((x * 2 * Math.PI) / L2 + p2));
        const hillPath = (W, f, step = 24) => { let d = `M0,1080 L0,${f(0).toFixed(1)}`; for (let x = step; x <= W + step; x += step) d += ` L${x},${f(x).toFixed(1)}`; return d + ` L${W + step},1080 Z`; };
        const KS = { cloudF: 0.03, mount: 0.06, far: 0.14, cloudN: 0.08, mid: 0.3, near: 0.55, gb: 1, gf: 1, fg: 1.7 };
        const DR = { cloudF: 9, cloudN: 18 };
        const WIDTH = (k, d = 0) => Math.ceil(1920 + k * PMAX + d * DUR + 260);

        // 太陽(固定)
        $("lSun").innerHTML = `<svg width="1920" height="1080"><circle cx="250" cy="200" r="150" fill="#fff6bf" opacity=".22"/><circle cx="250" cy="200" r="108" fill="#fff6bf" opacity=".4"/><circle cx="250" cy="200" r="72" fill="#fff3a8"/></svg>`;

        // 雲
        const cloud = (x, y, s) => `<g transform="translate(${x},${y}) scale(${s})"><g fill="#cfe7f5" transform="translate(0,9)"><circle cx="0" cy="0" r="38"/><circle cx="48" cy="-18" r="50"/><circle cx="106" cy="-6" r="42"/><circle cx="150" cy="8" r="30"/><rect x="-38" y="0" width="218" height="38" rx="19"/></g><g fill="#ffffff"><circle cx="0" cy="0" r="38"/><circle cx="48" cy="-18" r="50"/><circle cx="106" cy="-6" r="42"/><circle cx="150" cy="8" r="30"/><rect x="-38" y="0" width="218" height="34" rx="17"/></g></g>`;
        const cloudRow = (W, ys, sc, n) => { let s = ""; for (let i = 0; i < n; i++) s += cloud(((i + R() * 0.5) * W) / n, ys[i % ys.length] + R() * 30, sc * (0.8 + R() * 0.5)); return s; };
        { const W = WIDTH(KS.cloudF, DR.cloudF); mk("lCloudF", W, cloudRow(W, [150, 250, 120, 290], 0.8, 8)); }
        { const W = WIDTH(KS.cloudN, DR.cloudN); mk("lCloudN", W, cloudRow(W, [330, 190, 400, 240], 1.15, 6)); }

        // 山
        { const W = WIDTH(KS.mount); let s = "";
          for (let layer = 0; layer < 2; layer++) {
            let x = -120 + layer * 170;

        drive($("hBack"), "rotation", backA);
        drive($("hBask"), "rotation", (t) => -(backA(t) + upLean(t) + heroRot(t)) + 7 * W_(t) * Math.sin(PH(t) - 0.9) + 2.5 * Math.sin(t * 3.1));
        // 顔
        faceOn($("hEyeN"), ["N"]);
        faceOn($("hEyeH"), ["H"]);
        faceOn($("hEyeS"), ["S"]);
        faceOn($("hEyeW"), ["W"]);
        faceOn($("hMouthS"), ["H"]);
        faceOn($("hMouthO"), ["S", "W"]);

        /* ============ スライム(2.5 出現 / 3.0 蒸発) ============ */
        const slAdv = kf([[2.5, 0, "lin"], [2.78, 105, "s"], [2.8, 105], [2.98, 138, "s"]]);
        const slideX = (t) => 380 + 42 + slAdv(t) - (P(t) - P(2.5)) - 82;
        const slHop = (t) => {
          if (t < 2.5) return 0;
          if (t < 2.78) { const u = (t - 2.5) / 0.28; return -112 * Math.sin(Math.PI * Math.pow(u, 0.7)); }
          if (t >= 2.8 && t < 2.98) { const u = (t - 2.8) / 0.18; return -4 * 38 * u * (1 - u); }
          return 0;
        };
        const slideY = (t) => (t < 2.5 ? 12 : slHop(t) + (t < 2.78 ? 12 * (1 - clamp((t - 2.5) / 0.28)) : 0));
        drive($("slime"), "x", slideX);
        drive($("slime"), "y", slideY);
        drive($("slime"), "opacity", kf([[2.49, 0], [2.5, 1], [3.03, 1], [3.07, 0]]));
        const sqY = (t) => {
          if (t < 2.5) return 1;
          let v = 1 + 0.04 * Math.sin((t - 2.5) * 22) * Math.exp(-(t - 2.5) * 1.2);
          // 着地のぷにっ
          if (t > 2.76 && t < 2.86) v = lerp(1, 0.78, Math.sin(((t - 2.76) / 0.1) * Math.PI));
          if (t > 2.94 && t < 2.967) v = 1.0;
          if (t >= 2.967) v = lerp(1, 0.1, EZ.out(clamp((t - 2.967) / 0.07)));
          return v;
        };
        drive($("slimeSq"), "scaleY", sqY);
        drive($("slimeSq"), "scaleX", (t) => (t >= 2.967 ? lerp(1, 1.6, EZ.out(clamp((t - 2.967) / 0.07))) : 1 + (1 - sqY(t)) * 0.6));
        drive($("shSlime"), "x", (t) => slideX(t) + 8);
        drive($("shSlime"), "opacity", kf([[2.49, 0], [2.5, 1], [2.967, 1], [3.07, 0]]));
        drive($("shSlime"), "scaleX", (t) => 1 + slHop(t) / 220);

        /* ============ 狼(4.5 出現 / 5.467 かすり飛ぶ) ============ */
        const wOwn = kf([[4.5, 0], [5.2, 105, "lin"], [5.467, 265, "out"]]);
        const wolfX0 = (t) => 1610 + 0 - (P(t) - P(4.5)) - wOwn(t);
        const flyU = (t) => clamp((t - 5.467) / 0.6);
        const wolfX = (t) => (t < 5.467 ? wolfX0(t) : wolfX0(5.467) + (1560 - wolfX0(5.467)) * EZ.out3(flyU(t)) * 0.9 + (1560 - wolfX0(5.467)) * 0.1 * flyU(t)) - 162;
        const wolfY = (t) => {
          if (t < 4.5) return 0;
          if (t < 4.62) return lerp(0, -34, EZ.out((t - 4.5) / 0.12));
          if (t < 5.2) return -34 + lerp(0, 34, EZ.s((t - 4.62) / 0.58)) * 0.6 + 3 * Math.sin((t - 4.62) * 18);
          if (t < 5.467) { const u = (t - 5.2) / 0.3; return -14 - 76 * Math.sin(u * Math.PI * 0.5); }
          const u = flyU(t); return -(90 + 222 * EZ.out(u));
        };
        const wolfS = (t) => (t < 5.467 ? 1 : lerp(1, 0.07, EZ.s(flyU(t))));
        drive($("wolf"), "x", wolfX);
        drive($("wolf"), "y", wolfY);
        drive($("wolf"), "scale", wolfS);
        drive($("wolfSpin"), "rotation", (t) => {
          if (t < 5.2) return 2.5 * Math.sin(t * 9) * (t > 4.6 ? 1 : 0);
          if (t < 5.467) return lerp(0, -16, EZ.s((t - 5.2) / 0.3));
          return lerp(-16, -16 - 900, EZ.out(flyU(t)));
        });
        drive($("wolfFlip"), "x", (t) => (t > 4.55 && t < 5.2 ? 2.2 * Math.sin(t * 160) : 0)); // うなりの震え
        drive($("wTeeth"), "opacity", (t) => (t > 4.58 && t < 5.7 ? 1 : 0));
        drive($("wGlow"), "opacity", (t) => (t >= 4.5 && t < 5.467 ? 0.35 + 0.3 * Math.sin((t - 4.5) * 24) : 0));
        drive($("wTail"), "rotation", (t) => 9 * Math.sin(t * 11));
        drive($("wolf"), "opacity", (t) => (t < 3.8 || t > 6.1 ? 0 : 1));
        drive($("shWolf"), "x", (t) => (t < 5.467 ? wolfX0(t) - 155 : wolfX0(5.467) - 155));
        drive($("shWolf"), "opacity", (t) => (t >= 4.6 && t < 5.467 ? 1 : t >= 5.467 && t < 5.4675 ? 0 : 0));

        /* ============ 石(つまずき 5.4) ============ */
        gsap.set("#stone", { svgOrigin: `${stoneWorld} 893` });
        drive($("stone"), "rotation", kf([[5.39, 0], [5.46, -14, "out"], [5.7, 3, "s"], [5.9, 0]]));
        drive($("stone"), "y", kf([[5.39, 0], [5.45, -14, "out"], [5.58, 0, "in"]]));

        /* ============ 熊(7.5 出現 / 7.967 手を振られて飛ぶ) ============ */
        const bearCX = 1430;
        const bFly = (t) => clamp((t - 7.967) / 0.78);
        drive($("bear"), "x", (t) => { const u = bFly(t); return bearCX - 247 + (1030 - bearCX) * EZ.out3(u) - 0; });
        drive($("bear"), "y", (t) => { const u = bFly(t); return -(490 * EZ.out(u)) + (t >= 7.967 && t < 8.1 ? 8 * Math.sin((t - 7.967) * 80) : 0); });
        drive($("bear"), "scale", (t) => lerp(1, 0.16, EZ.s(bFly(t))));
        drive($("bearSpin"), "rotation", (t) => lerp(0, -1080, EZ.out(bFly(t))));
        drive($("bearPop"), "scaleY", kf([[7.49, 0.05], [7.5, 0.3], [7.56, 1.1, "out"], [7.64, 0.96, "s"], [7.72, 1.0, "s"]]));
        drive($("bearPop"), "scaleX", kf([[7.49, 1.2], [7.5, 1.25], [7.56, 0.94, "out"], [7.64, 1.04, "s"], [7.72, 1.0, "s"]]));
        drive($("bear"), "opacity", (t) => (t < 7.5 || t > 8.75 ? 0 : 1));
        drive($("bArmL"), "rotation", kf([[7.5, 8], [7.62, 8], [7.78, 120, "back"], [7.95, 122], [7.967, 140, "out"], [8.27, 40]]));
        drive($("bArmR"), "rotation", kf([[7.5, -8], [7.62, -8], [7.8, -120, "back"], [7.95, -122], [7.967, -140, "out"], [8.27, -40]]));
        drive($("bHead"), "rotation", kf([[7.5, 0], [7.7, -6], [7.85, 5], [7.967, -4], [7.9675, 12, "out"]]));
        const bShock = (t) => t >= 7.967;
        drive($("bEyeA"), "opacity", (t) => (bShock(t) ? 0 : 1));
        drive($("bEyeS"), "opacity", (t) => (bShock(t) ? 1 : 0));
        drive($("bMouthA"), "opacity", (t) => (bShock(t) ? 0 : 1));
        drive($("bMouthS"), "opacity", (t) => (bShock(t) ? 1 : 0));
        drive($("shBear"), "x", () => bearCX - 210);
        drive($("shBear"), "opacity", (t) => (t >= 7.5 && t < 7.967 ? 1 : t >= 7.967 && t < 8.1 ? lerp(1, 0, (t - 7.967) / 0.12) : 0));
        drive($("shBear"), "scaleX", kf([[7.5, 0.3], [7.58, 1.05, "out"], [7.7, 1.0]]));

        /* ============ FX ============ */
        const fxL = $("fx");
        const addFx = (html, css) => { const d = document.createElement("div"); d.className = "fx"; d.style.cssText = css || ""; d.innerHTML = html; fxL.appendChild(d); return d; };
        const star5 = (r, fill) => { let p = ""; for (let i = 0; i < 10; i++) { const a = -Math.PI / 2 + (i * Math.PI) / 5, rr = i % 2 ? r * 0.45 : r; p += `${(Math.cos(a) * rr).toFixed(1)},${(Math.sin(a) * rr).toFixed(1)} `; } return `<svg width="${r * 2 + 8}" height="${r * 2 + 8}" viewBox="${-r - 4} ${-r - 4} ${r * 2 + 8} ${r * 2 + 8}" style="display:block"><polygon points="${p}" fill="${fill}" stroke="#0a0a12" stroke-width="3" stroke-linejoin="round"/></svg>`; };
        const spark4 = (r, fill) => `<svg width="${r * 2}" height="${r * 2}" viewBox="${-r} ${-r} ${r * 2} ${r * 2}" style="display:block"><path d="M0,${-r} Q${r * 0.12},${-r * 0.12} ${r},0 Q${r * 0.12},${r * 0.12} 0,${r} Q${-r * 0.12},${r * 0.12} ${-r},0 Q${-r * 0.12},${-r * 0.12} 0,${-r} Z" fill="${fill}" stroke="#ffb300" stroke-width="2"/></svg>`;
        const puff = (d, c) => `<svg width="${d}" height="${d}" viewBox="0 0 ${d} ${d}" style="display:block"><circle cx="${d / 2}" cy="${d / 2}" r="${d / 2 - 3}" fill="${c || "#fffdf5"}" stroke="#bfe3f3" stroke-width="3"/></svg>`;
        const place = (el, w, h) => { gsap.set(el, { transformOrigin: "50% 50%", xPercent: 0, left: -w / 2, top: -h / 2 }); };

        // くしゃみの衝撃リング(3.0)  頭の前方
        [0, 0.05].forEach((dl, i) => {
          const el = addFx(`<svg width="200" height="200" viewBox="0 0 200 200" style="display:block"><circle cx="100" cy="100" r="92" fill="none" stroke="#fffdf5" stroke-width="${i ? 6 : 12}"/><circle cx="100" cy="100" r="98" fill="none" stroke="#bfe3f3" stroke-width="3"/></svg>`);
          place(el, 200, 200);
          const cx = 800, cy = 548;
          A(el, 2.967 + dl, 0.34, { x: (u) => cx, y: (u) => cy, scale: (u) => lerp(0.2, 2.7, EZ.out3(u)), opacity: (u) => (u <= 0 ? 0 : 0.95 * (1 - EZ.in(u))) });
        });
        // 風の筋
        [[548, 0], [596, 0.03], [640, 0.05]].forEach(([y, dl], i) => {
          const el = addFx(`<div style="width:${150 - i * 20}px;height:9px;border-radius:5px;background:#fffdf5;box-shadow:0 0 0 3px #bfe3f3"></div>`);
          A(el, 2.967 + dl, 0.24, { x: (u) => lerp(700, 470, EZ.out(u)), y: () => y, opacity: (u) => (u <= 0 ? 0 : 1 - EZ.in(u)) });
        });
        // 蒸気(スライム位置 約 (590, 810))
        const slx = 478, sly = 835;
        for (let i = 0; i < 8; i++) {
          const d = 46 + R() * 40, el = addFx(puff(d, i % 3 ? "#fffdf5" : "#f2fbff")); place(el, d, d);
          const ang = -Math.PI * (0.15 + 0.7 * (i / 7)), dist = 60 + R() * 70, dl = R() * 0.08;
          A(el, 2.967 + dl, 0.75, { x: (u) => slx + Math.cos(ang) * dist * EZ.out(u) - 30 * u, y: (u) => sly - 30 + Math.sin(ang) * dist * EZ.out(u) - 80 * u, scale: (u) => lerp(0.3, 1.5, EZ.out(u)), opacity: (u) => (u <= 0 ? 0 : u < 0.55 ? 0.96 : 0.96 * (1 - (u - 0.55) / 0.45)) });
        }
        // 小さな星
        for (let i = 0; i < 6; i++) {
          const r = 13 + R() * 6, el = addFx(star5(r, "#ffd34d")); place(el, r * 2 + 8, r * 2 + 8);
          const ang = -Math.PI * (0.1 + 0.8 * (i / 5)), dist = 130 + R() * 90;
          A(el, 2.99, 0.62, { x: (u) => slx + Math.cos(ang) * dist * EZ.out3(u), y: (u) => sly - 20 + Math.sin(ang) * dist * EZ.out3(u) + 50 * u * u, rotation: (u) => 360 * u * (i % 2 ? 1 : -1), scale: (u) => lerp(0.4, 1, EZ.out(u)) * (1 - 0.4 * u), opacity: (u) => (u <= 0 ? 0 : u < 0.7 ? 1 : 1 - (u - 0.7) / 0.3) });
        }

        // 狼ヒット(5.5): 接触点のフラッシュ
        { const el = addFx(spark4(70, "#fffdf5")); place(el, 140, 140);
          A(el, 5.467, 0.2, { x: () => 905, y: () => 668, rotation: (u) => 30 * u, scale: (u) => (u < 0.35 ? lerp(0.2, 1.3, EZ.out(u / 0.35)) : lerp(1.3, 0, EZ.in((u - 0.35) / 0.65))), opacity: (u) => (u <= 0 ? 0 : 1) }); }
        // 狼のキラーン(遠景 約 (1560, 470))
        { const el = addFx(spark4(80, "#fffdf5")); place(el, 160, 160);
          A(el, 6.03, 0.5, { x: () => 1568, y: () => 478, rotation: (u) => 45 * u, scale: (u) => (u < 0.3 ? lerp(0, 1.15, EZ.out(u / 0.3)) : lerp(1.15, 0, EZ.in((u - 0.3) / 0.7))), opacity: (u) => (u <= 0 ? 0 : 1) });
          const el2 = addFx(spark4(36, "#fff3a8")); place(el2, 72, 72);
          A(el2, 6.11, 0.4, { x: () => 1620, y: () => 440, scale: (u) => (u < 0.3 ? lerp(0, 1, EZ.out(u / 0.3)) : lerp(1, 0, EZ.in((u - 0.3) / 0.7))), opacity: (u) => (u <= 0 ? 0 : 1) }); }

        // 熊: 着地の砂煙(7.5)
        for (let i = 0; i < 8; i++) {
          const d = 70 + R() * 60, el = addFx(puff(d, "#f3e7c4").replace("#bfe3f3", "#d8c79a")); place(el, d, d);
          const side = i % 2 ? 1 : -1, dist = 120 + R() * 220, dl = R() * 0.05;
          A(el, 7.5 + dl, 0.7, { x: (u) => bearCX + side * (60 + dist * EZ.out3(u)), y: (u) => 880 - 40 * u - (i % 3) * 8, scale: (u) => lerp(0.4, 1.4, EZ.out(u)), opacity: (u) => (u <= 0 ? 0 : 0.92 * (1 - EZ.in(u))) });
        }
        // 手を振る風圧(7.93→8.0)
        { const el = addFx(`<svg width="260" height="260" viewBox="0 0 260 260" style="display:block"><path d="M60 40 Q220 130 60 220" fill="none" stroke="#fffdf5" stroke-width="16" stroke-linecap="round"/><path d="M60 40 Q220 130 60 220" fill="none" stroke="#bfe3f3" stroke-width="5" stroke-linecap="round" transform="translate(6 0)"/></svg>`); place(el, 260, 260);
          A(el, 7.86, 0.14, { x: (u) => lerp(960, 1190, EZ.out(u)), y: () => 640, scale: (u) => lerp(0.5, 1.2, u), opacity: (u) => (u <= 0 ? 0 : u < 0.7 ? 1 : 1 - (u - 0.7) / 0.3) }); }
        // 熊ヒットのフラッシュ(8.0)
        { const el = addFx(spark4(110, "#fffdf5")); place(el, 220, 220);
          A(el, 7.967, 0.3, { x: () => 1330, y: () => 560, rotation: (u) => 40 * u, scale: (u) => (u < 0.3 ? lerp(0.2, 1.2, EZ.out(u / 0.3)) : lerp(1.2, 0, EZ.in((u - 0.3) / 0.7))), opacity: (u) => (u <= 0 ? 0 : 1) }); }
        // 熊のキラーン(上空 約 (1080, 110))
        { const el = addFx(spark4(95, "#fffdf5")); place(el, 190, 190);
          A(el, 8.68, 0.5, { x: () => 1085, y: () => 112, rotation: (u) => 45 * u, scale: (u) => (u < 0.3 ? lerp(0, 1.2, EZ.out(u / 0.3)) : lerp(1.2, 0, EZ.in((u - 0.3) / 0.7))), opacity: (u) => (u <= 0 ? 0 : 1) });
          const el2 = addFx(spark4(40, "#fff3a8")); place(el2, 80, 80);
          A(el2, 8.76, 0.4, { x: () => 1160, y: () => 76, scale: (u) => (u < 0.3 ? lerp(0, 1, EZ.out(u / 0.3)) : lerp(1, 0, EZ.in((u - 0.3) / 0.7))), opacity: (u) => (u <= 0 ? 0 : 1) }); }
        // 9.0 満足のきらめき
        [[-110, -40, 0], [120, -80, 0.12], [175, 30, 0.24]].forEach(([dx, dy, dl], i) => {
          const el = addFx(spark4(26 - i * 4, "#fff3a8")); place(el, 52, 52);
          A(el, 9.05 + dl, 0.45, { x: () => 800 + dx, y: () => 540 + dy, rotation: (u) => 40 * u, scale: (u) => (u < 0.4 ? lerp(0, 1, EZ.out(u / 0.4)) : lerp(1, 0, EZ.in((u - 0.4) / 0.6))), opacity: (u) => (u <= 0 ? 0 : 1) });
        });

        /* ============ 足もとの薬草(最後まで気づかない) ============ */
        { const x = 905 + P(8.0), W = WIDTH(1);
          mk("lHerb", W, `<g transform="translate(${x},948) scale(1.7)"><path d="M0,0 L0,-30" stroke="#2f8f3a" stroke-width="5" stroke-linecap="round"/><ellipse cx="-15" cy="-34" rx="17" ry="8" transform="rotate(-28 -15 -34)" fill="#3dbb4f"/><ellipse cx="15" cy="-34" rx="17" ry="8" transform="rotate(28 15 -34)" fill="#3dbb4f"/><ellipse cx="0" cy="-48" rx="8" ry="17" fill="#55d266"/><ellipse cx="-17" cy="-36" rx="8" ry="3" transform="rotate(-28 -17 -36)" fill="#8be58f"/></g><g id="herbGlint"><path transform="translate(${x + 44},870)" d="M0,-16 Q2,-2 16,0 Q2,2 0,16 Q-2,2 -16,0 Q-2,-2 0,-16 Z" fill="#fffdf5"/></g>`);
          par("lHerb", 1);
          gsap.set("#herbGlint", { svgOrigin: `${x + 44} 870` });
          drive($("herbGlint"), "scale", (t) => (t < 7.9 ? 0 : 0.7 + 0.3 * Math.sin(t * 5)));
        }

        /* ============ UI ============ */
        drive($("ui"), "y", kf([[0.15, -170], [0.55, 0, "back"]]));
        const incs = [2.967, 5.467, 7.967];
        const cnt = kf([[2.967, 0], [3.167, 1, "back"], [5.467, 1], [5.667, 2, "back"], [7.967, 2], [8.167, 3, "back"]]);
        const blink = (t) => (t >= 9.0 && t < 9.6 ? (Math.floor((t - 9.0) / 0.1) % 2 === 0 ? 0.25 : 1) : 1);
        for (let i = 0; i < 4; i++) {
          drive($("ud" + i), "y", (t) => 84 * (i - cnt(t)));
          drive($("ud" + i), "opacity", (t) => (Math.abs(i - cnt(t)) < 0.98 ? blink(t) : 0));
        }
        let pp = [[2.95, 1]];
        incs.forEach((e) => { pp.push([e, 1], [e + 0.06, 1.16, "out"], [e + 0.28, 1, "s"]); });
        drive($("uipanel"), "scale", kf(pp));
        drive($("uiplus"), "opacity", (t) => { let o = 0; for (const e of incs) { const u = (t - e) / 0.8; if (u > 0 && u < 1) o = Math.max(o, Math.min(u / 0.08, 1) * (1 - clamp((u - 0.5) / 0.5))); } return o; });
        drive($("uiplus"), "y", (t) => { let y = 0; for (const e of incs) { const u = (t - e) / 0.8; if (u > 0 && u < 1) y = -8 + 26 * EZ.out(u); } return y; });
        drive($("uiwin"), "scale", (t) => (t >= 9.0 && t < 9.6 ? (Math.floor((t - 9.0) / 0.1) % 2 === 0 ? 0.9 : 1) : 1));

        /* ============ 字幕 ============ */
        const ring = (r, n) => Array.from({ length: n }, (_, i) => `${(Math.cos((i / n) * 6.2832) * r).toFixed(2)}px ${(Math.sin((i / n) * 6.2832) * r).toFixed(2)}px 0 #0a0a12`).join(",");
        const shadow = [ring(4.2, 24), ring(2.4, 12)].join(",");
        const subs = [["sub1", 1.0, 2.2], ["sub2", 3.0, 4.0], ["sub3", 5.5, 6.5]];
        subs.forEach(([id, a, b]) => {
          $(id).style.textShadow = shadow;
          drive($(id), "opacity", kf([[a, 0], [a + 0.1, 1, "lin"], [b - 0.1, 1], [b, 0, "lin"]]));
        });

        window.__timelines["main"] = tl;
      })();
    </script>
  </body>
</html>
