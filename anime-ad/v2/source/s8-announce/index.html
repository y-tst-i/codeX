        <div id="rule"></div>
        <div id="gem"></div>
        <div id="tvl" class="tvline"></div>
        <div id="tvr" class="tvline"></div>
        <div class="tv"><span id="tv">TVアニメ</span></div>
        <div id="kettei"><span>放</span><span>送</span><span>決</span><span>定</span></div>
        <div id="note">※本作品は架空のアニメです。</div>
      </div>
      <div id="white" class="fill"></div>
      <div id="black" class="fill"></div>
    </div>
    <script>
      // ---- halftone field + gold dust: pure function of t ----
      const cv = document.getElementById("dots"), cx = cv.getContext("2d");
      const hash = (a, b) => { const s = Math.sin(a * 127.1 + b * 311.7) * 43758.5453; return s - Math.floor(s); };
      const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
      const sstep = (a, b, v) => { const k = clamp((v - a) / (b - a), 0, 1); return k * k * (3 - 2 * k); };
      const SP = 27, ANG = 0.31, CA = Math.cos(ANG), SA = Math.sin(ANG);
      const specks = [];
      (function () { let s = 20260926; const r = () => { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; };
        for (let i = 0; i < 46; i++) specks.push({ x: r() * 1920, y: r() * 1080, v: 10 + r() * 16, z: 0.8 + r() * 1.8, p: r() * 6.28 }); })();
      function draw(t) {
        cx.clearRect(0, 0, 1920, 1080);
        const rev = clamp((t - 0.1) / 1.5, 0, 1) * 1.7;
        for (let u = -50; u <= 50; u++) for (let v = -50; v <= 50; v++) {
          const x = 960 + (u * CA - v * SA) * SP, y = 560 + (u * SA + v * CA) * SP;
          if (x < -10 || x > 1930 || y < -10 || y > 1090) continue;
          const nd = Math.hypot(x - 960, y - 560) / 1150;
          const th = 0.55 * hash(u, v) + 0.45 * nd;
          const pop = sstep(0, 1, (rev - th) * 2.4);
          if (pop <= 0) continue;
          const field = 0.5 + 0.5 * Math.sin(x * 0.0042 + t * 0.5 + Math.sin(y * 0.003 + t * 0.2) * 1.6);
          const quiet = 0.28 + 0.72 * sstep(0.22, 0.85, nd);
          const r = 8.6 * pop * (0.25 + 0.75 * field) * quiet;
          if (r < 0.4) continue;
          cx.fillStyle = field > 0.9 && nd > 0.5 ? "rgba(236,190,96,0.38)" : "rgba(52,86,176,0.55)";
          cx.beginPath(); cx.arc(x, y, r, 0, 6.2832); cx.fill();
        }
        const sa = sstep(1.4, 2.4, t);
        if (sa > 0) for (const s of specks) {
          const y = ((s.y - (t - 1.4) * s.v) % 1080 + 1080) % 1080;
          const a = sa * (0.25 + 0.35 * Math.sin(t * 1.3 + s.p));
          cx.fillStyle = "rgba(255,214,120," + a.toFixed(3) + ")";
          cx.beginPath(); cx.arc(s.x, y, s.z, 0, 6.2832); cx.fill();
        }
      }

      const tl = gsap.timeline({ paused: true });
      tl.eventCallback("onUpdate", () => draw(tl.time()));
      draw(0);

      // white -> navy (first 2 frames pure white, decays by 0.4s)
      tl.to("#white", { opacity: 0, duration: 0.333, ease: "power2.out" }, 0.0667);

      // slow camera drift over the whole scene
      tl.fromTo("#cam", { scale: 1 }, { scale: 1.032, duration: 4, ease: "none", transformOrigin: "50% 50%" }, 0);

      // CUE-A 0.40 : hairline blooms from centre, gold line-draw of the title begins
      tl.fromTo("#rule", { scaleX: 0, opacity: 1 }, { scaleX: 1, duration: 1.2, ease: "power3.out" }, 0.4);
      tl.fromTo("#glow", { opacity: 0 }, { opacity: 0.32, duration: 0.5, ease: "power2.out" }, 0.4);
      tl.to("#glow", { opacity: 0.12, duration: 0.9, ease: "sine.inOut" }, 0.9);
      tl.to("#glow", { opacity: 0.24, duration: 0.7, ease: "sine.inOut" }, 1.8);
      tl.to("#glow", { opacity: 0.14, duration: 1.2, ease: "sine.inOut" }, 2.5);
      tl.fromTo("#fr1", { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: 1.6, ease: "power2.inOut" }, 0.45);
      tl.fromTo("#fr2", { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: 1.8, ease: "power2.inOut" }, 0.55);
      tl.fromTo("#gem", { opacity: 0, scale: 0.2 }, { opacity: 1, scale: 1, duration: 0.5, ease: "power2.out" }, 1.1);

      // title strokes: 世界最強 (b0..b3) 0.40-1.54, レベル1なのに (a0..a6) 0.45-1.57
      for (let i = 0; i < 4; i++) {
        tl.fromTo("#s-b" + i, { strokeDashoffset: 1, strokeOpacity: 1 }, { strokeDashoffset: 0, duration: 0.76, ease: "sine.inOut" }, 0.4 + i * 0.126);
      }
      for (let i = 0; i < 7; i++) {
        tl.fromTo("#s-a" + i, { strokeDashoffset: 1, strokeOpacity: 1 }, { strokeDashoffset: 0, duration: 0.66, ease: "sine.inOut" }, 0.45 + i * 0.075);
      }
      // CUE-B 1.60 : line becomes fill, rising from the bottom
      tl.fromTo("#fillrect", { attr: { y: 770, height: 0 } }, { attr: { y: 250, height: 520 }, duration: 0.75, ease: "power1.inOut" }, 1.6);
      tl.to(".st", { strokeOpacity: 0.5, duration: 0.8, ease: "sine.inOut" }, 1.9);
      // very slow light sweep through the lettering
      tl.fromTo("#sweep", { attr: { x1: -500, x2: -100 } }, { attr: { x1: 2000, x2: 2400 }, duration: 1.5, ease: "sine.inOut" }, 2.15);

      // CUE-C 1.80 : TVアニメ label with flanking hairlines
      tl.fromTo(".tv", { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.55, ease: "power2.out" }, 1.8);
      tl.fromTo(".tvline", { opacity: 1, scaleX: 0 }, { opacity: 1, scaleX: 1, duration: 0.7, ease: "power3.out" }, 1.8);

      // CUE-D 2.20 : 放送決定 — wide tracking closes in, no scale
      document.querySelectorAll("#kettei span").forEach((el, i) => {
        tl.fromTo(el, { opacity: 0, x: (i - 1.5) * 62, filter: "blur(7px)" },
          { opacity: 1, x: 0, filter: "blur(0px)", duration: 1.25, ease: "power3.out" }, 2.2);
      });

      // CUE-E 2.80 : disclaimer, faint
      tl.fromTo("#note", { opacity: 0 }, { opacity: 0.62, duration: 0.8, ease: "sine.out" }, 2.8);

      // fade out 3.50-3.90 (last frames pure black)
      tl.to("#black", { opacity: 1, duration: 0.4, ease: "power1.in" }, 3.5);

      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
