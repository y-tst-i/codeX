<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>s3-punch</title>
    <script src="assets/gsap.min.js"></script>
    <style>
      @font-face { font-family: "Dela Gothic One"; src: url("assets/fonts/DelaGothicOne.ttf") format("truetype"); font-weight: 400; }
      @font-face { font-family: "Yuji Boku"; src: url("assets/fonts/YujiBoku.ttf") format("truetype"); font-weight: 400; }
      @font-face { font-family: "Noto Sans JP"; src: url("assets/fonts/NotoSansJP700.ttf") format("truetype"); font-weight: 700; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: #000; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: #000; }
      #cam { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 1330px 520px; }
      .layer { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; display: none; }
      canvas { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; display: none; }

      /* void behind the shattered screen */
      #void { position: absolute; left: -120px; top: -120px; width: 2160px; height: 1320px;
        background: linear-gradient(180deg, #05050d 0%, #0d0c2b 50%, #2a0e2c 100%); }
      #glow { position: absolute; left: -120px; top: -120px; width: 2160px; height: 1320px; transform-origin: 1450px 640px;
        background: radial-gradient(circle at 1450px 640px, rgba(255,246,206,1) 0, rgba(255,196,0,.95) 130px, rgba(255,110,30,.7) 380px, rgba(255,42,77,.34) 800px, rgba(120,20,90,.16) 1200px, rgba(120,20,90,0) 1600px); }

      #glow2 { position: absolute; left: -120px; top: -120px; width: 2160px; height: 1320px;
        background: radial-gradient(circle at 1450px 640px, rgba(255,42,77,.6) 0, rgba(200,30,100,.32) 420px, rgba(70,20,120,.14) 900px, rgba(70,20,120,0) 1500px); }
      /* shards */
      #shards { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; display: none; }
      .shard { position: absolute; overflow: hidden; }
      .shard .inner { position: absolute; width: 1920px; height: 1080px; }
      .shard .dim { position: absolute; left: 0; top: 0; width: 100%; height: 100%; background: #0a0a12; opacity: 0; }
      .shard .hot { position: absolute; left: 0; top: 0; width: 100%; height: 100%; background: #fffdf5; opacity: 0; }
      .shard svg.edge { position: absolute; left: 0; top: 0; width: 100%; height: 100%; overflow: visible; }

      /* punch frame */
      .punch { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; overflow: hidden;
        background: radial-gradient(circle at 1330px 520px, #fffbe0 0, #ffe27a 230px, #ffa11a 640px, #ff5a2a 1150px, #d8143a 1800px); }
      .punch svg.lines { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; }
      .dodo { position: absolute; left: 1010px; top: 600px; width: 880px; height: 420px; transform-origin: 440px 210px;
        font-family: "Dela Gothic One", "Noto Sans JP", sans-serif; font-size: 380px; line-height: 1; white-space: nowrap;
        color: #fffdf5; -webkit-text-stroke: 24px #0a0a12; paint-order: stroke fill; letter-spacing: -0.02em;
        text-shadow: 18px 20px 0 #ff2a4d; }
      .herobox { position: absolute; left: 0; top: 0; width: 520px; height: 900px; }
      .herobox svg { overflow: visible; }

      /* freeze frames */
      .fa { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; overflow: hidden; }
      .glint svg *:not(.eye) { visibility: hidden; }
      .glint .eye { visibility: visible; }

      /* kanji */
      #kanji { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; display: none; }
      .col { position: absolute; top: 70px; width: 250px; height: 800px; writing-mode: vertical-rl;
        font-family: "Yuji Boku", "Noto Sans JP", serif; font-size: 244px; line-height: 1; letter-spacing: 0.02em;
        color: #fffdf5; filter: url(#brush) drop-shadow(0 0 26px rgba(255,42,77,.55)); }
      .col span { display: inline-block; text-shadow: 12px 14px 0 rgba(10,10,18,.92); }
      .fleck { position: absolute; border-radius: 50%; background: #fffdf5; opacity: 0; }

      /* star */
      #star { position: absolute; left: 1650px; top: 120px; width: 180px; height: 180px; display: none; }
      #kira { position: absolute; left: 1560px; top: 300px; display: none; white-space: nowrap;
        font-family: "Dela Gothic One", "Noto Sans JP", sans-serif; font-size: 64px; color: #ffc400;
        text-shadow: 4px 5px 0 #0a0a12; -webkit-text-stroke: 1px #fff5c0; transform: rotate(-9deg); }
      #trail { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; display: none; }
      .tdot { position: absolute; width: 9px; height: 9px; border-radius: 50%; background: #fffdf5; box-shadow: 0 0 12px #ffc400; opacity: 0; }

      /* tape stamp */
      #tapewrap { position: absolute; left: 0; top: 878px; width: 1920px; display: none; text-align: center; }
      #tape { display: inline-block; filter: drop-shadow(8px 10px 0 rgba(10,10,18,.7)); }
      #tape span { display: block; padding: 26px 74px 28px; background: #ffc400; color: #0a0a12;
        font-family: "Noto Sans JP", sans-serif; font-weight: 700; font-size: 66px; letter-spacing: 0.04em; line-height: 1.15;
        clip-path: polygon(0 0,100% 0,98.6% 16%,100% 33%,98.6% 50%,100% 66%,98.6% 83%,100% 100%,0 100%,1.4% 83%,0 66%,1.4% 50%,0 33%,1.4% 16%);
        background-image: repeating-linear-gradient(90deg, rgba(255,255,255,.18) 0 3px, rgba(255,255,255,0) 3px 11px); }
    </style>
  </head>
  <body>
    <svg width="0" height="0" style="position:absolute" aria-hidden="true">
      <defs>
        <filter id="brush" x="-8%" y="-4%" width="116%" height="108%">
          <feTurbulence type="fractalNoise" baseFrequency="0.05 0.035" numOctaves="3" seed="11" result="n" />
          <feDisplacementMap in="SourceGraphic" in2="n" scale="11" xChannelSelector="R" yChannelSelector="G" />
        </filter>
      </defs>
    </svg>
    <div id="root" data-composition-id="main" data-start="0" data-duration="5.2" data-width="1920" data-height="1080">
    <div aria-hidden="true" data-layout-ignore style="position:absolute;left:-5000px;top:0;white-space:nowrap;font-size:40px">
      <span style="font-family:'Dela Gothic One'">ドッキラーン</span><span style="font-family:'Yuji Boku'">魔王、消滅。</span><span style="font-family:'Noto Sans JP';font-weight:700">※ただの準備運動です</span>
    </div>
      <div id="cam">
        <!-- world behind the screen -->
        <div id="voidwrap" class="layer"><div id="void"></div><div id="glow"></div><div id="glow2"></div></div>
        <canvas id="ash" data-layout-allow-overflow width="1920" height="1080"></canvas>
        <div id="shards"></div>
        <canvas id="embers" data-layout-allow-overflow width="1920" height="1080"></canvas>
        <canvas id="fx" width="1920" height="1080"></canvas>
        <!-- freeze frames -->
        <div id="fz0" class="layer" style="background:#000"></div>
        <div id="fa1" class="layer"></div>
        <div id="fa2" class="layer"></div>
        <div id="fa3" class="layer"></div>
        <div id="fwhite" class="layer" style="background:#fffdf5"></div>
        <div id="fc0" class="layer"></div>
        <div id="fc1" class="layer"></div>
        <div id="fc2" class="layer"></div>
        <canvas id="cracks" width="1920" height="1080"></canvas>
        <!-- afterglow text -->
        <div id="trail"></div>
        <div id="kanji">
          <div class="col" id="col1" data-layout-allow-overlap data-layout-allow-occlusion style="left:1180px"><span>魔</span><span>王</span><span>、</span></div>
          <div class="col" id="col2" data-layout-allow-overlap data-layout-allow-occlusion style="left:900px"><span>消</span><span>滅</span><span>。</span></div>
        </div>
        <svg id="star" viewBox="-90 -90 180 180">
          <g id="starg">
            <path d="M0 -86 L2.2 -2.2 L86 0 L2.2 2.2 L0 86 L-2.2 2.2 L-86 0 L-2.2 -2.2 Z" fill="#fff5c0" opacity=".85" />
            <path d="M0 -50 Q7 -7 50 0 Q7 7 0 50 Q-7 7 -50 0 Q-7 -7 0 -50 Z" fill="#ffc400" />
            <path d="M0 -26 Q4 -4 26 0 Q4 4 0 26 Q-4 4 -26 0 Q-4 -4 0 -26 Z" fill="#fffdf5" />
          </g>
        </svg>
        <div id="kira" data-layout-allow-overlap data-layout-allow-occlusion>キラーン</div>
        <div id="tapewrap"><div id="tape" data-layout-allow-overlap data-layout-allow-occlusion><span>※ただの準備運動です</span></div></div>
      </div>
    </div>
    <script>
      // ---------- utils ----------
      function mulberry32(a) { return function () { a |= 0; a = (a + 0x6d2b79f5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
      const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
      const eo3 = (x) => 1 - Math.pow(1 - clamp(x, 0, 1), 3);
      const eo2 = (x) => 1 - Math.pow(1 - clamp(x, 0, 1), 2);
      const smooth = (a, b, x) => { const u = clamp((x - a) / (b - a), 0, 1); return u * u * (3 - 2 * u); };
      function hash(n) { n = Math.imul(n ^ 61, 0x45d9f3b); n = Math.imul(n ^ (n >>> 15), 0x45d9f3b); return ((n ^ (n >>> 16)) >>> 0) / 4294967296; }
      const $ = (id) => document.getElementById(id);
      const P = { x: 1330, y: 520 };
      const FPS = 30;

      // ---------- hero ----------
      const HERO = `<g class="cape"><path d="M186 262 C96 300 44 440 22 640 L64 604 L58 700 L112 636 L124 726 L166 622 C176 500 194 400 222 300 Z" fill="#0a0a12" stroke="#ffd34d" stroke-width="2.5" stroke-linejoin="round"/></g>
  <g class="legs"><path d="M200 515 L258 520 L236 700 L218 846 L254 874 L102 874 L110 848 L172 832 L184 700 Z" fill="#0a0a12" stroke="#ffd34d" stroke-width="2.5" stroke-linejoin="round"/><path d="M256 515 L314 505 L332 690 L354 852 L416 874 L272 874 L284 842 L292 690 Z" fill="#0a0a12" stroke="#ffd34d" stroke-width="2.5" stroke-linejoin="round"/></g>
  <g class="backarm"><path d="M192 262 L150 382 L140 482 L172 490 L198 402 L228 292 Z" fill="#0a0a12" stroke="#ffd34d" stroke-width="2.5" stroke-linejoin="round"/><circle cx="156" cy="498" r="27" fill="#0a0a12" stroke="#ffd34d" stroke-width="2.5"/></g>
  <path class="torso" d="M180 252 C215 236 288 236 324 252 L348 402 L362 566 L190 580 L168 402 Z" fill="#0a0a12" stroke="#ffd34d" stroke-width="2.5" stroke-linejoin="round"/>
  <path class="belt" d="M186 520 L360 508 L362 534 L188 546 Z" fill="#1a1a26" stroke="#ffd34d" stroke-width="2"/>
  <g class="head"><path d="M222 205 L286 205 L290 244 L222 244 Z" fill="#0a0a12"/><ellipse cx="254" cy="170" rx="42" ry="47" fill="#0a0a12" stroke="#ffd34d" stroke-width="2.5"/><path d="M208 150 L168 100 L216 122 L204 56 L244 110 L264 34 L284 106 L322 64 L308 128 L336 146 L314 156 L212 156 Z" fill="#0a0a12" stroke="#ffd34d" stroke-width="2.5" stroke-linejoin="round"/><path class="band" d="M214 150 C170 138 118 170 76 232 C128 190 172 192 218 170 Z M222 156 C190 170 160 206 150 250 C176 214 200 196 226 182 Z" fill="#ff2a4d"/><path class="eye" d="M262 170 L298 160 L300 173 L266 180 Z" fill="#fffdf5"/></g>
  <g class="scarf"><path d="M208 252 C150 252 96 236 28 296 C96 292 148 306 214 290 Z" fill="#ff2a4d"/><path d="M206 252 L312 250 L318 276 L202 284 Z" fill="#ff2a4d"/></g>
  <g class="arm"><rect class="armrect" x="318" y="244" width="130" height="46" rx="23" fill="#0a0a12" stroke="#ffd34d" stroke-width="2.5"/><g class="fistg"><circle cx="452" cy="267" r="38" fill="#0a0a12" stroke="#ffd34d" stroke-width="2.5"/><path d="M448 247 Q466 243 484 249 M446 266 Q466 262 488 268 M449 285 Q466 282 482 287" stroke="#ffd34d" stroke-width="3" fill="none" stroke-linecap="round"/></g></g>`;
      // eye in hero coords ~ (280,168). hero element is placed so that the eye is at (ex,ey)
      function heroEl(o) {
        const d = document.createElement("div");
        d.className = "herobox";
        d.style.left = o.ex - 280 + "px";
        d.style.top = o.ey - 168 + "px";
        d.style.transformOrigin = "280px 168px";
        d.style.transform = `rotate(${o.tilt || 0}deg) scale(${o.s})`;
        if (o.filter) d.style.filter = o.filter;
        d.innerHTML = `<svg viewBox="0 0 520 900" width="520" height="900">${HERO}</svg>`;
        if (o.behind) { const a = d.querySelector(".arm"); a.parentNode.insertBefore(a, d.querySelector(".torso")); }
        const sx = o.sx == null ? 1 : o.sx;
        d.querySelector(".arm").setAttribute("transform", `translate(320 267) rotate(${o.rot || 0}) scale(${sx} 1) translate(-320 -267)`);
        const k = o.k || 1;
        d.querySelector(".fistg").setAttribute("transform", `translate(452 267) scale(${k / sx} ${k}) translate(-452 -267)`);
        return d;
      }
      const el = (tag, css, html) => { const e = document.createElement(tag); if (css) e.style.cssText = css; if (html) e.innerHTML = html; return e; };

      // ---------- shock / crack geometry (seeded) ----------
      const NA = 12, RINGS = [0, 150, 360, 680, 1100, 3300];
      const rg = mulberry32(2024);
      const rayAng = [];
      for (let j = 0; j < NA; j++) rayAng.push(((j + (rg() - 0.5) * 0.55) * 2 * Math.PI) / NA + 0.2);
      const V = [];
      for (let i = 0; i <= RINGS.length - 1; i++) {
        V[i] = [];
        for (let j = 0; j < NA; j++) {
          if (i === 0) { V[i][j] = { x: P.x, y: P.y }; continue; }
          const a = rayAng[j] + (rg() - 0.5) * 0.07;
          const r = RINGS[i] * (i === RINGS.length - 1 ? 1 : 1 + (rg() - 0.5) * 0.2);
          V[i][j] = { x: P.x + Math.cos(a) * r, y: P.y + Math.sin(a) * r };
        }
      }
      function jag(a, b, n) {
        const pts = [a];
        const dx = b.x - a.x, dy = b.y - a.y, len = Math.hypot(dx, dy) || 1;
        const nx = -dy / len, ny = dx / len;
        const amp = Math.min(len * 0.07, 26);
        for (let m = 1; m < n; m++) {
          const u = m / n + (rg() - 0.5) * 0.08, off = (rg() - 0.5) * 2 * amp;
          pts.push({ x: a.x + dx * u + nx * off, y: a.y + dy * u + ny * off });
        }
        pts.push(b);
        return pts;
      }
      const rayE = [], ringE = [];
      for (let i = 0; i < RINGS.length; i++) {
        rayE[i] = []; ringE[i] = [];
        for (let j = 0; j < NA; j++) {
          if (i < RINGS.length - 1) rayE[i][j] = jag(V[i][j], V[i + 1][j], i === 0 ? 3 : 4);
          ringE[i][j] = i === 0 ? [V[0][j], V[0][j]] : jag(V[i][j], V[i][(j + 1) % NA], 3);
        }
      }
      const rev = (a) => a.slice().reverse();
      const CELLS = [];
      for (let i = 0; i < RINGS.length - 1; i++) {
        for (let j = 0; j < NA; j++) {
          const j2 = (j + 1) % NA;
          let pts = [].concat(rayE[i][j], ringE[i + 1][j].slice(1), rev(rayE[i][j2]).slice(1), i === 0 ? [] : rev(ringE[i][j]).slice(1, -1));
          const out = [];
          pts.forEach((p) => { const q = out[out.length - 1]; if (!q || Math.hypot(q.x - p.x, q.y - p.y) > 0.5) out.push(p); });
          CELLS.push({ i, j, pts: out });
        }
      }

      // ---------- punch frame (C layout) ----------
      function speedLines(seed) {
        const r = mulberry32(seed);
        let ink = "", pap = "";
        const R = 2900;
        for (let n = 0; n < 130; n++) {
          const th = r() * Math.PI * 2, r0 = 270 + r() * 330, w = 0.007 + r() * 0.03;
          const p0 = [P.x + Math.cos(th) * r0, P.y + Math.sin(th) * r0];
          const p1 = [P.x + Math.cos(th - w) * R, P.y + Math.sin(th - w) * R];
          const p2 = [P.x + Math.cos(th + w) * R, P.y + Math.sin(th + w) * R];
          const s = `${p0[0].toFixed(1)},${p0[1].toFixed(1)} ${p1[0].toFixed(1)},${p1[1].toFixed(1)} ${p2[0].toFixed(1)},${p2[1].toFixed(1)} `;
          if (r() < 0.18) pap += s.replace(/ $/, "") + "|"; else ink += s.replace(/ $/, "") + "|";
        }
        const mk = (str, fill, op) => str.split("|").filter(Boolean).map((p) => `<polygon points="${p}" fill="${fill}" opacity="${op}"/>`).join("");
        return `<svg class="lines" viewBox="0 0 1920 1080">${mk(ink, "#0a0a12", 0.92)}${mk(pap, "#fffdf5", 0.9)}</svg>`;
      }
      function impactStar() {
        const r = mulberry32(5), n = 18;
        let o = "", inn = "";
        for (let k = 0; k < n * 2; k++) {
          const a = (k / (n * 2)) * Math.PI * 2, rad = k % 2 ? 150 + r() * 40 : 330 + r() * 150;
          o += `${(P.x + Math.cos(a) * rad).toFixed(1)},${(P.y + Math.sin(a) * rad).toFixed(1)} `;
          const rad2 = k % 2 ? 90 : 215 + r() * 40;
          inn += `${(P.x + Math.cos(a) * rad2).toFixed(1)},${(P.y + Math.sin(a) * rad2).toFixed(1)} `;
        }
        return `<svg class="lines" viewBox="0 0 1920 1080"><polygon points="${o}" fill="#fffdf5" stroke="#0a0a12" stroke-width="10" stroke-linejoin="round"/><polygon points="${inn}" fill="#fff2a8"/></svg>`;
      }
      function buildPunch(variant) {
        const d = el("div"); d.className = "punch";
        d.appendChild(el("div", "position:absolute;left:0;top:0", speedLines(100 + variant * 17)));
        d.appendChild(el("div", "position:absolute;left:0;top:0", impactStar()));
        d.appendChild(heroEl({ ex: 934, ey: 371, s: 1.5, tilt: -1.5, rot: -3, sx: 1.7, k: 1.8 }));
        const dd = el("div", "", "ドッ"); dd.className = "dodo"; d.appendChild(dd);
        return d;
      }

      // ---------- freeze frames A1..A3 ----------
      function buildA1() {
        const f = $("fa1");
        f.style.background = "#ff7a18";
        f.appendChild(el("div", "position:absolute;left:130px;top:-190px;width:1040px;height:1040px;border-radius:50%;background:#fffdf5"));
        f.appendChild(el("div", "position:absolute;left:0;top:0;width:1920px;height:1080px;background:linear-gradient(115deg,rgba(10,10,18,0) 0 62%,#0a0a12 62% 64%,rgba(10,10,18,0) 64%)"));
        f.appendChild(el("div", "position:absolute;left:0;top:0;width:1920px;height:1080px;background:#0a0a12;clip-path:polygon(0 100%,0 74%,36% 100%)"));
        f.appendChild(el("div", "position:absolute;left:0;top:0;width:1920px;height:1080px;background:#ffc400;clip-path:polygon(100% 0,100% 40%,78% 0)"));
        f.appendChild(heroEl({ ex: 760, ey: 330, s: 1.15, tilt: -5, rot: 180, sx: 1.7, k: 1.3, behind: true }));
      }
      function buildA2() {
        const f = $("fa2");
        f.style.background = "#19d3ff";
        f.appendChild(el("div", "position:absolute;left:0;top:0;width:1920px;height:1080px;background:#0a0a12;clip-path:polygon(100% 0,100% 100%,56% 100%,74% 0)"));
        f.appendChild(el("div", "position:absolute;left:0;top:0;width:1920px;height:1080px;background:#fffdf5;clip-path:polygon(0 0,34% 0,12% 100%,0 100%)"));
        let rings = "";
        [150, 215, 285].forEach((r, i) => { rings += `<circle cx="359" cy="473" r="${r}" fill="none" stroke="${i === 1 ? '#ff2a4d' : '#0a0a12'}" stroke-width="${10 - i * 2}" stroke-dasharray="${i === 1 ? '40 22' : '120 36'}"/>`; });
        f.appendChild(el("div", "position:absolute;left:0;top:0;width:1920px;height:1080px", `<svg width="1920" height="1080" viewBox="0 0 1920 1080">${rings}</svg>`));
        f.appendChild(heroEl({ ex: 700, ey: 290, s: 1.85, tilt: 5, rot: 180, sx: 1.75, k: 1.7, behind: true }));
      }
      function buildA3() {
        const f = $("fa3");
        f.style.background = "radial-gradient(circle at 980px 560px,#fff2a8 0,#ffc400 380px,#ff7a18 800px,#0a0a12 1400px)";
        f.appendChild(el("div", "position:absolute;left:0;top:0;width:1920px;height:120px;background:#0a0a12"));
        f.appendChild(el("div", "position:absolute;left:0;top:960px;width:1920px;height:120px;background:#0a0a12"));
        f.appendChild(heroEl({ ex: 560, ey: 330, s: 2.6, tilt: -3, rot: 0, sx: 0.9, k: 2.1 }));
        // cyan rim ticks near the fist
        f.appendChild(el("div", "position:absolute;left:1040px;top:320px;width:420px;height:12px;background:#19d3ff;transform:rotate(-8deg)"));
        f.appendChild(el("div", "position:absolute;left:1120px;top:790px;width:520px;height:10px;background:#fffdf5;transform:rotate(7deg)"));
      }
      buildA1(); buildA2(); buildA3();
      // glint (eye only on black)
      (function () {
        const g = heroEl({ ex: 760, ey: 330, s: 1.15, tilt: -5, rot: 180, sx: 1.7, k: 1.3, behind: true, filter: "drop-shadow(0 0 10px #fffdf5) drop-shadow(0 0 34px #19d3ff)" });
        g.classList.add("glint");
        $("fz0").appendChild(g);
        $("fz0").appendChild(el("div", "position:absolute;left:690px;top:260px;width:160px;height:160px;border-radius:50%;background:radial-gradient(circle,rgba(255,253,245,.55) 0,rgba(25,211,255,.22) 40%,rgba(25,211,255,0) 70%)"));
        $("fz0").appendChild(el("div", "position:absolute;left:420px;top:326px;width:700px;height:5px;border-radius:3px;background:linear-gradient(90deg,rgba(255,253,245,0),#fffdf5 50%,rgba(255,253,245,0));opacity:.9;transform:rotate(-8deg)", ""));
      })();
      // C frames (3 'boil' variants) + shard source
      const PC = [buildPunch(0), buildPunch(1), buildPunch(2)];
      $("fc0").appendChild(PC[0]); $("fc1").appendChild(PC[1]); $("fc2").appendChild(PC[2]);

      // ---------- shards ----------
      const shardEls = [];
      (function () {
        const rs = mulberry32(99);
        CELLS.forEach((c) => {

          const hot = el("div"); hot.className = "hot"; s.appendChild(hot);

      })();

      }
