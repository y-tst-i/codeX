<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="assets/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #0E0D0C; }
      #root { position: relative; width: 1920px; height: 1080px; background: #0E0D0C; overflow: hidden; }
      canvas { position: absolute; left: 0; top: 0; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="4.4" data-width="1920" data-height="1080">
      <canvas id="c" width="1920" height="1080"></canvas>
    </div>
    <script>
// 場面で毎回書き直しがちな部品(再現性あり: 乱数は seed 付き、時刻 t の純関数)。new_scene.sh が index.html に埋め込む。
const SCENE_LIB = (() => {
  const mulberry32 = (a) => () => { a |= 0; a = (a + 0x6d2b79f5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };

  // 速度の山谷から、映像時間 t -> 素材時間 s(t) の表を作る(スピードランプ)。segs=[[終了秒, 速度], ...] 区間境界は smooth でつなぐ
  function timeRemap(segs, fps = 30, blend = 0.2) {
    const n = Math.ceil(segs[segs.length - 1][0] * fps) + 1, rate = (t) => {
      let i = 0; while (i < segs.length - 1 && t >= segs[i][0]) i++;

  // 雨(3層ストリーク)。ctx に描く。強さ=intensity、風=wind(px/s)。層ごとに速度・長さ・濃さが違う

      const r = mulberry32(seed + li * 101); ctx.strokeStyle = `rgba(${color},${alpha})`; ctx.lineWidth = 1 + li * 0.6; ctx.beginPath();
      for (let i = 0; i < count * intensity; i++) {
        const x0 = r() * (w + 400) - 200, y0 = r() * h, ph = r(), y = (y0 + (t * speed) + ph * h) % (h + len) - len, x = x0 + wind * (y - y0);

})();
      const { clamp, lerp, smooth, ease, mulberry32, rain, vignette, glow, project, timeRemap } = SCENE_LIB;
      const DUR = 4.4, ctx = document.getElementById("c").getContext("2d");
      // ★ここだけ書く: 時刻 t(秒) の純関数。Math.random / Date.now を使わない(乱数は mulberry32(seed))。

      // 弾の画面 x(場面カードの表)。カメラ = 弾の世界 x − 画面 x(並走トラック)

        if (L <= 5) { const u = clamp(L / 5); return 210 + 410 * (1 - (1 - u) * (1 - u)); }

      }

      // ---- 粒子(seed から一括生成。位置は x0 + v·s の閉形式) ----
      const rnd = mulberry32(SEED);
      const mkLayer = (n, par, f) => Array.from({ length: n }, (_, i) => f(i, par));
      const FAR = mkLayer(520, 0.45, () => ({ x0: rnd() * 2400, y0: 230 + rnd() * 640, vx: (rnd() - 0.5) * 40, vy: (rnd() - 0.5) * 20, sz: 0.8 + rnd() * 0.9, a: 0.1 + rnd() * 0.2, ph: rnd() * 6.28, gw: 2 + rnd() * 6 }));
      const MID = mkLayer(1400, 1, (i) => { const band = rnd() < 0.45;
        const y0 = band ? 540 + ((rnd() + rnd() + rnd()) / 3 - 0.5) * 380 : rnd() * 1080;
        return { x0: rnd() * 2400, y0, vx: (rnd() - 0.5) * 60, vy: (rnd() - 0.5) * 36, sz: 0.9 + Math.pow(rnd(), 2) * 2.2, a: 0.28 + rnd() * 0.45, ph: rnd() * 6.28, gw: 1.5 + rnd() * 7, wa: 2 + rnd() * 4, ww: 2 + rnd() * 5, side: i % 2 ? 1 : -1 }; });
      const NEAR = mkLayer(34, 1.8, () => ({ x0: rnd() * 2400, y0: rnd() * 1080, vx: (rnd() - 0.5) * 50, vy: (rnd() - 0.5) * 30, sz: 6 + rnd() * 10, a: 0.05 + rnd() * 0.08, ph: rnd() * 6.28, gw: 1 + rnd() * 3 }));
      const BLOBS = Array.from({ length: 16 }, () => ({ x0: rnd() * 3000, y: 380 + rnd() * 280, rx: 260 + rnd() * 360, ry: 50 + rnd() * 70, a: 0.05 + rnd() * 0.06 }));
      const RING = Array.from({ length: 320 }, () => ({ th: rnd() * Math.PI * 2, j: (rnd() - 0.5) * 0.14, sz: 1.2 + rnd() * 2, a: 0.4 + rnd() * 0.5 }));
      const SHARDS = Array.from({ length: 40 }, () => {
        const back = rnd() < 0.55, th = (back ? Math.PI : 0) + (rnd() + rnd() - 1) * 1.5, v = 350 + rnd() * 1250;
        const nv = 3 + Math.floor(rnd() * 3), pts = Array.from({ length: nv }, (_, k) => [(k / nv) * 6.283 + rnd() * 0.9, 0.5 + rnd() * 0.5]);
        return { vx: Math.cos(th) * v, vy: Math.sin(th) * v - 200, k: 2 + rnd() * 1.5, sz: 5 + rnd() * 14, w: (rnd() - 0.5) * 30, ph: rnd() * 6.28, pts };
      });
      const EMBERS = Array.from({ length: 7 }, () => ({ r: 10 + rnd() * 70, th: rnd() * 6.283, sz: 1.6 + rnd() * 1.4, f: 5 + rnd() * 9, ph: rnd() * 6.28 }));

      // 粒の位置(素材時間 s、カメラ cam、弾 bx)。中層だけマッハコーンと衝撃波に押される

        }
        return [x, y];
      }

      // ---- 背景(影の空気・霞・稜線・敵のシルエット) ----
      function drawHelmet(c, x, y, intact, a, tilt) {
        if (a <= 0.002) return;

        c.fillStyle = "rgb(16,15,14)";
        c.beginPath(); c.ellipse(78, -18, 104, 96, 0, 0, Math.PI * 2); c.fill();                 // ヘルメット
        c.beginPath(); c.moveTo(40, 40); c.lineTo(120, 40); c.lineTo(132, 180); c.lineTo(36, 180); c.fill(); // 首
        c.beginPath(); c.moveTo(-60, 620); c.quadraticCurveTo(-30, 220, 30, 170); c.lineTo(230, 150); c.quadraticCurveTo(300, 260, 330, 620); c.fill(); // 肩
        c.beginPath(); c.moveTo(-14, -40); c.quadraticCurveTo(-40, 6, -8, 52); c.lineTo(60, 60); c.lineTo(60, -50); c.fill(); // 顔当て
        c.strokeStyle = rgba(COL.amber, 0.28); c.lineWidth = 2;                                    // 霞の残照のリム
        c.beginPath(); c.ellipse(78, -18, 104, 96, 0, Math.PI * 1.05, Math.PI * 1.75); c.stroke();

          c.beginPath(); c.moveTo(14, -66); c.quadraticCurveTo(-34, -8, -2, 50); c.lineTo(36, 46); c.quadraticCurveTo(14, -6, 52, -64); c.closePath();
          c.fillStyle = rgba(COL.cyan, 0.2, 0.55); c.fill();

          c.strokeStyle = rgba(COL.hot, 0.45); c.lineWidth = 1.5;

          g.addColorStop(0, rgba(COL.air, 0.5 * W)); g.addColorStop(0.5, rgba(COL.air, W)); g.addColorStop(1, rgba(COL.air, 0.4 * W));

          }
          c.lineTo(1980, 1140); c.closePath();
          c.fillStyle = "#0E0D0C"; c.fill();

      // ---- 砂粒(スロー=閉形式、加速=ghost 8 枚のパス) ----

            let f = 0;

              if (If > 0) { const d = Math.hypot(x - mx, y - BY); if (d < 330) f = Math.max(f, If * Math.pow(1 - d / 330, 1.3)); }
              if (Ex > 0) { const d = Math.hypot(x - CX, y - CY); if (d < 460) f = Math.max(f, Ex * Math.pow(1 - d / 460, 1.4)); }

            const colr = f > 0 ? mixc(mixc(COL.amber, COL.cyan, clamp(f * 1.6)), COL.hot, clamp((f - 0.6) * 1.5)) : COL.amber;
            const a = g.a * tw * (1 + 1.4 * f) * (kind === "near" ? 1 : WL * Math.max(entry(L), clamp(f * 1.5)));
            const len = Math.hypot(P[K - 1][0] - x, P[K - 1][1] - y);
            if (kind === "near") {
              const r = g.sz;
              if (len < 2) { const rg = ctx.createRadialGradient(x, y, 0, x, y, r); rg.addColorStop(0, rgba(COL.amber, a * W)); rg.addColorStop(1, rgba(COL.amber, 0)); ctx.fillStyle = rg; ctx.fillRect(x - r, y - r, 2 * r, 2 * r); }

      }

      // ---- 銃口(架空の形)と閃光(色収差つき) ----
      function drawMuzzle(t) {
        const L = t * 30, mx = 180 - camAt(t), [sx, sy] = shake(t), If = L < 5.5 ? [1, 0.82, 0.6, 0.4, 0.22, 0.1][Math.round(L)] : 0;

        ctx.fillStyle = "rgb(22,20,19)";
        ctx.fillRect(mx - 760, BY - 14, 720, 28);                                                  // 銃身
        ctx.beginPath(); ctx.moveTo(mx - 760, BY + 14); ctx.lineTo(mx - 250, BY + 14); ctx.lineTo(mx - 290, BY + 62); ctx.lineTo(mx - 760, BY + 62); ctx.fill(); // 下部
        ctx.fillRect(mx - 48, BY - 22, 48, 44);                                                    // 先端の環
        ctx.fillStyle = "#0E0D0C"; for (let k = 0; k < 3; k++) ctx.fillRect(mx - 42 + k * 13, BY - 22, 5, 9);
        const lit = (a) => { ctx.strokeStyle = rgba(COL.cyan, a); ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(mx - 760, BY - 14); ctx.lineTo(mx - 48, BY - 14); ctx.lineTo(mx - 48, BY - 22); ctx.lineTo(mx, BY - 22); ctx.lineTo(mx, BY + 22); ctx.stroke(); };
        lit(0.15 + 0.8 * If);
        ctx.strokeStyle = rgba(COL.amber, 0.22); ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(mx - 760, BY + 62.5); ctx.lineTo(mx - 290, BY + 62.5); ctx.stroke();
        ctx.restore();
        if (If <= 0) return;
        // 閃光をオフスクリーンへ(核 #E6FFFB / 外縁 #3FE0D0、半径260)
        fl.setTransform(1, 0, 0, 1, 0, 0); fl.globalCompositeOperation = "source-over"; fl.fillStyle = "#000"; fl.fillRect(0, 0, 1920, 1080);
        fl.translate(sx, sy); fl.globalCompositeOperation = "lighter";
        const R = mulberry32(SEED + 50 + Math.round(L)), fx = mx + 10;
        let g = fl.createRadialGradient(fx, BY, 0, fx, BY, 260);
        g.addColorStop(0, rgba(COL.cyan, 0.9 * If)); g.addColorStop(0.35, rgba(COL.cyan, 0.38 * If)); g.addColorStop(1, rgba(COL.cyan, 0));
        fl.fillStyle = g; fl.fillRect(fx - 260, BY - 260, 520, 520);
        const plume = (x, y, sxx, syy, r, c, a) => { fl.save(); fl.translate(x, y); fl.scale(sxx, syy); const q = fl.createRadialGradient(0, 0, 0, 0, 0, r); q.addColorStop(0, rgba(c, a)); q.addColorStop(1, rgba(c, 0)); fl.fillStyle = q; fl.fillRect(-r, -r, 2 * r, 2 * r); fl.restore(); };
        plume(fx + 95, BY, 2.4 + R() * 0.6, 0.5, 105, COL.hot, 0.85 * If);                        // 前方の炎
        plume(fx + 40, BY, 1.4, 0.8, 80, COL.cyan, 0.7 * If);
        for (let k = 0; k < 3; k++) { plume(mx - 36 + k * 13, BY - 40 - R() * 20, 0.45, 1.9, 42, COL.cyan, 0.55 * If); plume(mx - 36 + k * 13, BY + 40 + R() * 20, 0.45, 1.9, 42, COL.cyan, 0.4 * If); } // 環の噴き出し
        fl.globalCompositeOperation = "source-over";
        g = fl.createRadialGradient(fx + 8, BY, 0, fx + 8, BY, 72);
        g.addColorStop(0, rgba(COL.hot, 0.9 * If)); g.addColorStop(0.5, rgba(COL.hot, 0.68 * If)); g.addColorStop(1, rgba(COL.hot, 0));
        fl.fillStyle = g; fl.fillRect(fx - 64, BY - 72, 144, 144);
        fl.globalCompositeOperation = "lighter"; fl.lineCap = "round";
        for (let k = 0; k < 7; k++) {                                                              // 光条
          const th = (k / 7) * 6.283 + R() * 0.5, len = (120 + R() * 160) * If;
          fl.strokeStyle = rgba(COL.hot, 0.5 * If); fl.lineWidth = 2 + R() * 2;
          fl.beginPath(); fl.moveTo(fx + Math.cos(th) * 40, BY + Math.sin(th) * 32); fl.lineTo(fx + Math.cos(th) * len * (Math.cos(th) > 0 ? 1.5 : 1), BY + Math.sin(th) * len * 0.8); fl.stroke();
        }
        // 色収差: R/G/B で倍率が違う(画面中心から k=0.01)。閃光レイヤーだけ
        ctx.save(); ctx.globalCompositeOperation = "lighter";
        [["#f00", 1.01], ["#0f0", 1], ["#00f", 0.99]].forEach(([cc, m]) => {
          ch.setTransform(1, 0, 0, 1, 0, 0); ch.globalCompositeOperation = "source-over"; ch.drawImage(flC, 0, 0);
          ch.globalCompositeOperation = "multiply"; ch.fillStyle = cc; ch.fillRect(0, 0, 1920, 1080);
          ctx.setTransform(m, 0, 0, m, 960 * (1 - m), 540 * (1 - m)); ctx.drawImage(chC, 0, 0);
        });
        ctx.restore();
        ctx.save(); ctx.translate(sx, sy);                                                         // 核は加算せず #E6FFFB に揃える
        g = ctx.createRadialGradient(mx, BY, 0, mx, BY, 46); g.addColorStop(0, rgba(COL.hot, 0.93 * If)); g.addColorStop(0.45, rgba(COL.hot, 0.7 * If)); g.addColorStop(1, rgba(COL.hot, 0));
        ctx.fillStyle = g; ctx.fillRect(mx - 46, BY - 46, 92, 92); ctx.restore();
      }

      // ---- 弾丸と曳光 ----
      function drawBullet(t) {
        const L = t * 30; if (L > 101.5) return;
        const bx = bxAt(L), s = S(t), [sx, sy] = shake(t), base = bx - 36, y = BY;
        const fk = (0.9 + 0.1 * Math.sin(s * 160) + 0.05 * VN(s * 60)) * (L < 5.5 ? 0.35 + 0.65 * smooth(L / 5) : 1); // 閃光の中では控えめ                              // 曳光の揺らぎ(素材時間)
        ctx.save(); ctx.translate(sx, sy);
        glow(ctx, base + 4, y, 200, "63,224,208", 0.07 * fk); glow(ctx, base, y, 90, "63,224,208", 0.2 * fk);
        ctx.globalCompositeOperation = "lighter"; ctx.filter = "blur(7px)";
        const tail = (h0, h1, fill) => { ctx.fillStyle = fill; ctx.beginPath(); ctx.moveTo(base + 2, y - h0); ctx.lineTo(base - 300, y - h1); ctx.lineTo(base - 300, y + h1); ctx.lineTo(base + 2, y + h0); ctx.closePath(); ctx.fill(); };
        let g = ctx.createLinearGradient(base, 0, base - 300, 0);
        g.addColorStop(0, rgba(COL.cyan, 0.55 * fk)); g.addColorStop(0.4, rgba(COL.cyan, 0.2 * fk)); g.addColorStop(1, rgba(COL.cyan, 0));
        tail(11, 3, g); ctx.filter = "none";
        g = ctx.createLinearGradient(base, 0, base - 300, 0);
        g.addColorStop(0, rgba(COL.hot, 0.95 * Math.min(1, fk * 1.1))); g.addColorStop(0.12, rgba(COL.cyan, 0.9 * fk)); g.addColorStop(0.5, rgba(COL.cyan, 0.35 * fk)); g.addColorStop(1, rgba(COL.cyan, 0));
        tail(3.3, 0.5, g);
        ctx.globalCompositeOperation = "source-over";
        ctx.beginPath(); ctx.moveTo(base, y - 4.6); ctx.lineTo(bx - 15, y - 4.6); ctx.quadraticCurveTo(bx - 4, y - 4.2, bx, y); ctx.quadraticCurveTo(bx - 4, y + 4.2, bx - 15, y + 4.6); ctx.lineTo(base, y + 4.6); ctx.closePath();
        g = ctx.createLinearGradient(0, y - 5, 0, y + 5); g.addColorStop(0, "rgb(70,65,60)"); g.addColorStop(0.45, "rgb(32,30,27)"); g.addColorStop(1, "rgb(14,13,12)");
        ctx.fillStyle = g; ctx.fill();
        ctx.save(); ctx.clip(); ctx.strokeStyle = "rgba(14,13,12,0.75)"; ctx.lineWidth = 1.2;        // 旋条痕(回転は素材時間)
        for (let j = 0; j < 3; j++) { const px = base + 3 + mod(j * 7 + s * 375, 21); ctx.beginPath(); ctx.moveTo(px, y - 5); ctx.lineTo(px + 3, y + 5); ctx.stroke(); }
        ctx.restore();
        ctx.strokeStyle = rgba(COL.amber, 0.5); ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(base + 1, y - 4.6); ctx.lineTo(bx - 15, y - 4.6); ctx.quadraticCurveTo(bx - 4, y - 4.2, bx, y); ctx.stroke();
        ctx.strokeStyle = rgba(COL.cyan, 0.6); ctx.beginPath(); ctx.moveTo(base + 1, y + 4.6); ctx.lineTo(bx - 15, y + 4.6); ctx.stroke();
        ctx.globalCompositeOperation = "lighter"; ctx.fillStyle = rgba(COL.hot, 0.9);
        ctx.beginPath(); ctx.ellipse(base, y, 2, 4.2, 0, 0, 6.283); ctx.fill();
        const slow = clamp((0.5 - rateAt(t)) / 0.46);                                               // 衝撃円錐の空気の稜線(スロー時だけ)
        if (slow > 0) { ctx.strokeStyle = rgba(COL.bone, 0.06 * slow); ctx.lineWidth = 1;
          for (const sg of [-1, 1]) { const q = ctx.createLinearGradient(bx, 0, bx - 150, 0); q.addColorStop(0, rgba(COL.bone, 0.09 * slow)); q.addColorStop(1, rgba(COL.bone, 0)); ctx.strokeStyle = q; ctx.beginPath(); ctx.moveTo(bx + 1, y); ctx.lineTo(bx - 150, y + sg * 150 * TAN30); ctx.stroke(); } }
        ctx.restore();
      }

      // ---- 炸裂(L105〜): CYAN の放射・防護ガラス片40・砂の衝撃輪・残り火 ----
      function drawImpact(t) {
        const L = t * 30; if (L < 104.5) return;
        const tau = t - 104 / 30, [sx, sy] = shake(t), W = worldLight(L), Ex = Math.exp(-(tau - 0.033) / 0.11);
        ctx.save(); ctx.translate(sx, sy); ctx.lineCap = "round";
        glow(ctx, CX, CY, 520, "63,224,208", 0.42 * Ex); glow(ctx, CX, CY, 210, "63,224,208", 0.6 * Ex);
        glow(ctx, CX, CY, 70, "230,255,251", 0.85 * Ex * Ex);
        const R = (q) => 820 * (1 - Math.exp(-q / 0.16)), ra = (1 - smooth(tau / 0.6)) * W;           // 砂の衝撃輪
        if (ra > 0.002) {
          for (const g of RING) {
            const r1 = R(tau) * (1 + g.j), r0 = R(Math.max(0, tau - 1 / 60)) * (1 + g.j), c = Math.cos(g.th), s = Math.sin(g.th) * 0.92;
            const f = Ex * Math.max(0, 1 - r1 / 460), col = mixc(COL.amber, COL.cyan, clamp(f * 1.5));
            ctx.strokeStyle = rgba(col, g.a * ra * (0.7 + f)); ctx.lineWidth = g.sz;
            ctx.beginPath(); ctx.moveTo(CX + c * r0, CY + s * r0); ctx.lineTo(CX + c * r1, CY + s * r1); ctx.stroke();
          }
          ctx.strokeStyle = rgba(COL.bone, 0.07 * ra); ctx.lineWidth = 3; ctx.beginPath(); ctx.ellipse(CX, CY, R(tau), R(tau) * 0.92, 0, 0, 6.283); ctx.stroke();
        }
        const sa = 1 - smooth((L - 111) / 12);                                                     // 防護ガラス片(弾道式+線形抵抗)
        if (sa > 0.002) {
          ctx.globalCompositeOperation = "lighter";
          const pos = (h, q) => { const e = (1 - Math.exp(-h.k * q)) / h.k, gk = 1500 / h.k; return [CX + h.vx * e, CY + gk * q + (h.vy - gk) * e]; };
          for (const h of SHARDS) {
            const [x, y] = pos(h, tau), [px, py] = pos(h, Math.max(0, tau - 0.03)), rot = h.ph + h.w * tau;
            ctx.strokeStyle = rgba(COL.cyan, 0.28 * sa); ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(px, py); ctx.lineTo(x, y); ctx.stroke();
            ctx.beginPath(); h.pts.forEach(([an, rr], k) => { const X = x + Math.cos(an + rot) * rr * h.sz, Y = y + Math.sin(an + rot) * rr * h.sz * 0.7; k ? ctx.lineTo(X, Y) : ctx.moveTo(X, Y); }); ctx.closePath();
            ctx.fillStyle = rgba(COL.cyan, 0.32 * sa); ctx.fill();
            ctx.strokeStyle = rgba(COL.hot, (0.25 + 0.6 * Math.max(0, Math.sin(rot * 2 + h.ph))) * sa); ctx.lineWidth = 1; ctx.stroke();
          }
        }
        ctx.globalCompositeOperation = "source-over";
        for (const e of EMBERS) {                                                                  // 残り火(終わりは ≦0.15、半径120以内)
          const a = (0.13 + 0.55 * (1 - smooth((L - 108) / 23))) * (0.88 + 0.12 * Math.sin(e.f * tau + e.ph));
          const x = CX + Math.cos(e.th) * (e.r + 12 * tau), y = CY + Math.sin(e.th) * (e.r + 12 * tau) - 10 * tau;
          ctx.fillStyle = rgba(COL.cyan, a * 0.25); ctx.beginPath(); ctx.arc(x, y, e.sz * 2.4, 0, 6.283); ctx.fill();
          ctx.fillStyle = rgba(COL.cyan, Math.min(0.1, a * 0.8)); ctx.beginPath(); ctx.arc(x, y, e.sz, 0, 6.283); ctx.fill();
        }
        ctx.restore();
      }

      // ---- フラッシュカット L102–104: バイザーの超クローズアップ(CYAN の曲面に黒いひび) ----
      const CRACK = (() => { const r = mulberry32(SEED + 900), rays = [];
        for (let i = 0; i < 15; i++) { const th0 = (i / 15) * 6.283 + (r() - 0.5) * 0.35, len = 500 + r() * 1100, pts = [[0, 0]]; let th = th0, d = 0;
          while (d < len) { d += 30 + r() * 60; th += (r() - 0.5) * 0.35; pts.push([Math.cos(th) * d, Math.sin(th) * d]); }
          const br = r() < 0.6 ? { at: 0.3 + r() * 0.4, th: th0 + (r() < 0.5 ? -1 : 1) * (0.4 + r() * 0.5), len: 120 + r() * 300 } : null;
          rays.push({ pts, len, w: 3 + r() * 4, br }); }
        const rings = [70, 150, 270, 430].map((rad) => Array.from({ length: 15 }, () => [rad * (0.85 + r() * 0.3), r() < 0.8]));
        return { rays, rings }; })();
      function drawInsert(L) {
        const k = Math.round(L) - 102, p = [0.32, 0.68, 1][k], z = 1 + 0.03 * k, P = [860, 560];
        ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalCompositeOperation = "source-over"; ctx.globalAlpha = 1; ctx.filter = "none";
        ctx.fillStyle = "#0E0D0C"; ctx.fillRect(0, 0, 1920, 1080);
        ctx.translate(P[0], P[1]); ctx.scale(z, z); ctx.translate(-P[0], -P[1]);
        let g = ctx.createRadialGradient(1150, -380, 0, 1150, -380, 2200);                       // 曲面
        g.addColorStop(0, "rgb(150,238,230)"); g.addColorStop(0.33, "#3FE0D0"); g.addColorStop(0.68, "rgb(30,112,104)"); g.addColorStop(1, "rgb(10,42,39)");
        ctx.fillStyle = g; ctx.fillRect(-100, -100, 2120, 1280);
        ctx.save(); ctx.filter = "blur(10px)"; ctx.strokeStyle = rgba(COL.hot, 0.35); ctx.lineWidth = 26;   // 曲面の反射帯
        ctx.beginPath(); ctx.ellipse(1150, -380, 1050, 900, 0, Math.PI * 0.55, Math.PI * 0.95); ctx.stroke();
        ctx.lineWidth = 8; ctx.strokeStyle = rgba(COL.hot, 0.22); ctx.beginPath(); ctx.ellipse(1150, -380, 1380, 1180, 0, Math.PI * 0.6, Math.PI * 0.9); ctx.stroke();
        ctx.restore();
        ctx.fillStyle = "#0E0D0C"; ctx.beginPath(); ctx.ellipse(2150, 1350, 900, 560, -0.35, 0, 6.283); ctx.fill();   // バイザーの縁
        ctx.strokeStyle = rgba(COL.cyan, 0.9); ctx.lineWidth = 3; ctx.stroke();
        ctx.lineCap = "round"; ctx.lineJoin = "round";
        const ray = (pts, maxD, w) => { ctx.beginPath(); ctx.moveTo(P[0], P[1]); let d = 0;
          for (let i = 1; i < pts.length; i++) { const seg = Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]);
            if (d + seg > maxD) { const f = (maxD - d) / seg; ctx.lineTo(P[0] + lerp(pts[i - 1][0], pts[i][0], f), P[1] + lerp(pts[i - 1][1], pts[i][1], f)); break; }
            d += seg; ctx.lineTo(P[0] + pts[i][0], P[1] + pts[i][1]); } ctx.lineWidth = w; ctx.stroke(); };
        for (const pass of [0, 1]) {                                                               // 0=屈折のハイライト, 1=黒いひび
          ctx.save(); if (!pass) ctx.translate(2, 2);
          ctx.strokeStyle = pass ? "#0E0D0C" : rgba(COL.hot, 0.5);
          for (const r of CRACK.rays) {
            ray(r.pts, r.len * p, pass ? r.w : 1.4);
            if (r.br && p > r.br.at) { const b0 = r.pts[Math.floor(r.pts.length * r.br.at)], bl = r.br.len * clamp((p - r.br.at) / 0.4);
              ctx.beginPath(); ctx.moveTo(P[0] + b0[0], P[1] + b0[1]); ctx.lineTo(P[0] + b0[0] + Math.cos(r.br.th) * bl, P[1] + b0[1] + Math.sin(r.br.th) * bl); ctx.lineWidth = pass ? r.w * 0.6 : 1; ctx.stroke(); }
          }
          CRACK.rings.forEach((ring, ri) => { if (p < 0.3 + ri * 0.2) return; ctx.lineWidth = pass ? 2.5 : 1;
            for (let i = 0; i < 15; i++) { if (!ring[i][1]) continue; const a0 = CRACK.rays[i], a1 = CRACK.rays[(i + 1) % 15];
              const an0 = Math.atan2(a0.pts[1][1], a0.pts[1][0]), an1 = Math.atan2(a1.pts[1][1], a1.pts[1][0]);
              ctx.beginPath(); ctx.moveTo(P[0] + Math.cos(an0) * ring[i][0], P[1] + Math.sin(an0) * ring[i][0]); ctx.lineTo(P[0] + Math.cos(an1) * ring[(i + 1) % 15][0], P[1] + Math.sin(an1) * ring[(i + 1) % 15][0]); ctx.stroke(); } });
          ctx.restore();
        }
        g = ctx.createRadialGradient(P[0], P[1], 0, P[0], P[1], 60);                               // 着弾点
        g.addColorStop(0, "#0E0D0C"); g.addColorStop(0.3, "#0E0D0C"); g.addColorStop(0.45, rgba(COL.hot, 0.9)); g.addColorStop(1, rgba(COL.cyan, 0));
        ctx.fillStyle = g; ctx.beginPath(); ctx.arc(P[0], P[1], 60, 0, 6.283); ctx.fill();
        ctx.setTransform(1, 0, 0, 1, 0, 0);
      }

      function draw(t) {
        const L = t * 30;
        ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalCompositeOperation = "source-over"; ctx.globalAlpha = 1; ctx.filter = "none";
        if (L >= 101.5 && L < 104.5) { drawInsert(L); return; }
        const blur = L >= 77.5 && L <= 101.5;
        if (blur) {                                                                                 // ghost 8 枚の平均(露光 216°)
          const K = 8, SH = 0.6 / 30;
          for (let k = 0; k < K; k++) { drawBackdrop(tmp, t - SH * k / (K - 1)); acc.globalAlpha = 1 / (k + 1); acc.drawImage(tmpC, 0, 0); }
          acc.globalAlpha = 1; ctx.drawImage(accC, 0, 0);
        } else drawBackdrop(ctx, t);
        ctx.setTransform(1, 0, 0, 1, 0, 0);
        const near = drawSand(t, blur);
        if (L < 30) drawMuzzle(t);
        ctx.setTransform(1, 0, 0, 1, 0, 0);
        drawBullet(t);
        drawImpact(t);
        if (near) near();
        ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalCompositeOperation = "source-over"; ctx.filter = "none";
      }
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true }), st = { t: 0 };
      tl.to(st, { t: DUR, duration: DUR, ease: "none", onUpdate: () => draw(st.t) }, 0);
      draw(0); window.__timelines["main"] = tl;
    </script>
  </body>
