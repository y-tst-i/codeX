<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="assets/gsap.min.js"></script>
    <script type="importmap">
      { "imports": { "three": "./assets/three/three.module.min.js", "three/addons/": "./assets/three/addons/" } }
    </script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #0E0D0C; }
      #root { position: relative; width: 1920px; height: 1080px; background: #0E0D0C; overflow: hidden; }
      #gl { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; display: block; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="4.4" data-width="1920" data-height="1080">
      <canvas id="gl" data-layout-allow-overflow></canvas>
    </div>
    <script>
      // DOM 用の gsap timeline(3D の描画はここでしない)。長さを DUR に固定するだけ。
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      tl.set({}, {}, 4.4);
      window.__timelines["main"] = tl;
    </script>
    <script type="module">
      // ===== s4_shot_3d「一発が、砂を割る」three.js 版 =====
      // 座標: 弾道面 z=0 で 1単位=100px。カメラは z=D・水平・正面(回転なし)で弾と並走(x だけ動く)。画面 (px,py) ↔ 世界 x=camX+(px-960)/100, y=(540-py)/100。
      import * as THREE from "three";
      import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";
      import { RectAreaLightUniformsLib } from "three/addons/lights/RectAreaLightUniformsLib.js";
      import { FullScreenQuad } from "three/addons/postprocessing/Pass.js";
      import { ShaderPass } from "three/addons/postprocessing/ShaderPass.js";
      import { makePost } from "./assets/post.js";

      const DUR = 4.4, W = 1920, H = 1080, FPS = 30;
      const mulberry32 = (a) => () => { a |= 0; a = (a + 0x6d2b79f5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
      const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x)), lerp = (a, b, k) => a + (b - a) * k;
      const sm = (x) => { x = clamp(x); return x * x * (3 - 2 * x); };
      const mod = (a, p) => ((a % p) + p) % p;
      const SEED = 404, VB = 4500, D = 28, TAN30 = Math.tan(Math.PI / 6);
      const s2l = (c) => (c <= 0.04045 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4));
      const LIN = (hex) => { const c = new THREE.Color(hex); return [c.r, c.g, c.b]; }; // three の Color は線形で持つ
      const C = { carbon: LIN("#0E0D0C"), air: LIN("#120F0C"), bone: LIN("#EDE4D3"), amber: LIN("#D9822B"), flare: LIN("#FFD9A0"), cyan: LIN("#3FE0D0"), hot: LIN("#E6FFFB") };
      // 2D 版の「炭の上に不透明度 a で重ねた色」を、加算する線形の量に換算(残り火の ≦0.15 を守るため)
      const alphaLin = (a, hex) => { const c = new THREE.Color(hex), k = new THREE.Color("#0E0D0C"); c.convertLinearToSRGB(); k.convertLinearToSRGB();
        return [0, 1, 2].map((i) => s2l(lerp([k.r, k.g, k.b][i], [c.r, c.g, c.b][i], a)) - s2l([k.r, k.g, k.b][i])); };

      // ---- 値ノイズ(seed 付き) ----
      const VN = (() => { const r = mulberry32(SEED + 7), T = new Float32Array(1024); for (let i = 0; i < 1024; i++) T[i] = r() * 2 - 1;
        return (x) => { const i = Math.floor(x), f = x - i, u = f * f * (3 - 2 * f); return lerp(T[i & 1023], T[(i + 1) & 1023], u); }; })();

      // ---- 時間: 率 r(フレーム)→ 素材時間 s(t)(SCENE_LIB.timeRemap と同じ式: tab[f]=tab[f-1]+r(f-1)/fps)----
      const RATE = (f) => f <= 5 ? 1 : f <= 17 ? 0.04 + 0.96 * Math.pow(1 - (f - 5) / 12, 2)        // L6–17 power2.out
        : f <= 77 ? 0.04 : f <= 101 ? 0.04 + 3.96 * Math.pow(2, 10 * ((f - 77) / 24) - 10) : 1;     // L78–101 expo.in
      const TAB = new Float64Array(134); for (let f = 1; f < 134; f++) TAB[f] = TAB[f - 1] + RATE(f - 1) / FPS;
      const S = (t) => { const x = clamp(t * FPS, 0, 133), i = Math.floor(x), j = Math.min(133, i + 1); return lerp(TAB[i], TAB[j], x - i); };
      const rateAt = (t) => RATE(Math.max(0, Math.min(131, Math.floor(t * FPS + 1e-6))));

      // 弾の画面 x(場面カードの表)。カメラ = 弾の世界 x − 画面 x(並走トラック)
      function bxAt(L) {
        if (L <= 5) { const u = clamp(L / 5); return 210 + 410 * (1 - (1 - u) * (1 - u)); }
        if (L <= 17) return 620 + 80 * (L - 5) / 12;
        if (L <= 77) return 700 + 300 * (L - 17) / 60;
        const u = clamp((L - 77) / 24); return 1000 + 180 * (0.6 * u + 0.4 * u * u);
      }
      const camPx = (t) => { const Lc = Math.min(t * FPS, 101); return VB * S(Lc / FPS) + 210 - bxAt(Lc); };
      const camXc = (t) => (camPx(t) + 960) / 100;                                    // 揺れなしのカメラ x
      const bulletX = (t) => camXc(t) + (bxAt(Math.min(t * FPS, 101)) - 960) / 100;  // 弾の先端
      const worldLight = (L) => (L < 114 ? 1 : 1 - sm((L - 114) / 14));
      const entry = (L) => (L < 12 ? lerp(0.45, 1, sm(L / 12)) : 1);
      const IFL = (L) => (L < 5.5 ? [1, 0.82, 0.6, 0.4, 0.22, 0.1][Math.max(0, Math.round(L))] : 0); // 閃光 6f
      function shake(t) {                                                              // px(画面)。ローパスした sin の和+値ノイズ
        const L = t * FPS; let A = 9 * Math.exp(-L / 2.5);
        if (L > 77 && L <= 101.5) A += 4 * Math.pow((L - 77) / 24, 2);
        if (L >= 104.5) A += 18 * Math.exp(-(L - 104.5) / 5);
        const x = 0.5 * Math.sin(t * 41.3 + 0.7) + 0.3 * Math.sin(t * 67.9 + 2.1) + 0.6 * VN(t * 14);
        const y = 0.5 * Math.sin(t * 37.1 + 1.9) + 0.3 * Math.sin(t * 71.3 + 0.4) + 0.6 * VN(t * 13 + 300);
        return [A * x, A * y];
      }
      const CAM_END = camXc(101 / FPS), IMP = new THREE.Vector3(CAM_END + 5.2, 0.2, 0);  // 命中点 (1480,520)
      const MUZ = 1.8;                                                                    // 銃口 (180,540)

      // ---- レンダラ ----
      const canvas = document.getElementById("gl");
      const renderer = new THREE.WebGLRenderer({ canvas, antialias: false, powerPreference: "high-performance", preserveDrawingBuffer: true });
      renderer.setPixelRatio(1);
      renderer.toneMapping = THREE.NoToneMapping;   // 暗部を潰す Neutral の代わりに、自前のニー(線形域)で高輝度だけ丸める
      RectAreaLightUniformsLib.init();
      const scene = new THREE.Scene();
      scene.background = new THREE.Color("#0E0D0C");
      const camera = new THREE.PerspectiveCamera((2 * Math.atan(5.4 / D) * 180) / Math.PI, W / H, 0.5, 400);
      const pmrem = new THREE.PMREMGenerator(renderer);
      const envTex = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
      scene.environment = envTex; scene.environmentIntensity = 0.12;

      const post = makePost(renderer, scene, camera, W, H, { quality: "fast" });   // DoF32 + Bloom + 色補正(GTAO なし)
      renderer.setSize(post.W, post.H, false);
      post.bloom.strength = 0.32; post.bloom.radius = 0.55; post.bloom.threshold = 1.6;
      post.vig.uniforms.amt.value = 0;          // ビネットは s5 専売 → 0
      post.vig.uniforms.contrast.value = 0.1; post.vig.uniforms.sat.value = 1.05; post.vig.uniforms.warm.value = 0;
      // 自前の線形パス: 閃光の縁だけの色収差(k=0.01、画面端ほど強い)→ 高輝度のニー → 炭より暗くしない(#000 禁止)
      const finish = new ShaderPass({
        uniforms: { tDiffuse: { value: null }, ca: { value: 0 }, floorC: { value: new THREE.Vector3(...C.carbon) } },
        vertexShader: `varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.); }`,
        fragmentShader: `varying vec2 vUv; uniform sampler2D tDiffuse; uniform float ca; uniform vec3 floorC;
          float lum(vec3 c){ return dot(c, vec3(.2126,.7152,.0722)); }
          vec3 knee(vec3 c){ const float k = .72; vec3 e = k + (1.-k)*(1.-exp(-(c-k)/(1.-k))); return mix(c, e, step(vec3(k), c)); }
          void main(){
            vec3 c = texture2D(tDiffuse, vUv).rgb;
            if (ca > 0.) { vec2 d = vUv - .5;
              vec3 cr = texture2D(tDiffuse, .5 + d*(1. + .01*ca)).rgb, cb = texture2D(tDiffuse, .5 + d*(1. - .01*ca)).rgb;
              float br = smoothstep(.12, .9, max(lum(c), max(lum(cr), lum(cb))));
              c.r = mix(c.r, cr.r, br); c.b = mix(c.b, cb.b, br); }
            c = min(max(knee(c), floorC), vec3(.7913, 1., .9647));   // 最も明るい所でも #E6FFFB(白熱)止まり。純白を作らない
            gl_FragColor = vec4(c, 1.); }`,
      });
      post.composer.insertPass(finish, post.composer.passes.indexOf(post.out));
      // モーションブラー用の蓄積(線形ではなく出力値で平均。加速区間だけ)
      const accRT = new THREE.WebGLRenderTarget(W, H, { type: THREE.HalfFloatType });
      const fsV = `varying vec2 vUv; void main(){ vUv = uv; gl_Position = vec4(position.xy, 0., 1.); }`;
      const accQ = new FullScreenQuad(new THREE.ShaderMaterial({ uniforms: { tex: { value: null }, w: { value: 1 } }, vertexShader: fsV,
        fragmentShader: `varying vec2 vUv; uniform sampler2D tex; uniform float w; void main(){ gl_FragColor = vec4(texture2D(tex, vUv).rgb * w, 1.); }`,
        blending: THREE.AdditiveBlending, transparent: true, depthTest: false, depthWrite: false, toneMapped: false }));
      const cpyQ = new FullScreenQuad(new THREE.ShaderMaterial({ uniforms: { tex: { value: accRT.texture } }, vertexShader: fsV,
        fragmentShader: `varying vec2 vUv; uniform sampler2D tex; void main(){ gl_FragColor = vec4(texture2D(tex, vUv).rgb, 1.); }`, depthTest: false, depthWrite: false, toneMapped: false }));

      // ---- 共通: 光のにじみ用の板(加算、カメラは回転しないので xy 平面の板が常に正面)----
      const glowGeo = new THREE.PlaneGeometry(2, 2);
      function makeGlow(hex, power = 2, order = 10) {
        const m = new THREE.Mesh(glowGeo, new THREE.ShaderMaterial({
          uniforms: { col: { value: new THREE.Vector3(...LIN(hex)) }, k: { value: 0 }, p: { value: power } },
          vertexShader: `varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.); }`,
          fragmentShader: `varying vec2 vUv; uniform vec3 col; uniform float k, p; void main(){ float r = length(vUv - .5) * 2.; float a = pow(max(0., 1. - r), p); gl_FragColor = vec4(col * k * a, 1.); }`,
          blending: THREE.AdditiveBlending, transparent: true, depthWrite: false, depthTest: false, toneMapped: false }));
        m.renderOrder = order; m.frustumCulled = false; scene.add(m); return m;
      }
      const setGlow = (g, x, y, z, rx, ry, k, rot = 0) => { g.visible = k > 1e-4; g.position.set(x, y, z); g.scale.set(rx, ry, 1); g.rotation.z = rot; g.material.uniforms.k.value = k; };

      // =================== build ===================
      const Sx = {};
      const rnd = mulberry32(SEED);
      // 粒の配列(位置は x0+v·s の閉形式。x はカメラの周りで巻き戻す=見えない所でだけ入れ替わる)
      const NCORE = 1500, NFIELD = 2600, NNEAR = 40, NRING = 320, NG = NCORE + NFIELD + NNEAR, NALL = NG + NRING;
      const G = { x0: new Float32Array(NG), y0: new Float32Array(NG), z0: new Float32Array(NG), vx: new Float32Array(NG), vy: new Float32Array(NG), vz: new Float32Array(NG),
        r: new Float32Array(NG), wa: new Float32Array(NG), ww: new Float32Array(NG), ph: new Float32Array(NG), wd: new Float32Array(NG), side: new Float32Array(NG),
        ax: new Float32Array(NG * 3), sp: new Float32Array(NG), br: new Float32Array(NG) };
      const RG = { th: new Float32Array(NRING), j: new Float32Array(NRING), r: new Float32Array(NRING), a: new Float32Array(NRING), zj: new Float32Array(NRING) };
      const SHARDS = [], EMB = [];

      function build() {
        // --- 粒 ---
        for (let i = 0; i < NG; i++) {
          let z, y;
          if (i < NCORE) { y = ((rnd() + rnd() + rnd()) / 3 - 0.5) * 4.2; z = ((rnd() + rnd() + rnd()) / 3 - 0.5) * 5.5; }   // 弾道のまわりの帯
          else if (i < NCORE + NFIELD) { z = -16 + rnd() * 24; y = (rnd() * 2 - 1) * 5.6 * (D - z) / D; }                   // 奥行きのある空間
          else { z = 11 + rnd() * 6; y = (rnd() * 2 - 1) * 5.6 * (D - z) / D; }                                             // 手前のボケ玉
          const wd = 2 * (9.6 * (D - z) / D + 1.2);
          G.x0[i] = rnd() * wd; G.y0[i] = y; G.z0[i] = z; G.wd[i] = wd;
          G.vx[i] = (rnd() - 0.5) * 0.6; G.vy[i] = (rnd() - 0.5) * 0.36; G.vz[i] = (rnd() - 0.5) * 0.4;
          const crystal = rnd() < 0.08;
          G.r[i] = i >= NCORE + NFIELD ? 0.03 + rnd() * 0.035 : crystal ? 0.022 + rnd() * 0.016 : 0.0075 + Math.pow(rnd(), 2) * 0.014;
          G.wa[i] = 0.02 + rnd() * 0.04; G.ww[i] = 2 + rnd() * 5; G.ph[i] = rnd() * 6.283; G.side[i] = i % 2 ? 1 : -1;
          const a = new THREE.Vector3(rnd() - 0.5, rnd() - 0.5, rnd() - 0.5).normalize(); G.ax.set([a.x, a.y, a.z], i * 3);
          G.sp[i] = (rnd() < 0.5 ? -1 : 1) * (6 + rnd() * 22);   // 素材時間あたりの自転(結晶の面がきらめく)
          G.br[i] = i >= NCORE + NFIELD ? 0.35 + rnd() * 0.3 : 0.55 + rnd() * 0.45;
        }
        for (let i = 0; i < NRING; i++) { RG.th[i] = rnd() * 6.283; RG.j[i] = (rnd() - 0.5) * 0.14; RG.r[i] = 0.007 + rnd() * 0.01; RG.a[i] = 0.4 + rnd() * 0.5; RG.zj[i] = (rnd() - 0.5) * 0.6; }
        const gGeo = new THREE.IcosahedronGeometry(1, 0);
        const gMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.32, metalness: 0.0, flatShading: true });
        Sx.grains = new THREE.InstancedMesh(gGeo, gMat, NALL); Sx.grains.frustumCulled = false;
        Sx.grains.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
        Sx.grains.instanceColor = new THREE.InstancedBufferAttribute(new Float32Array(NALL * 3), 3); Sx.grains.instanceColor.setUsage(THREE.DynamicDrawUsage);
        scene.add(Sx.grains);

        // --- 光: 止まった夕日の残照(後ろ上から)・面光源(地平の霞)・弱い半球光 ---
        Sx.key = new THREE.DirectionalLight(0xd9822b, 2.4); Sx.key.position.set(-3, 5, -8); scene.add(Sx.key);
        Sx.fill = new THREE.DirectionalLight(0xffd9a0, 0.35); Sx.fill.position.set(3, 4, 7); scene.add(Sx.fill);
        Sx.hemi = new THREE.HemisphereLight(0xd9822b, 0x0e0d0c, 0.45); scene.add(Sx.hemi);
        Sx.area = new THREE.RectAreaLight(0xffd9a0, 5, 320, 10); Sx.area.position.set(30, 4, -120); Sx.area.lookAt(30, -4, 0); scene.add(Sx.area);
        // 人工の光(CYAN): 弾の曳光(半径200px)・銃口の閃光(330px)・命中の放射(460px)。数は固定(出し入れはシェーダーを作り直すので強さで)
        Sx.bLight = new THREE.PointLight(0x3fe0d0, 0, 2.0, 2); scene.add(Sx.bLight);
        Sx.mLight = new THREE.PointLight(0x3fe0d0, 0, 3.4, 2); scene.add(Sx.mLight);
        Sx.iLight = new THREE.PointLight(0x3fe0d0, 0, 4.8, 2); scene.add(Sx.iLight);
        scene.fog = new THREE.Fog(0x000000, 22, 210);

        // --- 霞の幕(遠景 z=-170、視差 0.14)。2D 版の「影の空気」+琥珀 25% の帯(y300–700)+横長の霞の塊 ---
        const ZH = -170, kY = 100 * D / (D - ZH);
        Sx.haze = new THREE.Mesh(new THREE.PlaneGeometry(260, 110), new THREE.ShaderMaterial({
          uniforms: { HA: { value: 1 }, Wl: { value: 1 }, kY: { value: kY }, carbon: { value: new THREE.Vector3(14, 13, 12).divideScalar(255) }, air: { value: new THREE.Vector3(18, 15, 12).divideScalar(255) }, amber: { value: new THREE.Vector3(217, 130, 43).divideScalar(255) } },
          vertexShader: `varying vec3 vW; void main(){ vec4 w = modelMatrix * vec4(position, 1.); vW = w.xyz; gl_Position = projectionMatrix * viewMatrix * w; }`,
          fragmentShader: `varying vec3 vW; uniform float HA, Wl, kY; uniform vec3 carbon, air, amber;
            float h(vec2 p){ return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
            float vn(vec2 p){ vec2 i = floor(p), f = fract(p); f = f*f*(3.-2.*f); return mix(mix(h(i), h(i+vec2(1,0)), f.x), mix(h(i+vec2(0,1)), h(i+vec2(1,1)), f.x), f.y); }
            vec3 lin(vec3 c){ return mix(c/12.92, pow((c+.055)/1.055, vec3(2.4)), step(.04045, c)); }
            void main(){
              float py = 540. - vW.y * kY;
              float u = clamp(py / 1080., 0., 1.), aa = u < .5 ? mix(.5, 1., u/.5) : mix(1., .4, (u-.5)/.5);
              vec3 c = mix(carbon, air, aa * Wl);
              float t = (py - 300.) / 400., b = t < .55 ? t/.55 : (1.-t)/.45; b = clamp(b, 0., 1.) * step(0., t) * step(t, 1.);
              float n = vn(vec2(vW.x * .045, vW.y * .16)) * .65 + vn(vec2(vW.x * .11 + 17., vW.y * .38)) * .35;
              float blob = smoothstep(.5, .85, n) * .085 * smoothstep(360., 470., py) * (1. - smoothstep(600., 680., py));
              c = mix(c, amber, (.13 * b + blob) * HA);
              gl_FragColor = vec4(lin(c), 1.); }`,
          depthWrite: true, fog: false, toneMapped: false }));
        Sx.haze.position.set(40, 0, ZH); scene.add(Sx.haze);

        // --- 岩の稜線(ローポリの高さ場、flatShading)。遠(z=-70)と中(z=-34)の2枚。霧で空気遠近 ---
        const ridge = (z0, base, amp, f1, f2, spike, seedOff, step, colHex) => {
          const d = D - z0, kp = 100 * D / d, x0 = 9.6 - 9.6 * d / D - 4, x1 = CAM_END + 9.6 * d / D + 4;
          const rows = [-7, -3.5, -1.2, 0, 1.0, 2.6, 5, 9, 15], nx = Math.ceil((x1 - x0) / step);
          const r = mulberry32(SEED + seedOff), pos = [], idx = [];
          const crest = (x) => { const py = base - 24 * amp * (VN(x / f1 + seedOff) + 1) - 12 * amp * VN(x / f2 + 31 + seedOff) - Math.pow(Math.max(0, VN(x / (f2 * 0.8) + 90 + seedOff)), 3) * spike; return (540 - py) / kp; };
          for (let iz = 0; iz < rows.length; iz++) for (let ix = 0; ix <= nx; ix++) {
            const x = x0 + ix * step + (iz % 2 ? step * 0.5 : 0) + (r() - 0.5) * step * 0.4, zo = rows[iz];
            let y = crest(x) + (zo < 0 ? -0.55 * Math.pow(-zo, 1.2) : -0.42 * Math.pow(zo, 1.15)) * (d / 60);
            y += (r() - 0.5) * 0.35 * (d / 60) * (zo === 0 ? 0.3 : 1);
            pos.push(x, y, z0 + zo + (r() - 0.5) * 0.4);
          }
          for (let iz = 0; iz < rows.length - 1; iz++) for (let ix = 0; ix < nx; ix++) {
            const a = iz * (nx + 1) + ix, b = a + 1, c = a + nx + 1, e = c + 1; idx.push(a, c, b, b, c, e);
          }
          const g = new THREE.BufferGeometry(); g.setAttribute("position", new THREE.Float32BufferAttribute(pos, 3)); g.setIndex(idx); g.computeVertexNormals();
          const m = new THREE.Mesh(g, new THREE.MeshStandardMaterial({ color: colHex, roughness: 0.9, metalness: 0, flatShading: true }));
          scene.add(m); return m;
        };
        Sx.ridgeFar = ridge(-70, 660, 1, 8, 2.4, 110, 0, 2.6, 0x2a221b);
        Sx.ridgeMid = ridge(-34, 850, 1.4, 5.5, 1.7, 90, 57, 1.5, 0x1c1712);

        // --- 銃口(架空の形): 円筒の銃身+スリット付きの先端+下部の箱。閃光の点光源で金属の面が浮かぶ ---
        const gunMat = new THREE.MeshStandardMaterial({ color: 0x24211e, roughness: 0.38, metalness: 0.75 });
        Sx.gun = new THREE.Group(); scene.add(Sx.gun);
        const cyl = (r0, x0, x1, y = 0) => { const m = new THREE.Mesh(new THREE.CylinderGeometry(r0, r0, x1 - x0, 20), gunMat); m.rotation.z = Math.PI / 2; m.position.set((x0 + x1) / 2, y, 0); Sx.gun.add(m); };
        cyl(0.13, -6.5, 1.32);

        Sx.fJets.forEach((g, k) => { const j = k % 3, up = k < 3 ? 1 : -1; setGlow(g, MUZ - 0.36 + j * 0.13 - 0.04, up * (0.4 + R() * 0.2), 0.3, 0.42 * 0.45, 0.42 * 1.9, (up > 0 ? 2.2 : 1.6) * If); });
        Sx.fRays.forEach((g, k) => { const th = (k / 7) * 6.283 + R() * 0.5, len = (1.2 + R() * 1.6) * If * (Math.cos(th) > 0 ? 1.5 : 1);
          setGlow(g, fx + Math.cos(th) * (0.4 + len / 2), Math.sin(th) * (0.32 + len / 2) * 0.8, 0.3, len / 2, 0.02 + R() * 0.02, 1.6 * If, th); });
        post.vig && (finish.uniforms.ca.value = If);
        // 敵
        let hx = null, hy = 520, tilt = 0, intact = true;
        if (L >= 95.5 && L <= 101.6) { const u = clamp((L - 96) / 5); hx = 1480 + 660 * Math.pow(1 - u, 2.4); }
        else if (L >= 104.5) { const k = sm((L - 105) / 12); hx = 1480 + 50 * k; hy = 520 - 8 * k; tilt = 0.14 * k; intact = false; }
        Sx.enemy.visible = hx !== null;
        if (hx !== null) { Sx.enemy.position.set(A.cx + (hx - 960) / 100, (540 - hy) / 100, 0); Sx.enemy.rotation.z = -tilt; Sx.visor.visible = Sx.rim.visible = intact; }
        // 炸裂
        const tau = A.tau, Ex = tau > 0 ? Math.exp(-(tau - 0.033) / 0.11) : 0;
        Sx.iLight.position.set(IMP.x - 0.3, IMP.y, 0.6); Sx.iLight.intensity = 70 * Ex;
        setGlow(Sx.iHalo, IMP.x, IMP.y, 0.5, 5.2, 5.2, 0.32 * Ex); setGlow(Sx.iHalo2, IMP.x, IMP.y, 0.5, 2.1, 2.1, 1.1 * Ex); setGlow(Sx.iCore, IMP.x, IMP.y, 0.6, 0.7, 0.7, 5 * Ex * Ex);
        const sa = tau > 0 ? 1 - sm((L - 111) / 12) : 0;
        Sx.shards.visible = sa > 0.002;
        if (Sx.shards.visible) {
          Sx.shards.material.opacity = sa; Sx.shards.material.emissiveIntensity = 0.25 + 1.6 * Ex;
          SHARDS.forEach((h, i) => { const e = (1 - Math.exp(-h.k * tau)) / h.k, gk = 15 / h.k;
            V1.set(IMP.x + h.vx * e, IMP.y + (h.vy + gk) * e - gk * tau, IMP.z + h.vz * e);
            Q1.setFromAxisAngle(h.ax, h.ph + h.w * tau); M4.compose(V1, Q1, V2.set(h.sz * h.sx, h.sz, h.sz)); Sx.shards.setMatrixAt(i, M4); });
          Sx.shards.instanceMatrix.needsUpdate = true;
        }
        EMB.forEach((e) => { const a = tau > 0 ? (0.13 + 0.55 * (1 - sm((L - 108) / 23))) * (0.88 + 0.12 * Math.sin(e.f * tau + e.ph)) : 0;
          const rr = e.r + 0.12 * tau, x = IMP.x + Math.cos(e.th) * rr, y = IMP.y + Math.sin(e.th) * rr + 0.1 * tau;
          const kh = alphaLin(a * 0.25, "#3FE0D0")[1] / C.cyan[1], kc = alphaLin(Math.min(0.1, a * 0.8), "#3FE0D0")[1] / C.cyan[1];
          setGlow(e.g1, x, y, e.z, e.sz * 2.4, e.sz * 2.4, kh * 1.7); setGlow(e.g2, x, y, e.z, e.sz * 1.3, e.sz * 1.3, kc * 2.2); });
        // 粒(t と t−dlt の位置を結んで伸ばす=シャッター中の流れ。カメラの移動分も相対で足す)
        const spinS = A.s;
        for (let i = 0; i < NG; i++) {
          grainAt(i, t, A.cx, A.s, A.bx, L, A.tau, P1v);
          if (dlt > 0) { grainAt(i, t - dlt, B.cx, B.s, B.bx, B.L, B.tau, P0v); P0v.add(V1.subVectors(A.cam, B.cam)); if (Math.abs(P1v.x - P0v.x) > G.wd[i] / 2) P0v.copy(P1v); }
          else P0v.copy(P1v);
          Q2.setFromAxisAngle(V2.set(G.ax[i * 3], G.ax[i * 3 + 1], G.ax[i * 3 + 2]), G.sp[i] * spinS + G.ph[i]);
          setStreak(Sx.grains, i, P0v, P1v, G.r[i], Q2, G.br[i], TMPC);
        }
        // 砂の衝撃輪(命中点から放射、傾いた円。前後の位置で流れを描く)
        const Rr = (q) => 8.2 * (1 - Math.exp(-Math.max(0, q) / 0.16)), ra = tau > 0 ? (1 - sm(tau / 0.6)) * Wl : 0;
        for (let i = 0; i < NRING; i++) {
          const idx = NG + i;
          if (ra <= 0.002) { M4.makeScale(0, 0, 0); Sx.grains.setMatrixAt(idx, M4); continue; }
          const c = Math.cos(RG.th[i]), s = Math.sin(RG.th[i]);
          const dir = V2.set(c, s * 0.92, RG.zj[i] + 0.35 * c).normalize();
          const r1 = Rr(tau) * (1 + RG.j[i]), r0 = Rr(tau - 1 / 60) * (1 + RG.j[i]);
          P1v.copy(IMP).addScaledVector(dir, r1); P0v.copy(IMP).addScaledVector(dir, r0);
          setStreak(Sx.grains, idx, P0v, P1v, RG.r[i], Q2.identity(), RG.a[i] * ra * 1.6, TMPC);
        }
        Sx.grains.instanceMatrix.needsUpdate = true; Sx.grains.instanceColor.needsUpdate = true;
        // ピント: 弾道面(z=0)に合わせる。奥の稜線と手前の粒がボケる(望遠の圧縮)
        post.dof.focus = D - 0; post.dof.aper = 600; post.dof.maxCoc = 16;
      }

      function setupInsert(F) {
        const k = F - 102; ins.mat.emissiveMap = ins.tex[k]; ins.mat.needsUpdate = true;
        const P = ins.P, dist = 1.9 - 0.06 * k, a = -0.55;
        ins.cam.position.set(P.x + Math.sin(a) * dist, P.y + 0.18 * dist, P.z + Math.cos(a) * dist);
        ins.cam.lookAt(P.x + 0.12, P.y - 0.05, P.z);
        post.dof.focus = ins.cam.position.distanceTo(P); post.dof.aper = 90; post.dof.maxCoc = 16;
        finish.uniforms.ca.value = 0;
      }

      function renderAt(tq) {
        const t = clamp(tq, 0, DUR - 1 / FPS / 2), F = Math.round(t * FPS);
        if (F >= 102 && F <= 104) {
          post.dof.scene = ins.scene; post.dof.camera = ins.cam; setupInsert(F);
          post.composer.renderToScreen = true; post.render(); return;
        }
        post.dof.scene = scene; post.dof.camera = camera;
        const L = t * FPS, blurWin = L >= 77.5 && L <= 101.5, SH = 0.6 / FPS;
        const K = blurWin ? clamp(Math.ceil(rateAt(t) * 2), 1, 8) : 1;
        if (K === 1) { update(t, blurWin ? SH : 0); post.composer.renderToScreen = true; post.render(); return; }
        // 加速区間: 露光 216° を K 回に分けて描き平均(粒は各区間の中で流れとして伸ばす)
        post.composer.renderToScreen = false;
        renderer.setRenderTarget(accRT); renderer.setClearColor(0x000000, 1); renderer.clear();
        for (let k = 0; k < K; k++) {
          const tk = t - SH * k / (K - 1);
          update(tk, SH / K);
          post.render();
          accQ.material.uniforms.tex.value = post.composer.readBuffer.texture; accQ.material.uniforms.w.value = 1 / K;
          renderer.setRenderTarget(accRT); renderer.autoClear = false; accQ.render(renderer); renderer.autoClear = true;
        }
        renderer.setRenderTarget(null); cpyQ.render(renderer);
        post.composer.renderToScreen = true;
      }

      build();
      window.addEventListener("hf-seek", (e) => renderAt(e.detail.time));
      window.__hf = window.__hf || {}; window.__hf.buildReady = window.__hf.buildReady || {};
      window.__hf.buildReady["three-scene"] = Promise.resolve().then(() => renderAt(window.__hfThreeTime || 0));
    </script>
