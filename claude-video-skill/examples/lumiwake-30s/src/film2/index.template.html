<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>LUMIWAKE 30s v2</title>
<style>
@font-face{font-family:'HUD';src:url('assets/fonts/hud.otf') format('opentype');}
/*JP_FONT_FACES*/
html,body{margin:0;padding:0;background:#000;}
#root{position:relative;overflow:hidden;background:#000;}
#film{position:absolute;left:0;top:0;width:100%;height:100%;}
</style>
</head>
<body>
<!-- 架空のゲーム『LUMIWAKE』30秒ティザー v2。canvas 1枚に、止めたタイムラインの時刻からコマ番号 f を出して FILM2.renderAt(ctx, f) で描く(全コマが f の純関数)。 -->
<div id="root" data-composition-id="lumiwake2" data-start="0" data-duration="30" data-width="1920" data-height="1080" data-fps="30">
  <canvas id="film" class="clip" data-start="0" data-duration="30" data-track-index="0" width="1920" height="1080"></canvas>
</div>
<script src="assets/gsap.min.js"></script>
<script src="assets/film2.js"></script>
<script>
window.__timelines = window.__timelines || {};
window.__hf = window.__hf || {}; window.__hf.buildReady = window.__hf.buildReady || {};
const filmReady = FILM2.init();
window.__hf.buildReady.film2 = filmReady;
filmReady.then(() => {
  const ctx = document.getElementById("film").getContext("2d");
  let last = -1;
  const draw = (t) => { const f = Math.min(899, Math.max(0, Math.round(t * 30))); if (f === last) return; last = f; FILM2.renderAt(ctx, f); };
  const st = { v: 0 };
  const tl = gsap.timeline({ paused: true });
  tl.fromTo(st, { v: 0 }, { v: 1, duration: 30, ease: "none", onUpdate: () => draw(tl.time()) }, 0);
  window.addEventListener("hf-seek", (e) => draw(e.detail.time));
  draw(0);
  window.__timelines["lumiwake2"] = tl;
});
</script>
</body>
</html>
