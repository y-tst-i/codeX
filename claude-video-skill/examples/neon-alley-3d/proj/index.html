<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="assets/gsap.min.js"></script>
    <script type="importmap">
      { "imports": { "three": "./assets/three/three.module.min.js", "three/addons/": "./assets/three/addons/" } }
    </script>
    <style>
      @font-face { font-family: "Dela"; src: url("assets/fonts/dela.woff2") format("woff2"); font-display: block; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #05060c; }
      #root { position: relative; width: 1920px; height: 1080px; background: #05060c; overflow: hidden; }
      #gl { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; display: block; }
      #flash { position: absolute; inset: 0; background: #fff; opacity: 0; pointer-events: none; }
      #fontwarm { position: absolute; left: -9999px; top: 0; font-family: "Dela"; font-size: 20px; color: #000; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="15" data-width="1920" data-height="1080">
      <canvas id="gl"></canvas>
      <div id="flash"></div>
      <div id="fontwarm">配達夜市路地営業中酒場電気急便雨屋台湯OPEN24</div>
    </div>
    <script>
      // DOM 用 timeline: 白い閃光(場面転換)だけ。3D は hf-seek で描く。
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      const F = "#flash";
      tl.set(F, { opacity: 0 }, 0);
      // S1 -> S2: 目のフレアから白
      tl.to(F, { opacity: 1, duration: 0.1, ease: "power2.in" }, 2.88);
      tl.to(F, { opacity: 0, duration: 0.3, ease: "power2.out" }, 3.0);
      // S2 -> S3: 短い白(2コマ)
      tl.to(F, { opacity: 0.85, duration: 0.033, ease: "none" }, 6.967);
      tl.to(F, { opacity: 0, duration: 0.17, ease: "power2.out" }, 7.0);
      // S3 -> S4: 光の筋から白へ
      tl.to(F, { opacity: 1, duration: 0.28, ease: "power3.in" }, 10.22);
      tl.to(F, { opacity: 0, duration: 0.45, ease: "power2.out" }, 10.5);
      tl.set({}, {}, 15);
      window.__timelines["main"] = tl;
    </script>
    <script type="module">
      import * as THREE from "three";
      import { RoundedBoxGeometry } from "three/addons/geometries/RoundedBoxGeometry.js";
      import { TextGeometry } from "three/addons/geometries/TextGeometry.js";
      import { FontLoader } from "three/addons/loaders/FontLoader.js";
      import { Reflector } from "three/addons/objects/Reflector.js";
      import { makePost } from "./assets/post.js";

      const DUR = 15, W = 1920, H = 1080;
      const mulberry32 = (a) => () => { a |= 0; a = (a + 0x6d2b79f5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
      const clamp = (x, a, b) => Math.min(b, Math.max(a, x)), lerp = (a, b, k) => a + (b - a) * k;
      const smooth = (a, b, x) => { const k = clamp((x - a) / (b - a), 0, 1); return k * k * (3 - 2 * k); };
      const ease3 = (a, b, x) => { const k = clamp((x - a) / (b - a), 0, 1); return k < 0.5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2; };
      const outC = (a, b, x) => { const k = clamp((x - a) / (b - a), 0, 1); return 1 - Math.pow(1 - k, 3); };
      const hash = (n) => { const s = Math.sin(n * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); };
      const vnoise = (x) => { const i = Math.floor(x), f = x - i, u = f * f * (3 - 2 * f); return lerp(hash(i), hash(i + 1), u) * 2 - 1; };
      const shake = (t, f, seed) => vnoise(t * f + seed * 17.3) * 0.6 + vnoise(t * f * 2.3 + seed * 5.1) * 0.4;

      const canvas = document.getElementById("gl");
      const renderer = new THREE.WebGLRenderer({ canvas, antialias: false, powerPreference: "high-performance", preserveDrawingBuffer: true });
      renderer.setPixelRatio(1);
      renderer.toneMapping = THREE.NeutralToneMapping;
      renderer.toneMappingExposure = 1.0;

      const scene = new THREE.Scene();
      scene.background = new THREE.Color("#05060c");
      scene.fog = new THREE.FogExp2(0x05060c, 0.035);
      const camera = new THREE.PerspectiveCamera(35, W / H, 0.05, 140);
      scene.add(camera);

      const post = makePost(renderer, scene, camera, W, H, { quality: "fast" });
      renderer.setSize(post.W, post.H, false);
      post.bloom.strength = 0.5; post.bloom.radius = 0.55; post.bloom.threshold = 1.3;

      // ---------- パレット(場面ごとに一色へ振り切る) ----------
      const PAL = [
        { name: "A", fog: "#030a1a", c: ["#22e4ff", "#2a6bff", "#7a3cff", "#18ffd0"], dens: 0.04, sky: "#0a2a6a" },
        { name: "B", fog: "#16030b", c: ["#ff1e3c", "#ff2bd0", "#ff5a8a", "#ff3a1a"], dens: 0.035, sky: "#5a0620" },
        { name: "C", fog: "#180a03", c: ["#ff7a1a", "#ffb43a", "#ff4a1a", "#ffd27a"], dens: 0.032, sky: "#6a2a06" },
        { name: "D", fog: "#07051a", c: ["#ff2d95", "#2de2ff", "#8a4bff", "#ff6ad5"], dens: 0.022, sky: "#2a0a5a" },
      ];
      const EYE = new THREE.Color("#5dffb0");

      // ---------- テクスチャ ----------
      function cvs(w, h) { const c = document.createElement("canvas"); c.width = w; c.height = h; return [c, c.getContext("2d")]; }
      function tex(c, srgb = true) { const t = new THREE.CanvasTexture(c); if (srgb) t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 4; return t; }
      function lighten(hex, k) { const c = new THREE.Color(hex); c.lerp(new THREE.Color(1, 1, 1), k); return "#" + c.getHexString(); }
      const texCache = {};
      function signTex(text, col, vertical) {
        const key = text + col + vertical; if (texCache[key]) return texCache[key];
        const chars = [...text];
        const w = vertical ? 256 : 220 * Math.max(chars.length, 2) + 80, h = vertical ? 200 * chars.length + 80 : 300;
        const [c, g] = cvs(w, h);
        g.fillStyle = "#07070b"; g.fillRect(0, 0, w, h);
        const r = mulberry32(text.length * 31 + col.charCodeAt(2));
        for (let i = 0; i < 400; i++) { g.fillStyle = `rgba(255,255,255,${r() * 0.03})`; g.fillRect(r() * w, r() * h, 2, 2); }
        g.lineJoin = "round";
        g.shadowColor = col; g.shadowBlur = 26; g.strokeStyle = col; g.lineWidth = 9;
        g.strokeRect(18, 18, w - 36, h - 36);
        g.shadowBlur = 0; g.strokeStyle = lighten(col, 0.7); g.lineWidth = 3; g.strokeRect(18, 18, w - 36, h - 36);
        g.textAlign = "center"; g.textBaseline = "middle";
        const fs = vertical ? 168 : 190;
        g.font = `${fs}px Dela`;
        const drawAll = () => {
          if (vertical) chars.forEach((ch, i) => g.fillText(ch, w / 2, 40 + 200 * i + 100));
          else g.fillText(text, w / 2, h / 2 + 8);
        };
        g.shadowColor = col; g.shadowBlur = 40; g.fillStyle = col; drawAll();
        g.shadowBlur = 12; g.fillStyle = lighten(col, 0.55); drawAll();
        const t = tex(c); texCache[key] = t; return t;
      }
      function windowTex(seed, hue) {
        const [c, g] = cvs(256, 512); const r = mulberry32(seed);
        g.fillStyle = "#000"; g.fillRect(0, 0, 256, 512);
        for (let y = 20; y < 500; y += 44) for (let x = 14; x < 240; x += 40) {
          if (r() < 0.32) { const warm = r() < 0.6; g.fillStyle = warm ? `rgba(255,${150 + r() * 60 | 0},${70 + r() * 50 | 0},${0.35 + r() * 0.5})` : hue; g.globalAlpha = 0.25 + r() * 0.6; g.fillRect(x, y, 26, 30); g.globalAlpha = 1; }
        }
        return tex(c);
      }
      function shopTex(seed, col) {
        const [c, g] = cvs(256, 128); const r = mulberry32(seed);
        const gr = g.createLinearGradient(0, 0, 0, 128); gr.addColorStop(0, col); gr.addColorStop(1, "#140c08");
        g.fillStyle = gr; g.fillRect(0, 0, 256, 128);
        g.globalAlpha = 0.55; g.fillStyle = "#000";
        for (let i = 0; i < 4; i++) { const x = r() * 220, w = 14 + r() * 26, h = 40 + r() * 50; g.beginPath(); g.ellipse(x + w / 2, 128 - h - 8, w * 0.35, w * 0.4, 0, 0, 7); g.fill(); g.fillRect(x, 128 - h, w, h); }
        g.globalAlpha = 1; g.fillStyle = "#050505";
        for (let x = 0; x <= 256; x += 64) g.fillRect(x - 3, 0, 6, 128);
        g.fillRect(0, 0, 256, 8); g.fillRect(0, 60, 256, 4);
        if (r() < 0.6) { g.fillStyle = "rgba(0,0,0,.6)"; for (let x = 8; x < 250; x += 28) g.fillRect(x, 8, 22, 34 + r() * 6); }
        return tex(c);
      }
      function asphaltTex() {
        const N = 1024; const [c, g] = cvs(N, N); const [a, ga] = cvs(N, N); const r = mulberry32(99);
        g.fillStyle = "#1a1b20"; g.fillRect(0, 0, N, N);
        for (let i = 0; i < 26000; i++) { const v = 14 + r() * 40 | 0; g.fillStyle = `rgb(${v},${v},${v + 3})`; g.fillRect(r() * N, r() * N, 1 + r() * 3, 1 + r() * 3); }
        // ひび
        g.strokeStyle = "rgba(0,0,0,.6)"; g.lineWidth = 2;
        for (let i = 0; i < 18; i++) { g.beginPath(); let x = r() * N, y = r() * N; g.moveTo(x, y); for (let k = 0; k < 8; k++) { x += (r() - 0.5) * 90; y += (r() - 0.5) * 90; g.lineTo(x, y); } g.stroke(); }
        // 不透明度: 乾いた所 .78、濡れ .5、水たまり .06
        ga.fillStyle = "rgb(150,150,150)"; ga.fillRect(0, 0, N, N);
        for (let i = 0; i < 22; i++) {
          const x = r() * N, y = r() * N, rad = 60 + r() * 190;
          const gr = ga.createRadialGradient(x, y, rad * 0.2, x, y, rad);
          gr.addColorStop(0, "rgb(14,14,14)"); gr.addColorStop(0.65, "rgb(24,24,24)"); gr.addColorStop(1, "rgba(150,150,150,0)");
          ga.fillStyle = gr; ga.beginPath(); ga.ellipse(x, y, rad, rad * (0.5 + r() * 0.6), r() * 3, 0, 7); ga.fill();
        }
        for (let i = 0; i < 4000; i++) { const v = 120 + r() * 90 | 0; ga.fillStyle = `rgb(${v},${v},${v})`; ga.fillRect(r() * N, r() * N, 2, 2); }
        const tc = tex(c), ta = tex(a, false);
        for (const t of [tc, ta]) { t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(6, 40); }
        return [tc, ta];
      }
      function discTex(ring) {
        const [c, g] = cvs(128, 128);
        const gr = g.createRadialGradient(64, 64, 0, 64, 64, 62);
        if (ring) { gr.addColorStop(0, "rgba(255,255,255,.55)"); gr.addColorStop(0.82, "rgba(255,255,255,.75)"); gr.addColorStop(0.92, "rgba(255,255,255,1)"); gr.addColorStop(1, "rgba(255,255,255,0)"); }
        else { gr.addColorStop(0, "rgba(255,255,255,1)"); gr.addColorStop(0.35, "rgba(255,255,255,.5)"); gr.addColorStop(1, "rgba(255,255,255,0)"); }
        g.fillStyle = gr; g.fillRect(0, 0, 128, 128); return tex(c);
      }
      function smokeTex() {
        const [c, g] = cvs(256, 256); const r = mulberry32(5);
        for (let i = 0; i < 60; i++) { const x = 60 + r() * 136, y = 60 + r() * 136, rad = 20 + r() * 70; const gr = g.createRadialGradient(x, y, 0, x, y, rad); gr.addColorStop(0, "rgba(255,255,255,.12)"); gr.addColorStop(1, "rgba(255,255,255,0)"); g.fillStyle = gr; g.fillRect(0, 0, 256, 256); }
        return tex(c);
      }
      function shadowTex() {
        const [c, g] = cvs(128, 128); const gr = g.createRadialGradient(64, 64, 4, 64, 64, 62);
        gr.addColorStop(0, "rgba(0,0,0,.9)"); gr.addColorStop(0.5, "rgba(0,0,0,.55)"); gr.addColorStop(1, "rgba(0,0,0,0)");
        g.fillStyle = gr; g.fillRect(0, 0, 128, 128); return tex(c);
      }

      // ---------- 環境マップ(ネオンの部屋を PMREM で焼く → クロームに色が映る) ----------
      const pmrem = new THREE.PMREMGenerator(renderer);
      function neonEnv(pal, seed) {
        const s = new THREE.Scene(); s.background = new THREE.Color(pal.fog);
        const r = mulberry32(seed);
        const room = new THREE.Mesh(new THREE.BoxGeometry(30, 14, 30), new THREE.MeshBasicMaterial({ color: new THREE.Color(pal.fog).multiplyScalar(1.4), side: THREE.BackSide }));
        s.add(room);
        for (let i = 0; i < 16; i++) {
          const col = new THREE.Color(pal.c[i % 4]).multiplyScalar(2 + r() * 5);
          const m = new THREE.Mesh(new THREE.PlaneGeometry(1 + r() * 4, 0.3 + r() * 2.5), new THREE.MeshBasicMaterial({ color: col, side: THREE.DoubleSide }));
          const a = r() * Math.PI * 2; m.position.set(Math.cos(a) * 12, -3 + r() * 9, Math.sin(a) * 12); m.lookAt(0, 0, 0); s.add(m);
        }
        const top = new THREE.Mesh(new THREE.PlaneGeometry(10, 2), new THREE.MeshBasicMaterial({ color: new THREE.Color(1, 1, 1).multiplyScalar(2.5), side: THREE.DoubleSide }));
        top.position.set(0, 6.9, 0); top.rotation.x = Math.PI / 2; s.add(top);
        return pmrem.fromScene(s, 0.02).texture;
      }

      // ---------- 共通の材質・形 ----------
      const BOX = new THREE.BoxGeometry(1, 1, 1), PLANE = new THREE.PlaneGeometry(1, 1);
      const wallMats = [0x15161d, 0x1b1a20, 0x111319, 0x201c1f].map((c) => new THREE.MeshStandardMaterial({ color: c, roughness: 0.82, metalness: 0.15 }));
      const darkMetal = new THREE.MeshStandardMaterial({ color: 0x202228, roughness: 0.4, metalness: 0.85 });
      const hdr = (hex, k) => new THREE.MeshBasicMaterial({ color: new THREE.Color(hex).multiplyScalar(k) });

      // ---------- 床(鏡 + 濡れたアスファルト) ----------
      const ReflShader = {
        name: "WetReflector",
        uniforms: { color: { value: null }, tDiffuse: { value: null }, textureMatrix: { value: null }, uTime: { value: 0 }, uStr: { value: 0.012 }, uStretch: { value: 0.012 } },
        vertexShader: `uniform mat4 textureMatrix; varying vec4 vUv; varying vec3 vW;
          #include <common>
          #include <logdepthbuf_pars_vertex>
          void main(){ vUv = textureMatrix * vec4(position,1.0); vW = (modelMatrix*vec4(position,1.0)).xyz; gl_Position = projectionMatrix*modelViewMatrix*vec4(position,1.0);
          #include <logdepthbuf_vertex>
          }`,
        fragmentShader: `uniform vec3 color; uniform sampler2D tDiffuse; uniform float uTime; uniform float uStr; uniform float uStretch; varying vec4 vUv; varying vec3 vW;
          #include <logdepthbuf_pars_fragment>
          void main(){
            #include <logdepthbuf_fragment>
            vec2 d = vec2(sin(vW.x*3.1+vW.z*1.7+uTime*1.3)+0.5*sin(vW.z*7.3-uTime*0.7), cos(vW.z*2.9+uTime*1.1)+0.5*cos(vW.x*6.1+uTime*0.9))*uStr;
            vec4 uv = vUv; uv.xy += d*uv.w;
            vec3 acc = vec3(0.0); float wsum = 0.0;
            for (int i=-3;i<=3;i++){ float fi=float(i); float w = exp(-fi*fi*0.18); vec4 u2 = uv; u2.y += fi*uStretch*uv.w; acc += texture2DProj(tDiffuse,u2).rgb*w; wsum += w; }
            gl_FragColor = vec4(acc/wsum*color, 1.0);
            #include <tonemapping_fragment>
            #include <colorspace_fragment>
          }`,
      };
      const mirror = new Reflector(new THREE.PlaneGeometry(60, 260), { textureWidth: 960, textureHeight: 540, multisample: 0, color: 0xffffff, shader: ReflShader, clipBias: 0.003 });
      mirror.material.uniforms.color.value = new THREE.Color(0.78, 0.8, 0.86);
      mirror.rotation.x = -Math.PI / 2; mirror.position.set(0, 0, -60); scene.add(mirror);
      const [asphC, asphA] = asphaltTex();
      const asphalt = new THREE.Mesh(new THREE.PlaneGeometry(60, 260), new THREE.MeshStandardMaterial({ map: asphC, alphaMap: asphA, transparent: true, roughness: 0.42, metalness: 0.1, depthWrite: true }));
      asphalt.rotation.x = -Math.PI / 2; asphalt.position.set(0, 0.004, -60); scene.add(asphalt);

      // ---------- 路地を作る ----------
      const SH = shadowTex(), DISC = discTex(true), SOFT = discTex(false), SMOKE = smokeTex();
      function makeAlley(o) {
        const G = new THREE.Group(); const r = mulberry32(o.seed); const P = o.pal.c;
        const winTex = [0, 1, 2].map((i) => windowTex(o.seed + i, P[i]));
        const bulbs = [];
        for (const side of [-1, 1]) {
          let z = o.z0;
          while (z > o.z1) {
            let L = 1.6 + r() * 2.8; const h = 6 + r() * 7, set = r() * 0.5, d = 3;
            if (z - L < o.z1) L = z - o.z1; if (L < 0.7) break;
            const face = side * (o.hw + set);
            const fac = new THREE.Mesh(BOX, wallMats[(r() * 4) | 0]); fac.scale.set(d, h, L - 0.06); fac.position.set(face + side * d / 2, h / 2, z - L / 2); G.add(fac);
            // 上階の窓
            const wm = new THREE.MeshStandardMaterial({ color: 0x050507, emissive: 0xffffff, emissiveIntensity: 1.6, emissiveMap: winTex[(r() * 3) | 0], roughness: 0.6 });
            const win = new THREE.Mesh(PLANE, wm); win.scale.set(L * 0.85, h - 3.5); win.position.set(face - side * 0.02, 3.2 + (h - 3.5) / 2, z - L / 2); win.rotation.y = -side * Math.PI / 2; G.add(win);
            // 1階の店の明かり
            if (r() < 0.65) {
              const sc = r() < 0.4 ? "#ffb070" : P[(r() * 4) | 0];
              const shop = new THREE.Mesh(PLANE, new THREE.MeshBasicMaterial({ map: shopTex((r() * 1e6) | 0, sc), color: new THREE.Color().setScalar(0.7 + r() * 0.9) })); shop.scale.set(L * 0.7, 1.5); shop.position.set(face - side * 0.03, 0.95, z - L / 2); shop.rotation.y = -side * Math.PI / 2; G.add(shop);
              const awn = new THREE.Mesh(BOX, darkMetal); awn.scale.set(0.6, 0.06, L * 0.8); awn.position.set(face - side * 0.3, 1.85, z - L / 2); G.add(awn);
            }
            // 突き出し看板(縦書き)
            if (r() < 0.8) {
              const txt = o.texts[(r() * o.texts.length) | 0], col = P[(r() * 4) | 0];
              const n = [...txt].length, sh = 0.55 * n + 0.25, sw = 0.62;
              const sg = new THREE.Group();
              const m = new THREE.MeshBasicMaterial({ map: signTex(txt, col, true), color: new THREE.Color().setScalar(2.6 + r() * 2.4) });
              const p1 = new THREE.Mesh(PLANE, m); p1.scale.set(sw, sh); p1.position.z = 0.03; sg.add(p1);
              const p2 = p1.clone(); p2.rotation.y = Math.PI; p2.position.z = -0.03; sg.add(p2);
              const fr = new THREE.Mesh(BOX, darkMetal); fr.scale.set(sw + 0.06, sh + 0.06, 0.05); sg.add(fr);
              sg.position.set(face - side * (0.5 + r() * 0.15), 2.6 + r() * 3 + sh / 2, z - 0.3 - r() * (L - 0.6));
              sg.userData.flick = r() < 0.25 ? r() * 100 : -1; sg.userData.mat = m; sg.userData.base = m.color.r;
              G.add(sg); (o.flick || (o.flick = [])).push(sg);
            }
            // 壁の横看板
            if (r() < 0.55) {
              const txt = o.texts[(r() * o.texts.length) | 0], col = P[(r() * 4) | 0];
              const n = [...txt].length; const sw = 0.5 * n + 0.4, sh = 0.62;
              const m = new THREE.MeshBasicMaterial({ map: signTex(txt, col, false), color: new THREE.Color().setScalar(2.4 + r() * 2) });
              const p = new THREE.Mesh(PLANE, m); p.scale.set(sw, sh); p.position.set(face - side * 0.04, 2.2 + r() * 1.2, z - L / 2); p.rotation.y = -side * Math.PI / 2; G.add(p);
            }
            // ネオン管の輪・縦線
            if (r() < 0.45) {
              const col = P[(r() * 4) | 0];
              const ring = new THREE.Mesh(new THREE.TorusGeometry(0.28 + r() * 0.3, 0.022, 8, 48), hdr(col, 5));
              ring.position.set(face - side * 0.05, 3 + r() * 3, z - L * (0.2 + r() * 0.6)); ring.rotation.y = -side * Math.PI / 2; G.add(ring);
            }
            if (r() < 0.5) {
              const col = P[(r() * 4) | 0]; const tube = new THREE.Mesh(BOX, hdr(col, 4.5)); const hh = 1.5 + r() * 3;
              tube.scale.set(0.035, hh, 0.035); tube.position.set(face - side * 0.05, 2.2 + hh / 2, z - 0.1); G.add(tube);
            }
            // 室外機・配管
            if (r() < 0.6) { const ac = new THREE.Mesh(BOX, darkMetal); ac.scale.set(0.45, 0.5, 0.7); ac.position.set(face - side * 0.25, 2.4 + r() * 4, z - r() * L); G.add(ac); }
            if (r() < 0.4) { const pp = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.05, h, 8), darkMetal); pp.position.set(face - side * 0.12, h / 2, z - L + 0.15); G.add(pp); }
            z -= L;
          }
        }
        // 頭上の電線と電球
        const cableMat = new THREE.MeshStandardMaterial({ color: 0x08080a, roughness: 0.6 });
        for (let z = o.z0 - 1; z > o.z1; z -= 2.2 + r() * 3) {
          const y = 4.6 + r() * 2.2, sag = 0.4 + r() * 0.5, x0 = -o.hw - 0.2, x1 = o.hw + 0.2, z2 = z - (r() - 0.5) * 2;
