<!doctype html><meta charset="utf-8">
<!-- 案A+C(v4、53秒ボード v2)の描画ページ。?f=<曲のコマ番号>&v=clean|look。f=60|370|740|840|1080|1340〜1590。1920×1080。
     字は gen/glyphs.js(tools/setup_v2.sh を TEXT=text_v3.txt で。git に入れない)。描画の計測値は window.__stats。v3 の版は styleframes_v3.html -->
<style>body{margin:0;background:#000}</style>
<body><canvas id="c" width="1920" height="1080"></canvas>
<script src="gen/glyphs.js"></script>
<script src="common.js"></script>
<script src="cand_a4.js"></script>
<script>
(() => {
  const q = new URLSearchParams(location.search);
  const o = { f: +(q.get("f") || 840), look: (q.get("v") || "look") === "look" };
  const ctx = document.getElementById("c").getContext("2d", { willReadFrequently: true });
  ctx.fillStyle = "#000"; ctx.fillRect(0, 0, 1920, 1080);
  window.__stats = CAND_A4(ctx, o);
  document.title = JSON.stringify(window.__stats);
  window.__ready = true;
})();
</script>
