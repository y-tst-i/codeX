<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>夜明けの回路 6秒試作 A+C</title>
<style>
html,body{margin:0;padding:0;background:#000;}
#root{position:relative;overflow:hidden;background:#000;}
#film{position:absolute;left:0;top:0;width:100%;height:100%;}
</style>
</head>
<body>
<!-- 6秒の動きの試作(曲の 141〜320 コマ)。canvas 1枚に、止めたタイムラインの時刻から曲のコマ番号を出して PILOT6S.draw で描く(全コマがコマ番号の純関数)。
     字はフォントを使わず、書体(OFL)から作った字形の点列(assets/glyphs.js)で描くので、ページで読み込むフォントは無い。音は書き出し後に ffmpeg で付ける。 -->
<div id="root" data-composition-id="pilot6s" data-start="0" data-duration="6" data-width="1920" data-height="1080" data-fps="30">
  <canvas id="film" class="clip" data-start="0" data-duration="6" data-track-index="0" width="1920" height="1080"></canvas>
</div>
<script src="assets/gsap.min.js"></script>
<script src="assets/glyphs.js"></script>
<script src="assets/common.js"></script>
<script src="assets/timing.gen.js"></script>
<script src="assets/pilot6s.js"></script>
<script>
const LOOK = /*LOOK*/true;
window.__timelines = window.__timelines || {};
const ctx = document.getElementById("film").getContext("2d", { willReadFrequently: true });
const N = 180, F0 = PILOT_TIMING.range[0];
const draw = (t) => { const f = Math.min(N - 1, Math.max(0, Math.round(t * 30))); window.__last = PILOT6S.draw(ctx, F0 + f, { look: LOOK }); window.__lastFrame = f; };
const st = { v: 0 };
const tl = gsap.timeline({ paused: true });
tl.fromTo(st, { v: 0 }, { v: 1, duration: 6, ease: "none", onUpdate: () => draw(tl.time()) }, 0);
window.addEventListener("hf-seek", (e) => draw(e.detail.time));
draw(0);
window.__timelines["pilot6s"] = tl;
</script>
</body>
</html>
