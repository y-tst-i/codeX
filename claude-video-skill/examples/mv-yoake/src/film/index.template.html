<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>夜明けの回路 MV</title>
<style>
/*JP_FONT_FACES*/
html,body{margin:0;padding:0;background:#000;}
#root{position:relative;overflow:hidden;background:#000;}
#film{position:absolute;left:0;top:0;width:100%;height:100%;}
</style>
</head>
<body>
<!-- MV『夜明けの回路』(53.0 秒)。canvas 1 枚に、止めたタイムラインの時刻からコマ番号 f を出して FILM.renderAt(ctx, f) で描く(全コマが f の純関数)。
     歌詞の時刻は audio/lyric_timeline.json から(assets/film.js に埋め込まれる)。音(曲)は書き出し後に ffmpeg で付ける。 -->
<div id="root" data-composition-id="yoake" data-start="0" data-duration="53" data-width="1920" data-height="1080" data-fps="30">
  <canvas id="film" class="clip" data-start="0" data-duration="53" data-track-index="0" width="1920" height="1080"></canvas>
  <!--AUDIO-->
</div>
<script src="assets/gsap.min.js"></script>
<script src="assets/film.js"></script>
<script>
window.__timelines = window.__timelines || {};
window.__hf = window.__hf || {}; window.__hf.buildReady = window.__hf.buildReady || {};
const filmReady = FILM.init();
window.__hf.buildReady.film = filmReady;
filmReady.then(() => {
  const ctx = document.getElementById("film").getContext("2d");
  let last = -1;
  const draw = (t) => { const f = Math.min(1589, Math.max(0, Math.round(t * 30))); if (f === last) return; last = f; FILM.renderAt(ctx, f); };
  const st = { v: 0 };
  const tl = gsap.timeline({ paused: true });
  tl.fromTo(st, { v: 0 }, { v: 1, duration: 53, ease: "none", onUpdate: () => draw(tl.time()) }, 0);
  window.addEventListener("hf-seek", (e) => draw(e.detail.time));
  draw(0);
  window.__timelines["yoake"] = tl;
});
</script>
</body>
</html>
